<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页全景拍摄 · 青年科技学习导航</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0e1012; --card:#171a1d; --line:#262a2e;
    --text:#e8eaed; --dim:#98a0a8; --accent:#e74c3c; --ok:#3fb950;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 14px 40px}
  .wrap{width:100%;max-width:720px}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  header a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
           padding:4px 10px;border-radius:999px}
  header a:hover{color:var(--text);border-color:#3a4046}
  .sub{color:var(--dim);font-size:13px;margin:2px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .stage{position:relative;background:#000;aspect-ratio:16/9}
  .stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .stage .tip{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;
              background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0));
              font-size:13px;color:#dfe3e8;display:flex;justify-content:space-between;gap:10px}
  .stage .idle{position:absolute;inset:0;display:flex;flex-direction:column;
               align-items:center;justify-content:center;gap:10px;color:#7d858d;font-size:13px;text-align:center;padding:0 24px}
  .stage .idle svg{opacity:.5}
  .bar{height:8px;background:#22262a;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .2s linear}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 4px;font-size:13px;color:var(--dim)}
  .meta b{color:var(--text);font-weight:600}
  .pad{padding:0 16px 16px}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);
         background:#20242a;color:var(--text);padding:11px 18px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .primary{width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:600;
           border:none;background:var(--accent);color:#fff}
  .primary:active{transform:translateY(1px)}
  .ghost{width:100%;margin-top:10px;padding:11px;font-size:14px;color:var(--dim);
         background:transparent;border:1px dashed var(--line)}
  .row{display:flex;gap:10px;margin-top:12px}
  .row button{flex:1}
  .warn{background:#2a1f1c;border:1px solid #4a2f28;color:#f0b9ae;border-radius:12px;
        padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  .warn.show{display:block}
  .result{margin-top:16px;display:none}
  .result.show{display:block}
  .sphere{display:none;width:100%;aspect-ratio:1/0.85;max-height:min(58vh,520px);background:#000;
          border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
  .sphere.show{display:block}
  .viewer{background:#000;border:1px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden}
  .viewer img{display:block;height:min(46vh,420px);width:auto;max-width:none}
  .note{color:var(--dim);font-size:12px;margin-top:8px}
  .err{color:#ff8f80;font-size:13px;margin-top:10px;min-height:18px}
  .steps{color:var(--dim);font-size:13px;margin:14px 2px 0;padding-left:18px}
  .steps li{margin:4px 0}
  @media (min-width:720px){ .stage{aspect-ratio:16/9} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>网页全景拍摄</h1>
    <a href="/">返回导航</a>
  </header>
  <p class="sub">举着手机原地转一圈，页面自动抓拍、拼好，直接就能在球面上拖着看。全程在本地完成，照片不会上传。</p>

  <div class="warn" id="wx-tip">当前是微信内置浏览器，拿不到相机。请点右上角「···」，选「在浏览器打开」。</div>

  <div class="card">
    <div class="stage">
      <video id="cam" playsinline muted autoplay></video>
      <div class="idle" id="idle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.2-2h6.4l1.2 2h1.6A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
        <div>点下面的按钮开始，会请求使用相机</div>
      </div>
      <div class="tip" id="tip" style="display:none"><span id="tip-left"></span><span id="tip-right"></span></div>
    </div>

    <div class="meta">
      <span>进度 <b id="cnt">0 / 12</b></span>
      <span id="phase">等待开始</span>
    </div>
    <div class="pad">
      <div class="bar"><i id="bar"></i></div>
      <button class="primary" id="btn-main">开始拍摄</button>
      <button class="ghost" id="btn-import">已经有全景照片？从相册选一张</button>
      <input type="file" id="file-pano" accept="image/*" style="display:none">
      <div class="err" id="err"></div>
      <div class="row" id="after" style="display:none">
        <button id="btn-retry">重新拍</button>
        <button id="btn-download-eq">存球面图</button>
        <button id="btn-download">存长图</button>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="sphere" id="sphere"></div>
    <div class="viewer" id="flat"><img id="pano" alt="拼接后的全景图"></div>
    <p class="note" id="result-note"></p>
  </div>

  <ol class="steps">
    <li>把手机横过来，像举相机一样拿稳，站定别走动。</li>
    <li>点开始后有 3 秒准备时间，然后慢慢原地转一圈。</li>
    <li>转的过程中页面到角度会自动拍摄，不用手动点。</li>
    <li>镜头略高于胸口、稍微上仰一点，拍出来的天空更完整；脚下那圈会补成雾状。</li>
  </ol>
</div>

<script>
(function () {
  'use strict';

  var FRAME_COUNT = 12;
  var STEP_DEG = 30;
  var OUT_W = 960;
  var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
  var FAKE = /fake=1/.test(location.search);
  var EQVIEW = /eq=1/.test(location.search);
  var CIRCULAR = /circular=1/.test(location.search);
  var SOFTMODE = /soft=1/.test(location.search);
  var JITTER = /jitter=1/.test(location.search);

  var video = document.getElementById('cam');
  var idle = document.getElementById('idle');
  var idleHTML = idle.innerHTML;
  var tip = document.getElementById('tip');
  var tipLeft = document.getElementById('tip-left');
  var tipRight = document.getElementById('tip-right');
  var cntEl = document.getElementById('cnt');
  var phaseEl = document.getElementById('phase');
  var barEl = document.getElementById('bar');
  var btnMain = document.getElementById('btn-main');
  var btnRetry = document.getElementById('btn-retry');
  var btnImport = document.getElementById('btn-import');
  var picker = document.getElementById('file-pano');
  var btnDownload = document.getElementById('btn-download');
  var after = document.getElementById('after');
  var errEl = document.getElementById('err');
  var result = document.getElementById('result');
  var panoEl = document.getElementById('pano');
  var resultNote = document.getElementById('result-note');
  var sphereEl = document.getElementById('sphere');
  var stageEl = document.querySelector('.stage');
  var metaEl = document.querySelector('.meta');
  var flatEl = document.getElementById('flat');
  var btnDownloadEq = document.getElementById('btn-download-eq');

  if (isWeChat) document.getElementById('wx-tip').classList.add('show');

  var S = {
    stream: null,
    frames: [],
    capturing: false,
    busy: false,
    orientReady: false,
    lastAlpha: null,
    turn: 0,
    net: 0,
    angles: [],
    srcW: 0,
    needDeg: 0,
    timerId: null,
    panoBlob: null,
    panoUrl: null,
    eqBlob: null,
    eqUrl: null,
    angleMode: false
  };

  var grab = document.createElement('canvas');
  var gctx = grab.getContext('2d');

  function setPhase(t) { phaseEl.textContent = t; }
  function setCount(n) { cntEl.textContent = n + ' / ' + FRAME_COUNT; }
  function setBar(p) { barEl.style.width = Math.max(0, Math.min(100, p * 100)) + '%'; }
  function fail(msg) { errEl.textContent = msg; }

  function resetUI() {
    setPhase('等待开始');
    setCount(0);
    setBar(0);
    fail('');
    result.classList.remove('show');
    after.style.display = 'none';
    tip.style.display = 'none';
    stageEl.style.display = '';
    metaEl.style.display = '';
    barEl.parentNode.style.display = '';
    btnImport.style.display = '';
    btnRetry.textContent = '重新拍';
    btnMain.style.display = '';
    idle.innerHTML = idleHTML;
    idle.style.display = 'flex';
    btnMain.disabled = false;
    btnMain.textContent = '开始拍摄';
    if (S.panoUrl) { URL.revokeObjectURL(S.panoUrl); S.panoUrl = null; }
    if (S.eqUrl) { URL.revokeObjectURL(S.eqUrl); S.eqUrl = null; }
    panoEl.removeAttribute('src');
    S.panoBlob = null;
    S.eqBlob = null;
    sphereEl.classList.remove('show');
    flatEl.style.display = '';
    SOFT.eq = null;
    SOFT.yaw = 0;
    SOFT.pitch = 0;
    if (PSV && PSV.viewer) {
      try { PSV.viewer.destroy(); } catch (e) {}
      PSV.viewer = null;
    }
  }

  async function startCamera() {
    if (S.stream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (!FAKE) throw new Error('这个浏览器没有开放相机接口，请换用 Chrome、Safari 或 Edge');
    }
    var stream = FAKE ? makeFakeStream() : await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    S.stream = stream;
    video.srcObject = stream;
    await video.play();
    idle.style.display = 'none';
    tip.style.display = 'flex';
    await new Promise(function (resolve) {
      var t0 = Date.now();
      (function wait() {
        if (video.videoWidth > 0 || Date.now() - t0 > 3000) return resolve();
        setTimeout(wait, 120);
      })();
    });
  }

  function stopCamera() {
    if (S.stream) {
      S.stream.getTracks().forEach(function (t) { t.stop(); });
      S.stream = null;
    }
    video.srcObject = null;
  }

  async function enableOrientation(permPromise) {
    try {
      if (typeof DeviceOrientationEvent === 'undefined') return false;
      if (permPromise) {
        var r = await permPromise;
        if (r !== 'granted') return false;
      }
      window.addEventListener('deviceorientation', onOrient, true);
      S.orientReady = true;
      // 等一个 alpha 值，拿不到就退回定时模式
      await new Promise(function (r) { setTimeout(r, 900); });
      return S.lastAlpha !== null;
    } catch (e) {
      return false;
    }
  }

  function onOrient(e) {
    if (!e.alpha && e.alpha !== 0) return;
    var a = e.alpha;
    if (S.lastAlpha === null) { S.lastAlpha = a; return; }
    var d = a - S.lastAlpha;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    if (Math.abs(d) > 25) { S.lastAlpha = a; return; }
    S.turn += Math.abs(d);
    S.net += d;
    S.lastAlpha = a;
    if (S.capturing) {
      tipRight.textContent = '已转 ' + Math.round(S.turn) + '°';
      if (S.turn >= S.needDeg) {
        S.needDeg += STEP_DEG;
        takeFrame();
      }
    }
  }

  function takeFrame() {
    if (!S.capturing) return;
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    grab.width = w; grab.height = h;
    gctx.drawImage(video, 0, 0, w, h);
    var shotAngle = S.angleMode ? S.net : null;
    grab.toBlob(function (b) {
      if (!b) return;
      S.frames.push(b);
      S.angles.push(shotAngle);
      setCount(S.frames.length);
      setBar(S.frames.length / FRAME_COUNT);
      if (S.frames.length >= FRAME_COUNT) finishCapture();
    }, 'image/jpeg', 0.92);
  }

  function tickTimer() {
    if (!S.capturing) return;
    takeFrame();
  }

  async function beginCapture(permPromise) {
    errEl.textContent = '';
    result.classList.remove('show');
    after.style.display = 'none';
    btnMain.disabled = true;

    try {
      setPhase('正在启动相机');
      await startCamera();
    } catch (e) {
      btnMain.disabled = false;
      var name = (e && e.name) || '';
      if (name === 'NotAllowedError' || name === 'SecurityError') fail('相机权限被拒绝，请在地址栏的权限设置里允许后重试');
      else if (name === 'NotFoundError' || name === 'OverconstrainedError') fail('没有检测到可用的摄像头');
      else if (name === 'NotReadableError') fail('摄像头被其他应用占用，关掉相机类应用再试');
      else fail(String((e && e.message) || e));
      setPhase('等待开始');
      return;
    }

    if (video.videoWidth <= video.videoHeight) {
      fail('现在是竖屏，请把手机横过来再点开始（横屏才能拍出横向全景）');
      stopCamera();
      btnMain.disabled = false;
      setPhase('等待开始');
      return;
    }

    S.frames = [];
    S.turn = 0;
    S.net = 0;
    S.angles = [];
    S.srcW = video.videoWidth || 0;
    S.needDeg = STEP_DEG;
    setCount(0);
    setBar(0);

    var angleMode = FAKE ? false : await enableOrientation(permPromise);
    S.angleMode = angleMode;
    S.capturing = true;
    btnMain.textContent = '拍摄中…';
    setPhase('3 秒后开始，请举稳手机');
    tipLeft.textContent = '慢慢原地转一圈，别停顿';

    var n = 3;
    var cd = setInterval(function () {
      n -= 1;
      if (n > 0) { setPhase(n + ' 秒后开始，请举稳手机'); return; }
      clearInterval(cd);
      setPhase('转动中');
      if (angleMode) {
        // 转到位就自动拍，起始先拍一张
        takeFrame();
        if (S.frames.length === FRAME_COUNT) return;
      } else {
        setPhase('没有陀螺仪数据，按时间自动拍');
        takeFrame();
        S.timerId = setInterval(tickTimer, 1100);
      }
    }, 1000);
  }

  function stopTimers() {
    if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
  }

  async function finishCapture() {
    if (!S.capturing && S.frames.length < 2) return;
    S.capturing = false;
    stopTimers();
    stopCamera();
    btnMain.textContent = '正在拼接…';
    setPhase('正在拼接');
    tip.style.display = 'none';
    idle.style.display = 'none';

    try {
      // 每帧输出宽度跟着摄像头实际给的画面走，比源还宽就是白放大，只会更糊
      var outW = Math.min(1080, Math.max(640, S.srcW || 960));
      var out = await stitch(S.frames, outW, function (p, label) {
        setBar(p);
        if (label) setPhase(label);
      }, { circular: S.angleMode, angles: S.angles });
      setPhase('完成');
      setBar(1);
      idle.innerHTML = '<div>拍好了，下面就是可以转动的球面全景</div>';
      idle.style.display = 'flex';
      await presentResult(out);
    } catch (e) {
      console.error(e);
      fail('拼接失败：' + ((e && e.message) || e));
      setPhase('拼接失败');
      after.style.display = 'flex';
      btnMain.style.display = 'none';
    }
  }

  // ---------- 图像处理 ----------

  // 合成一张有纹理的场景，供自测和 ?fake=1 的模拟摄像头使用
  function buildScene(w, h, seed) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    var s = seed || 7;
    function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }

    var horizon = Math.round(h * 0.62);

    var sky = x.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#1c2a44');
    sky.addColorStop(0.55, '#42536e');
    sky.addColorStop(1, '#9a7a5e');
    x.fillStyle = sky;
    x.fillRect(0, 0, w, horizon);

    for (var L = 0; L < 2; L++) {
      x.fillStyle = L ? 'rgba(56,64,78,.92)' : 'rgba(74,86,104,.86)';
      x.beginPath();
      x.moveTo(0, horizon);
      var n2 = L ? 26 : 18, step = w / n2;
      for (var k = 0; k <= n2; k++) {
        var hh = horizon - (L ? 22 : 40) - Math.abs(Math.sin(k * 1.7 + L * 3)) * (L ? 50 : 92) - rnd() * 16;
        x.lineTo(k * step, hh);
      }
      x.lineTo(w, horizon);
      x.closePath();
      x.fill();
    }

    var ground = x.createLinearGradient(0, horizon, 0, h);
    ground.addColorStop(0, '#2f3433');
    ground.addColorStop(1, '#121517');
    x.fillStyle = ground;
    x.fillRect(0, horizon, w, h - horizon);

    var nb = Math.round(w / 140);
    for (var b = 0; b < nb; b++) {
      var bw = 56 + rnd() * 130, bh = 50 + rnd() * (h * 0.32), bx = rnd() * (w - bw);
      x.fillStyle = 'rgba(20,23,29,' + (0.7 + rnd() * 0.22) + ')';
      x.fillRect(bx, horizon - bh, bw, bh);
      var cols = Math.max(1, Math.round(bw / 21)), rows = Math.max(1, Math.round(bh / 25));
      for (var rr2 = 0; rr2 < rows; rr2++) {
        for (var cc2 = 0; cc2 < cols; cc2++) {
          if (rnd() > 0.46) continue;
          x.fillStyle = 'hsla(' + Math.floor(28 + rnd() * 46) + ',86%,' + Math.floor(50 + rnd() * 26) + '%,' + (0.5 + rnd() * 0.45) + ')';
          x.fillRect(bx + 5 + cc2 * (bw - 10) / cols, horizon - bh + 7 + rr2 * (bh - 13) / rows, 6, 9);
        }
      }
    }

    for (var i = 0; i < Math.round(w / 18); i++) {
      x.fillStyle = 'hsla(' + Math.floor(78 + rnd() * 44) + ',20%,' + Math.floor(16 + rnd() * 26) + '%,.8)';
      var r = 3 + rnd() * 9;
      x.beginPath();
      x.arc(rnd() * w, horizon + rnd() * (h - horizon), r, 0, Math.PI * 2);
      x.fill();
    }

    return c;
  }

  // 模拟一路摄像头：画面按时间匀速横向平移（每 1.1 秒走 36% 帧宽，和真机每 30° 抓一帧的比例接近）
  function makeFakeStream() {
    var scene = buildScene(7000, 720, 99);
    var c = document.createElement('canvas');
    c.width = 1280; c.height = 720;
    var ctx = c.getContext('2d');
    var t0 = performance.now();
    function drawAt(px) { ctx.drawImage(scene, px, 0, 1280, 720, 0, 0, 1280, 720); }
    drawAt(0);
    (function loop(t) {
      var px = Math.min(scene.width - 1280, Math.round((t - t0) / 1100 * 460));
      drawAt(px);
      requestAnimationFrame(loop);
    })(performance.now());
    return c.captureStream(30);
  }

  function loadImg(blob) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); res(img); };
      img.onerror = function (e) { URL.revokeObjectURL(url); rej(new Error('图片解码失败')); };
      img.src = url;
    });
  }

  function toGray(img, w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data;
    var g = new Float32Array(w * h);
    for (var i = 0, j = 0; i < g.length; i++, j += 4) {
      g[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;
    }
    return g;
  }

  // 在 A 里找 B 左条带的位置（归一化互相关），返回 A 坐标
  function matchOffset(A, aw, ah, B, bw, bh, opt) {
    var tw = Math.round(bw * opt.band);
    var yMax = opt.yMax;
    var th = bh - yMax;
    var x0 = Math.max(1, Math.round(aw * opt.xFrom));
    var x1 = Math.min(aw - tw - 1, Math.round(aw * opt.xTo));
    var best = { score: -2, x: x0, y: 0 };
    var n = tw * th;

    for (var d = -yMax; d <= yMax; d++) {
      var ay = d > 0 ? d : 0;
      var by = d < 0 ? -d : 0;
      if (ay + th > ah || by + th > bh) continue;

      var tsum = 0, tsq = 0;
      for (var j = 0; j < th; j++) {
        var rowB = (by + j) * bw;
        for (var i = 0; i < tw; i++) {
          var v = B[rowB + i];
          tsum += v; tsq += v * v;
        }
      }
      var tm = tsum / n, tv = tsq / n - tm * tm;
      if (tv <= 1e-2) continue;

      for (var x = x0; x <= x1; x++) {
        var cross = 0, asum = 0, asq = 0;
        for (var jj = 0; jj < th; jj++) {
          var rowA = (ay + jj) * aw + x;
          var rowBB = (by + jj) * bw;
          for (var ii = 0; ii < tw; ii++) {
            var av = A[rowA + ii], bv = B[rowBB + ii];
            cross += av * bv; asum += av; asq += av * av;
          }
        }
        var am = asum / n, avv = asq / n - am * am;
        if (avv <= 1e-2) continue;
        var score = (cross / n - am * tm) / (Math.sqrt(avv * tv) + 1e-9);
        if (score > best.score) best = { score: score, x: x, y: d };
      }
    }
    return best;
  }

  // 在重叠区里挑一条缝：这一列上前后两帧的差最小，在这里切过去最不容易看出来
  function pickSeam(A, B, tPrev, tCur, ovF, w, h) {
    var dxA = Math.round(tCur.x);
    var dyA = Math.round(tCur.y);
    var y0 = Math.round(h * 0.16), y1 = Math.round(h * 0.84);
    var gap = Math.max(3, Math.min(10, Math.round(ovF * 0.06)));
    var bestX = Math.round(ovF / 2), bestE = Infinity;
    for (var sx = gap; sx <= ovF - gap; sx += 2) {
      if (dxA + sx >= w || sx >= w) break;
      var e = 0, cnt = 0;
      for (var y = y0; y < y1; y += 2) {
        var yy = y + dyA;
        if (yy < 0 || yy >= h) continue;
        e += Math.abs(B[y * w + sx] - A[yy * w + dxA + sx]);
        cnt++;
      }
      if (cnt && e / cnt < bestE) { bestE = e / cnt; bestX = sx; }
    }
    return bestX;
  }

  function regionMean(G, w, x0, y0, tw, th, h) {
    var s = 0, n = 0;
    for (var j = 0; j < th; j++) {
      var row = (y0 + j) * w;
      for (var i = 0; i < tw; i++) { s += G[row + x0 + i]; n++; }
    }
    return n ? s / n : 0;
  }

  // 先缩到小尺寸再放大，用双线性插值当模糊用（Safari 上 canvas filter 不稳，不依赖它）
  function softStretch(ctx, src, sx, sy, sw, sh, dx, dy, dw, dh, k) {
    var t = document.createElement('canvas');
    t.width = Math.max(2, Math.round(dw / k));
    t.height = Math.max(2, Math.round(dh / k));
    var c = t.getContext('2d');
    c.drawImage(src, sx, sy, sw, sh, 0, 0, t.width, t.height);
    ctx.drawImage(t, 0, 0, t.width, t.height, dx, dy, dw, dh);
  }

  function edgeColor(src, sy, sh) {
    var t = document.createElement('canvas');
    t.width = 32; t.height = 1;
    var c = t.getContext('2d', { willReadFrequently: true });
    c.drawImage(src, 0, sy, src.width, sh, 0, 0, 32, 1);
    var d = c.getImageData(0, 0, 32, 1).data;
    var r = 0, g = 0, b = 0;
    for (var i = 0; i < 32; i++) { r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; }
    return [Math.round(r / 32), Math.round(g / 32), Math.round(b / 32)];
  }

  // 水平带 → 等距柱状 2:1：实拍带放中间，上下用边缘拉伸 + 同色雾化补满，转成球面时不露黑边
  function toEquirect(band, bandRatio) {
    var W = Math.min(4096, Math.max(2400, Math.round(band.width / 2) * 2));
    var H = Math.round(W / 2);
    var bandH = Math.round(H * (bandRatio || 0.38));
    if (bandH > H) bandH = H;
    var y0 = Math.round((H - bandH) / 2);

    var eq = document.createElement('canvas');
    eq.width = W; eq.height = H;
    var g = eq.getContext('2d');

    var e1 = Math.max(4, Math.round(band.height * 0.04));
    var cTop = edgeColor(band, 0, e1);
    var cBot = edgeColor(band, Math.max(0, band.height - e1), e1);

    g.fillStyle = 'rgb(' + cTop.join(',') + ')';
    g.fillRect(0, 0, W, H);

    // 上下用整段天空/地面做拉伸源，抬头低头能看到渐变的层次，而不是一块死色板
    softStretch(g, band, 0, 0, band.width, Math.round(band.height * 0.18),
      0, 0, W, y0 + Math.round(bandH * 0.10), 8);
    softStretch(g, band, 0, Math.round(band.height * 0.82), band.width, Math.round(band.height * 0.18),
      0, y0 + bandH - Math.round(bandH * 0.08), W, H - (y0 + bandH - Math.round(bandH * 0.08)), 18);

    g.drawImage(band, 0, 0, band.width, band.height, 0, y0, W, bandH);

    var gt = g.createLinearGradient(0, 0, 0, y0 + bandH * 0.25);
    gt.addColorStop(0, 'rgba(' + cTop.join(',') + ',0.62)');
    gt.addColorStop(1, 'rgba(' + cTop.join(',') + ',0)');
    g.fillStyle = gt;
    g.fillRect(0, 0, W, y0 + bandH * 0.25);

    var gb = g.createLinearGradient(0, H, 0, y0 + bandH - bandH * 0.2);
    gb.addColorStop(0, 'rgba(' + cBot.join(',') + ',0.82)');
    gb.addColorStop(1, 'rgba(' + cBot.join(',') + ',0)');
    g.fillStyle = gb;
    g.fillRect(0, y0 + bandH - bandH * 0.2, W, H - (y0 + bandH - bandH * 0.2));

    return eq;
  }

  async function stitch(blobs, outW, onProgress, opts) {
    var imgs = [];
    for (var i = 0; i < blobs.length; i++) {
      imgs.push(await loadImg(blobs[i]));
      onProgress && onProgress(0.05 + 0.15 * (i / blobs.length), '解码画面 ' + (i + 1) + '/' + blobs.length);
      await new Promise(function (r) { setTimeout(r, 0); });
    }

    var srcW = imgs[0].naturalWidth || imgs[0].width;
    var srcH = imgs[0].naturalHeight || imgs[0].height;
    var outH = Math.round(outW * srcH / srcW);
    var cW = 160, cH = Math.round(cW * srcH / srcW);
    var fW = 480, fH = Math.round(fW * srcH / srcW);

    var coarse = [], fine = [];
    for (var k = 0; k < imgs.length; k++) {
      coarse.push(toGray(imgs[k], cW, cH));
      fine.push(toGray(imgs[k], fW, fH));
    }

    var dxOut = [0];
    var dyOut = [0];
    var ratios = [1];
    var tips = [{ x: 0, y: 0 }];
    var steps = [];
    var shift = 0;
    var lastDx = Math.round(fW * 0.55);

    for (var m = 1; m < imgs.length; m++) {
      var c = matchOffset(coarse[m - 1], cW, cH, coarse[m], cW, cH, {
        band: 0.30, xFrom: 0.18, xTo: 0.92, yMax: Math.max(4, Math.round(cH * 0.10))
      });
      var gx = Math.round(c.x * fW / cW);
      var gy = Math.round(c.y * fH / cH);
      // 粗匹配只是给个方向。差太多说明它被纹理骗了（白墙、玻璃、重复的窗格），
      // 这时以「上一帧用过的位移」为准更靠谱——人转圈的速度不会突变。
      var guess = Math.abs(gx - lastDx) > Math.round(fW * 0.25) ? lastDx : gx;
      var f = matchOffset(fine[m - 1], fW, fH, fine[m], fW, fH, {
        band: 0.30,
        xFrom: Math.max(0.05, (guess - 5) / fW),
        xTo: Math.min(0.95, (guess + 5) / fW),
        yMax: 3
      });
      var f2 = null;
      if (!(f.score >= 0.45)) {
        // 窄窗口没匹配上，就在上一帧位移附近再放宽一点找一次
        f2 = matchOffset(fine[m - 1], fW, fH, fine[m], fW, fH, {
          band: 0.30,
          xFrom: Math.max(0.05, (lastDx - 14) / fW),
          xTo: Math.min(0.95, (lastDx + 14) / fW),
          yMax: 4
        });
      }
      var useX, useY;
      if (f.score >= 0.45 && Math.abs(f.x - gx) <= 8) {
        useX = f.x; useY = f.y;
      } else if (f2 && f2.score >= 0.45) {
        useX = f2.x; useY = f2.y;
      } else if (c.score >= 0.45) {
        useX = gx; useY = gy;
      } else {
        useX = lastDx; useY = 0;
      }
      if (useX < Math.round(fW * 0.15) || useX > Math.round(fW * 0.92)) {
        // 越界的值不采用，退回前面几帧的中位数，避免一个坏值把后面全部拖偏
        if (steps.length) {
          var ss = steps.slice().sort(function (p1, p2) { return p1 - p2; });
          useX = ss[Math.floor(ss.length / 2)];
        } else {
          useX = lastDx;
        }
      }
      lastDx = useX;
      steps.push(useX);
      tips.push({ x: useX, y: useY });
      shift += useX * (outW / fW);
      dxOut.push(shift);
      dyOut.push(dyOut[m - 1] + Math.round(useY * outW / fW));

      var bandTw = Math.round(fW * 0.30);
      var thF = fH - 3;
      var yA = useY > 0 ? useY : 0;
      var yB = useY < 0 ? -useY : 0;
      var uxc = Math.max(0, Math.min(fW - bandTw - 2, useX));
      var mA = regionMean(fine[m - 1], fW, uxc, yA, bandTw, thF);
      var mB = regionMean(fine[m], fW, 0, yB, bandTw, thF);
      var r = (mB > 8 && isFinite(mA)) ? mA / mB : 1;
      ratios.push(Math.max(0.82, Math.min(1.22, r)));

      onProgress && onProgress(0.2 + 0.65 * (m / (imgs.length - 1)), '对齐画面 ' + (m + 1) + '/' + imgs.length);
      await new Promise(function (r2) { setTimeout(r2, 0); });
    }

    // 位移改过之后重叠区也跟着变，曝光比值和接缝位置都要按新位移重算
    var recalcRatios = function () {
      var bTw = Math.round(fW * 0.30);
      var tF = fH - 3;
      for (var r1 = 1; r1 < imgs.length; r1++) {
        var ux = Math.max(1, Math.min(fW - bTw - 2,
          Math.round((dxOut[r1] - dxOut[r1 - 1]) * fW / outW)));
        var ty3 = tips[r1].y;
        var ya3 = ty3 > 0 ? ty3 : 0;
        var yb3 = ty3 < 0 ? -ty3 : 0;
        var m1 = regionMean(fine[r1 - 1], fW, ux, ya3, bTw, tF);
        var m2 = regionMean(fine[r1], fW, 0, yb3, bTw, tF);
        ratios[r1] = (m2 > 8 && isFinite(m1)) ? Math.max(0.82, Math.min(1.22, m1 / m2)) : 1;
      }
    };

    // ---- 有陀螺仪角度就优先用角度定位 ----
    // 位移直接由「这一帧转了多少度」换算，不再依赖图像匹配。
    // 对着白墙、玻璃、重复窗格这些没特征的地方，像素匹配必然失效，角度不会。
    var angUsed = false;
    var angs = (opts && opts.angles) || [];
    if (angs.length === imgs.length && angs.length > 2) {
      var baseA = angs[0];
      var adiff = [];
      var aOk = (baseA !== null && baseA !== undefined);
      for (var a1 = 1; a1 < angs.length && aOk; a1++) {
        if (angs[a1] === null || angs[a1] === undefined) { aOk = false; break; }
        var da = angs[a1] - baseA;
        if (Math.abs(da) > 200) { aOk = false; break; }
        adiff.push(da);
      }
      var totalA = 0;
      for (var a2 = 0; a2 < adiff.length; a2++) totalA += adiff[a2];
      if (aOk && Math.abs(totalA) > 120) {
        // 拿像素匹配的结果和角度之比反推镜头水平视角（度），取中位数，个别帧匹配失败不影响
        var hfovs = [];
        for (var a3 = 0; a3 < adiff.length; a3++) {
          var dxp = steps[a3] * (outW / fW);
          if (dxp > outW * 0.10 && Math.abs(adiff[a3]) > 6) {
            hfovs.push(Math.abs(adiff[a3]) * outW / dxp);
          }
        }
        if (hfovs.length) {
          hfovs.sort(function (f1, f2) { return f1 - f2; });
          var hfov = hfovs[Math.floor(hfovs.length / 2)];
          if (hfov >= 28 && hfov <= 120) {
            var accA = 0;
            for (var a4 = 0; a4 < adiff.length; a4++) {
              accA += adiff[a4] * outW / hfov;
              dxOut[a4 + 1] = Math.round(accA);
              tips[a4 + 1].x = Math.round(adiff[a4] * fW / hfov);
            }
            angUsed = true;
            recalcRatios();
          }
        }
      }
    }

    // ---- 没有角度时：把明显跑偏的位移用中位数拉回来 ----
    if (!angUsed && steps.length > 2) {
      var tol = (opts && opts.circular) ? 0.40 : 0.62;
      var sortedStep = steps.slice().sort(function (s1, s2) { return s1 - s2; });
      var medStep = sortedStep[Math.floor(sortedStep.length / 2)];
      var adjusted = false;
      for (var s3 = 0; s3 < steps.length; s3++) {
        if (medStep > 0 && Math.abs(steps[s3] - medStep) > medStep * tol) {
          steps[s3] = medStep;
          tips[s3 + 1].x = medStep;
          adjusted = true;
        }
      }
      if (adjusted) {
        var acc3 = 0;
        for (var s4 = 0; s4 < steps.length; s4++) {
          acc3 += steps[s4];
          dxOut[s4 + 1] = Math.round(acc3 * (outW / fW));
        }
        recalcRatios();
      }
    }

    var rawW = Math.round(dxOut[dxOut.length - 1] + outW);
    var totalW = rawW;
    if (opts && opts.circular && imgs.length > 2) {
      // 12 帧按 30° 等分转满一圈：整圈应等于 12 段位移，尾部多出来的重叠要裁掉，否则球面上会看到重复
      var avgStep = dxOut[dxOut.length - 1] / (imgs.length - 1);
      var crop = outW - Math.round(avgStep);
      if (crop > outW * 0.05 && crop < outW * 0.75) totalW = rawW - crop;
    }

    // 手举着转一圈，画面会轻微上下晃。对齐时算出来的纵向偏差要真的用上，
    // 否则天花板这类线条会在接缝处断成两截。
    var maxDy = 0, minDy = 0;
    for (var dIdx = 0; dIdx < dyOut.length; dIdx++) {
      if (dyOut[dIdx] > maxDy) maxDy = dyOut[dIdx];
      if (dyOut[dIdx] < minDy) minDy = dyOut[dIdx];
    }
    var pad = Math.max(Math.abs(minDy), Math.abs(maxDy));
    var panoH = outH + pad * 2;

    var pano = document.createElement('canvas');
    pano.width = rawW;
    pano.height = panoH;
    var pctx = pano.getContext('2d');
    pctx.fillStyle = '#000';
    pctx.fillRect(0, 0, rawW, panoH);

    var tmp = document.createElement('canvas');
    tmp.width = outW; tmp.height = panoH;
    var tctx = tmp.getContext('2d');
    var right = 0;

    for (var q = 0; q < imgs.length; q++) {
      var x = Math.round(dxOut[q]);
      tctx.globalCompositeOperation = 'source-over';
      tctx.clearRect(0, 0, outW, panoH);
      tctx.filter = 'brightness(' + ratios[q].toFixed(3) + ')';
      tctx.drawImage(imgs[q], 0, pad + dyOut[q], outW, outH);
      tctx.filter = 'none';

      var ov = Math.max(0, Math.min(outW, right - x));
      if (ov > 2) {
        // 两帧在重叠区里是同一片景物，只是差几个像素。整段半透明叠合会让边缘留下双影，
        // 改成在差异最小的地方切一刀：缝左边用前一帧、右边用这一帧，缝上只留几像素过渡。
        var ovF = Math.round(ov * fW / outW);
        var cutF = ovF > 16
          ? pickSeam(fine[q - 1], fine[q], tips[q - 1], tips[q], ovF, fW, fH)
          : Math.round(ovF / 2);
        var sxOut = Math.max(1, Math.min(ov - 1, Math.round(cutF * outW / fW)));
        var f0 = Math.max(0, (sxOut - 2) / outW);
        var f1 = Math.min(1, (sxOut + 2) / outW);
        if (f1 <= f0) f1 = Math.min(1, f0 + 0.002);

        tctx.globalCompositeOperation = 'destination-in';
        var grad = tctx.createLinearGradient(0, 0, outW, 0);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(f0, 'rgba(0,0,0,0)');
        grad.addColorStop(f1, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,1)');
        tctx.fillStyle = grad;
        tctx.fillRect(0, 0, outW, panoH);
        tctx.globalCompositeOperation = 'source-over';
      }
      pctx.drawImage(tmp, x, 0);
      right = Math.max(right, x + outW);
      onProgress && onProgress(0.85 + 0.1 * (q / imgs.length), '合成画面');
      if (q % 3 === 0) await new Promise(function (r3) { setTimeout(r3, 0); });
    }

    // 只留所有帧都覆盖到的那一条，上下因抖动多出来的边角不要
    var cropY = pad + maxDy;
    var outH2 = outH - (maxDy - minDy);
    var out = pano;
    if (totalW < rawW || outH2 < panoH || cropY > 0) {
      var cut = document.createElement('canvas');
      cut.width = totalW; cut.height = outH2;
      cut.getContext('2d').drawImage(pano, 0, cropY, totalW, outH2, 0, 0, totalW, outH2);
      out = cut;
    }

    var blob = await new Promise(function (res, rej) {
      try { out.toBlob(function (b) { b ? res(b) : rej(new Error('导出失败')); }, 'image/jpeg', 0.9); }
      catch (e) { rej(e); }
    });
    onProgress && onProgress(0.94, '生成球面图');
    var eq = toEquirect(out);
    var eqBlob = await new Promise(function (res, rej) {
      try { eq.toBlob(function (b) { b ? res(b) : rej(new Error('导出失败')); }, 'image/jpeg', 0.9); }
      catch (e) { rej(e); }
    });
    onProgress && onProgress(1, '完成');
    return {
      blob: blob, width: totalW, height: outH,
      steps: steps.map(function (v) { return Math.round(v * (outW / fW)); }),
      dips: dyOut,
      eqBlob: eqBlob, eqWidth: eq.width, eqHeight: eq.height
    };
  }

  // ---------- 球面视图（按需加载，没拍之前不下载脚本） ----------
  // ---------- 没有 WebGL 时的软件球面渲染（国产浏览器/省电模式常见） ----------
  function hasWebGL() {
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext &&
        (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { return false; }
  }

  var SOFT = { canvas: null, ctx: null, eq: null, yaw: 0, pitch: 0, fov: 80,  pending: false, steps: 0 };

  function initSoftCanvas() {
    var cv = document.createElement('canvas');
    cv.style.cssText = 'width:100%;height:100%;display:block;touch-action:none;cursor:grab';
    sphereEl.innerHTML = '';
    sphereEl.appendChild(cv);
    SOFT.canvas = cv;
    SOFT.ctx = cv.getContext('2d');

    var dragging = false, lastX = 0, lastY = 0, pinch = 0;

    cv.addEventListener('pointerdown', function (e) {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    });
    cv.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      var k = (SOFT.fov / (cv.clientWidth || 320)) * Math.PI / 180;
      SOFT.yaw -= dx * k;
      SOFT.pitch = Math.max(-85 * Math.PI / 180,
        Math.min(85 * Math.PI / 180, SOFT.pitch - dy * k));
      drawSoft();
    });
    cv.addEventListener('pointerup', function () { dragging = false; });
    cv.addEventListener('pointercancel', function () { dragging = false; });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      SOFT.fov = Math.max(35, Math.min(115, SOFT.fov + (e.deltaY > 0 ? 6 : -6)));
      drawSoft();
    }, { passive: false });
    cv.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) {
        SOFT.fov = Math.max(35, Math.min(115, SOFT.fov * pinch / Math.max(1, d)));
        drawSoft();
      }
      pinch = d;
    }, { passive: false });
    cv.addEventListener('touchend', function () { pinch = 0; });

    window.addEventListener('resize', function () { if (SOFT.canvas) resizeSoft(); });
  }

  function resizeSoft() {
    if (!SOFT.canvas) return;
    var box = sphereEl.getBoundingClientRect();
    var aspect = box.width / Math.max(1, box.height);
    var W = 460;
    var H = Math.max(150, Math.round(W / aspect));
    // 手机竖屏容器高、像素多，逐像素渲染会卡，总量压到 15 万以内
    var total = W * H;
    if (total > 150000) {
      var s = Math.sqrt(150000 / total);
      W = Math.max(200, Math.round(W * s));
      H = Math.max(150, Math.round(H * s));
    }
    SOFT.canvas.width = W;
    SOFT.canvas.height = H;
    SOFT.steps = 0;
    drawSoft();
  }

  function drawSoft() {
    if (!SOFT.eq || !SOFT.canvas || SOFT.pending) return;
    SOFT.pending = true;
    requestAnimationFrame(function () {
      SOFT.pending = false;
      var eq = SOFT.eq, d = eq.data, dw = eq.w, dh = eq.h;
      var W = SOFT.canvas.width, H = SOFT.canvas.height;
      var ctx = SOFT.ctx;
      var img = ctx.createImageData(W, H);
      var out = img.data;
      var aspect = W / H;
      var tanH = Math.tan(SOFT.fov * Math.PI / 360);
      var cp = Math.cos(SOFT.pitch), sp = Math.sin(SOFT.pitch);
      var cy = Math.cos(SOFT.yaw), sy = Math.sin(SOFT.yaw);
      var t0 = performance.now();
      var oi = 0;
      for (var v = 0; v < H; v++) {
        var py = ((1 - 2 * (v + 0.5) / H) * tanH) / aspect;
        for (var u = 0; u < W; u++) {
          var px = (2 * (u + 0.5) / W - 1) * tanH;
          var y1 = py * cp - sp;
          var z1 = py * sp + cp;
          var x2 = px * cy + z1 * sy;
          var z2 = -px * sy + z1 * cy;
          var len = Math.sqrt(x2 * x2 + y1 * y1 + z2 * z2);
          var phi = Math.asin(y1 / len);
          var lam = Math.atan2(x2, z2);
          var ix = ((lam / 6.2831853 + 0.5) * dw) | 0;
          var iy = ((0.5 - phi / 3.14159265) * dh) | 0;
          if (ix >= dw) ix -= dw;
          if (ix < 0) ix += dw;
          if (iy >= dh) iy = dh - 1;
          if (iy < 0) iy = 0;
          var si = (iy * dw + ix) * 4;
          out[oi++] = d[si];
          out[oi++] = d[si + 1];
          out[oi++] = d[si + 2];
          out[oi++] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      // 手机渲染慢就自动降分辨率，保证拖动不卡
      if (performance.now() - t0 > 45 && SOFT.steps < 3 && SOFT.canvas.width > 220) {
        SOFT.steps++;
        SOFT.canvas.width = Math.round(SOFT.canvas.width * 0.78);
        SOFT.canvas.height = Math.round(SOFT.canvas.height * 0.78);
        setTimeout(drawSoft, 0);
      }
    });
  }

  function showSoftSphere(url) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () {
        var t = document.createElement('canvas');
        t.width = 2048; t.height = 1024;
        var tc = t.getContext('2d', { willReadFrequently: true });
        tc.drawImage(im, 0, 0, 2048, 1024);
        SOFT.eq = { data: tc.getImageData(0, 0, 2048, 1024).data, w: 2048, h: 1024 };
        if (!SOFT.canvas) initSoftCanvas();
        SOFT.yaw = 0;
        SOFT.pitch = 0;
        SOFT.fov = 80;
        sphereEl.classList.add('show');
        flatEl.style.display = 'none';
        resizeSoft();
        resolve(true);
      };
      im.onerror = function () { reject(new Error('球面图打不开')); };
      im.src = url;
    });
  }

  var PSV = { loading: null, viewer: null };

  function ensureViewer() {
    if (window.PhotoSphereViewer) return Promise.resolve();
    if (PSV.loading) return PSV.loading;
    PSV.loading = new Promise(function (res, rej) {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '/assets/js/photo-sphere-viewer/core/index.min.css';
      document.head.appendChild(css);
      var s1 = document.createElement('script');
      s1.src = '/assets/js/three.min.js';
      s1.onload = function () {
        var s2 = document.createElement('script');
        s2.src = '/assets/js/photo-sphere-viewer/core/index.min.js';
        s2.onload = function () { res(); };
        s2.onerror = function () { rej(new Error('球面视图加载失败')); };
        document.head.appendChild(s2);
      };
      s1.onerror = function () { rej(new Error('3D 引擎加载失败')); };
      document.head.appendChild(s1);
    });
    return PSV.loading;
  }

  function showSphere(url) {
    if (!hasWebGL()) return Promise.resolve(false);
    return ensureViewer().then(function () {
      if (!PSV.viewer) {
        PSV.viewer = new PhotoSphereViewer.Viewer({
          container: sphereEl,
          panorama: url,
          navbar: false,
          loadingImg: false,
          touchmoveTwoFingers: false,
          mousewheelCtrlKey: false,
          defaultYaw: 0,
          defaultPitch: 0,
          minFov: 25,
          maxFov: 90
        });
      } else {
        PSV.viewer.setPanorama(url, { showLoader: false });
      }
      sphereEl.classList.add('show');
      flatEl.style.display = 'none';
      return true;
    }).catch(function (e) {
      console.warn('球面视图不可用：', e);
      sphereEl.classList.remove('show');
      flatEl.style.display = '';
      return false;
    });
  }

  function fileName(prefix) {
    var d = new Date();
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return prefix + '-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
      pad(d.getHours()) + pad(d.getMinutes()) + '.jpg';
  }

  async function presentResult(out) {
    S.panoBlob = out.blob;
    S.panoUrl = URL.createObjectURL(out.blob);
    panoEl.src = S.panoUrl;
    S.eqBlob = out.eqBlob || null;
    S.eqUrl = out.eqBlob ? URL.createObjectURL(out.eqBlob) : null;

    result.classList.add('show');
    after.style.display = 'flex';
    btnMain.style.display = 'none';
    btnDownloadEq.style.display = S.eqBlob ? '' : 'none';

    // 调试：把长图按原始像素铺在页面左上，方便逐个接缝看有没有双影
    if (!EQVIEW && /band=1/.test(location.search)) {
      flatEl.style.cssText = 'position:fixed;left:0;top:0;z-index:99;background:#000;overflow:auto';
      panoEl.style.height = 'auto';
      panoEl.style.width = out.width + 'px';
      return;
    }

    if (/dbg=1/.test(location.search)) {
      resultNote.textContent = 'dx ' + (out.steps || []).join(' / ') + ' ｜ dy ' + (out.dips || []).join(',');
      flatEl.style.display = 'none';
      return;
    }

    if (EQVIEW) {
      panoEl.src = S.eqUrl || S.panoUrl;
      flatEl.style.display = '';
      resultNote.textContent = '球面图调试视图 · ' + out.eqWidth + ' × ' + out.eqHeight;
      return;
    }

    resultNote.textContent = '正在准备球面视图…';

    var ok = false, soft = false;
    if (S.eqUrl) {
      ok = SOFTMODE ? false : await showSphere(S.eqUrl);
      if (!ok) {
        try {
          ok = await showSoftSphere(S.eqUrl);
          soft = true;
        } catch (e) { console.warn('软件球面也没起来：', e); ok = false; }
      }
    }
    if (ok) {
      resultNote.textContent = soft
        ? '球面全景 ' + out.eqWidth + ' × ' + out.eqHeight + ' · 本机没开 3D 加速，已用软件渲染 · 拖动看'
        : '球面全景 ' + out.eqWidth + ' × ' + out.eqHeight + ' · 拖动转视角，双指缩放';
    } else {
      resultNote.textContent = '长图 ' + out.width + ' × ' + out.height +
        ' · 球面视图没加载出来，可以左右拖动看';
    }
  }

  // ---------- 交互 ----------

  btnMain.addEventListener('click', function () {
    if (S.busy) return;
    S.busy = true;
    // iOS 要求在用户手势这一帧里申请陀螺仪权限，所以先同步发起，再启动相机
    var perm = null;
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        perm = DeviceOrientationEvent.requestPermission().catch(function () { return 'denied'; });
      }
    } catch (e) { perm = Promise.resolve('denied'); }
    beginCapture(perm).finally(function () { S.busy = false; });
  });

  btnRetry.addEventListener('click', function () {
    stopCamera();
    stopTimers();    S.capturing = false;
    S.frames = [];
    resetUI();
    btnMain.style.display = '';
  });

  function saveBlob(url, name) {
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); }, 300);
  }

  btnDownload.addEventListener('click', function () {
    if (!S.panoUrl) return;
    saveBlob(S.panoUrl, fileName('pano-flat'));
  });

  btnDownloadEq.addEventListener('click', function () {
    if (!S.eqUrl) return;
    saveBlob(S.eqUrl, fileName('pano-sphere'));
  });

  btnImport.addEventListener('click', function () { picker.click(); });
  picker.addEventListener('change', function () {
    var f = picker.files && picker.files[0];
    picker.value = '';
    if (!f) return;
    result.classList.remove('show');
    after.style.display = 'none';
    setBar(0);
    importPano(f);
  });

  // ---------- 倒入手机相机自带的全景照片，直接球面化 ----------
  // 系统相机的全景模式是硬件/系统级拼接（陀螺仪对齐 + 多频带融合），质量比网页里拿 12 帧硬拼高得多。
  // 这条路只在本机读文件、本机处理，不联网。
  async function importPano(file) {
    setPhase('正在读照片');
    errEl.textContent = '';
    var img;
    try { img = await loadImg(file); }
    catch (e) { fail('这张图打不开，换一张试试'); return; }

    var iw = img.naturalWidth, ih = img.naturalHeight;
    var ratio = iw / ih;
    if (ratio < 1.7) {
      fail('这张不像全景长条（' + iw + '×' + ih + '），请选手机相机「全景」模式扫出来的那张');
      setPhase('等待开始');
      return;
    }

    // 系统全景图上下常有没扫到的黑边，找出来裁掉
    var sw = Math.min(1200, iw);
    var sh = Math.max(8, Math.round(sw * ih / iw));
    var probe = document.createElement('canvas');
    probe.width = sw; probe.height = sh;
    var pctx2 = probe.getContext('2d', { willReadFrequently: true });
    pctx2.drawImage(img, 0, 0, sw, sh);
    var pd = pctx2.getImageData(0, 0, sw, sh).data;
    function rowMean(y) {
      var s = 0, cnt = 0;
      for (var x = 0; x < sw; x += 4) {
        var i = (y * sw + x) * 4;
        s += (pd[i] + pd[i + 1] + pd[i + 2]) / 3; cnt++;
      }
      return cnt ? s / cnt : 0;
    }
    var topR = 0, botR = sh;
    while (topR < sh * 0.3 && rowMean(topR) < 24) topR++;
    while (botR > sh * 0.7 && rowMean(botR - 1) < 24) botR--;
    var keepTop = topR / sh, keepBot = botR / sh;
    if (keepBot - keepTop < 0.5) { keepTop = 0; keepBot = 1; }

    var bandW2 = Math.min(4096, iw);
    var bandH2 = Math.max(8, Math.round(ih * (keepBot - keepTop) * bandW2 / iw));
    var band2 = document.createElement('canvas');
    band2.width = bandW2; band2.height = bandH2;
    band2.getContext('2d').drawImage(img,
      0, Math.round(keepTop * ih), iw, Math.round((keepBot - keepTop) * ih),
      0, 0, bandW2, bandH2);

    var eqCanvas;
    if (ratio > 2.3) {
      // 横向长条：按 55% 高度放进 2:1 图，上下补雾
      eqCanvas = toEquirect(band2, 0.55);
    } else {
      // 本来就是 2:1 的等距柱状（全景相机直出），拉成严格 2:1
      eqCanvas = document.createElement('canvas');
      eqCanvas.width = 4096; eqCanvas.height = 2048;
      eqCanvas.getContext('2d').drawImage(band2, 0, 0, bandW2, bandH2, 0, 0, 4096, 2048);
    }

    setPhase('正在生成球面');
    var bandBlob = await new Promise(function (r) { band2.toBlob(r, 'image/jpeg', 0.92); });
    var eqBlob = await new Promise(function (r) { eqCanvas.toBlob(r, 'image/jpeg', 0.92); });

    idle.style.display = 'none';
    tip.style.display = 'none';
    stageEl.style.display = 'none';
    metaEl.style.display = 'none';
    barEl.parentNode.style.display = 'none';
    btnImport.style.display = 'none';
    btnRetry.textContent = '换一张';
    setPhase('完成');
    setBar(1);
    S.frames = [];
    setCount(0);
    await presentResult({
      blob: bandBlob, width: bandW2, height: bandH2,
      eqBlob: eqBlob, eqWidth: eqCanvas.width, eqHeight: eqCanvas.height
    });
  }

  // ---------- 自测（?selftest=1） ----------
  async function selftest() {
    var scene = buildScene(4000, 420, 12345);
    var step = CIRCULAR ? 180 : 150;
    // ?jitter=1：给每帧加一点上下抖动和半像素水平误差，模拟手持拍摄，用来检查接缝处有没有双影
    var jitY = JITTER ? [0, 1, -1, 2, -2, 1, 0, -1, 2, -2, 1, 0] : null;

    var blobs = [];
    for (var k = 0; k < 12; k++) {
      var c = document.createElement('canvas');
      c.width = 600; c.height = 400;
      var cx = c.getContext('2d');
      var jy = jitY ? jitY[k] : 0;
      var hx = (JITTER && k % 2) ? 1 : 0;
      cx.drawImage(scene, k * step + hx, 10 + jy, 600, 400, 0, 0, 600, 400);
      var b = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.95); });
      blobs.push(b);
    }

    var t0 = performance.now();
    // ?angtest=1：喂一组等分的角度，走「角度定位」分支，验证算出来的宽度和像素匹配一致
    var angles = null;
    if (/angtest=1/.test(location.search)) {
      angles = [];
      for (var ai = 0; ai < 12; ai++) angles.push(ai * 30);
    }
    var res = await stitch(blobs, 960, function () {}, { circular: CIRCULAR, angles: angles });
    var expect = CIRCULAR
      ? Math.round(12 * step * 960 / 600)
      : Math.round((11 * step + 600) * 960 / 600);
    window.__selftest = 'width=' + res.width + ' expected=' + expect +
      ' errPx=' + Math.abs(res.width - expect) + ' ms=' + Math.round(performance.now() - t0) +
      ' eq=' + res.eqWidth + 'x' + res.eqHeight + ' sizeKB=' + Math.round(res.blob.size / 1024);
    console.log('SELFTEST ' + window.__selftest);
    setPhase('自测完成');
    await presentResult(res);
    resultNote.textContent = '自测 · 长图 ' + res.width + ' × ' + res.height +
      '（应为 ' + expect + '，差 ' + Math.abs(res.width - expect) + ' 像素） · 球面 ' +
      res.eqWidth + ' × ' + res.eqHeight;
  }

  if (/selftest=1/.test(location.search)) {
    setPhase('自测中');
    setTimeout(selftest, 200);
  }

  // 无交互环境（headless 截图/回归）用来自动跑一遍
  if (/auto=1/.test(location.search)) {
    setTimeout(function () { btnMain.click(); }, 400);
  }

  // 调试：造一张模拟的系统全景长条，直接走「从相册导入」那条路
  if (/demo=1/.test(location.search)) {
    setTimeout(function () {
      var c = buildScene(8000, 1200, 99);
      c.toBlob(function (b) { if (b) importPano(b); }, 'image/jpeg', 0.9);
    }, 300);
  }
})();
</script>
