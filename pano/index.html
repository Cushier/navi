<script>
/* 夜间模式：跟随主站设置（同域 cookie night=1），未设置时按主站同样规则按时间判断（18:00-06:00） */
(function () {
	try {
		var m = document.cookie.match(/(?:^;)\s*night=([^;]*)/) || document.cookie.match(/(?:^|;)\s*night=([^;]*)/);
		var v = m ? m[1] : '';
		var h = new Date().getHours();
		if (v === '1' || (v === '' && (h > 17 || h < 6))) {
			document.documentElement.className = 'night io-black-mode';
		}
	} catch (e) {}
})();
</script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
	padding: 22px 14px 90px;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
	color: #333;
	background-color: #f2f3f5;
	background-image: linear-gradient(rgba(0,0,0,.03) 1px, transparent 0), linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 0);
	background-size: 15px 15px;
	-webkit-text-size-adjust: 100%;
}
.wrap { max-width: 660px; margin: 0 auto; }

header { text-align: center; margin: 0 0 20px; }
header h1 { font-size: 25px; margin: 0 0 8px; color: #1b1b1b; letter-spacing: 1px; }
header p { font-size: 12.5px; color: #767c82; margin: 0; line-height: 1.7; }
header .back { display: inline-block; margin-top: 10px; font-size: 12px; color: #7a8288; text-decoration: none; border: 1px solid #dcdfe3; border-radius: 20px; padding: 4px 12px; }
header .back:hover { color: #3a7afe; border-color: #b9cdf5; }

/* ---------- 卡片 ---------- */
.card {
	background: #fff;
	border-radius: 14px;
	box-shadow: 0 1px 4px rgba(0,0,0,.06);
	overflow: hidden;
	margin-bottom: 16px;
}
.shot {
	position: relative;
	width: 100%;
	aspect-ratio: 2 / 1;
	background: #e9ecef;
	overflow: hidden;
	cursor: zoom-in;
}
.shot img {
	width: 100%; height: 100%;
	object-fit: cover;
	display: block;
	transition: transform .35s ease;
}
.shot:active img { transform: scale(1.02); }
.shot .lost {
	position: absolute; inset: 0;
	display: flex; align-items: center; justify-content: center;
	color: #98a2ad; font-size: 13px; background: #eef1f4;
	font-weight: 400;
}
.shot .hint {
	position: absolute; right: 10px; bottom: 10px;
	background: rgba(0,0,0,.42);
	color: #fff;
	font-size: 11.5px;
	padding: 4px 9px;
	border-radius: 12px;
	backdrop-filter: blur(2px);
	pointer-events: none;
}
.card-body { padding: 12px 14px 4px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.nick { font-size: 12.5px; color: #3a7afe; font-weight: 600; }
.time { font-size: 11.5px; color: #9aa1a7; }
.desc { font-size: 13.5px; line-height: 1.75; color: #444; white-space: pre-wrap; word-break: break-word; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.desc .more { color: #3a7afe; cursor: pointer; font-size: 12.5px; }

.cmt-bar {
	display: flex; align-items: center; gap: 14px;
	padding: 8px 14px 11px;
	border-top: 1px solid #f0f1f3;
	margin-top: 8px;
}
.cmt-bar button {
	background: none; border: 0; padding: 4px 0; cursor: pointer;
	font-size: 12.5px; color: #7a8288; font-family: inherit;
	display: inline-flex; align-items: center; gap: 5px;
}
.cmt-bar button:hover { color: #3a7afe; }
.cmt-bar .grow { flex: 1; }

.cmt-list { padding: 2px 14px 12px; }
.cmt { display: flex; gap: 9px; padding: 8px 0; border-top: 1px dashed #f0f1f3; }
.cmt img.av { width: 26px; height: 26px; border-radius: 50%; flex: none; background: #eee; }
.cmt .txt { font-size: 12.8px; line-height: 1.7; color: #4a4f54; word-break: break-word; }
.cmt .who { font-size: 11.8px; color: #8b9299; margin-bottom: 2px; }
.cmt .who b { color: #5b6167; font-weight: 600; }
.cmt-form { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 2px; border-top: 1px dashed #f0f1f3; }
.cmt-form input, .cmt-form textarea {
	width: 100%; border: 1px solid #e3e6ea; border-radius: 9px;
	padding: 8px 10px; font-size: 13px; font-family: inherit;
	background: #fafbfc; color: #333; outline: none;
}
.cmt-form input:focus, .cmt-form textarea:focus { border-color: #9dbdf7; background: #fff; }
.cmt-form textarea { resize: vertical; min-height: 46px; }
.cmt-form .act { display: flex; align-items: center; gap: 10px; }
.cmt-form .act .msg { font-size: 12px; color: #c0402c; flex: 1; }
.cmt-form .act .msg.ok { color: #3f8b4a; }

.btn {
	border: 0; border-radius: 9px; padding: 8px 18px;
	font-size: 13px; font-family: inherit; cursor: pointer;
	background: #3a7afe; color: #fff;
}
.btn:active { opacity: .86; }
.btn.ghost { background: #fff; color: #3a7afe; border: 1px solid #c9d9f8; }
.btn[disabled] { opacity: .55; cursor: default; }

.empty { text-align: center; color: #9aa1a7; font-size: 13px; padding: 46px 0; line-height: 2; }
.more-wrap { text-align: center; padding: 6px 0 0; }

/* ---------- 底部发布条 ---------- */
.pubbar {
	position: fixed; left: 0; right: 0; bottom: 0;
	padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
	background: rgba(255,255,255,.92);
	backdrop-filter: blur(8px);
	border-top: 1px solid #eaecef;
	display: flex; justify-content: center;
	z-index: 20;
}
.pubbar button { max-width: 630px; width: 100%; }
.foot-note { text-align: center; font-size: 11.5px; color: #a6acb2; line-height: 1.9; padding: 20px 0 4px; }

/* ---------- 弹层 ---------- */
.modal {
	position: fixed; inset: 0; z-index: 40;
	background: rgba(20,22,26,.5);
	display: none;
	align-items: center; justify-content: center;
	padding: 18px;
}
.modal.on { display: flex; }
.sheet {
	background: #fff; border-radius: 16px;
	width: 100%; max-width: 460px;
	max-height: 88vh; overflow: auto;
	padding: 20px;
	box-shadow: 0 12px 40px rgba(0,0,0,.22);
}
.sheet h3 { margin: 0 0 6px; font-size: 16px; color: #222; }
.sheet .sub { font-size: 12.5px; color: #8b9299; line-height: 1.7; margin: 0 0 16px; }
.sheet .field { margin-bottom: 12px; }
.sheet label { display: block; font-size: 12.5px; color: #6b7178; margin-bottom: 5px; }
.sheet input[type=text], .sheet input[type=password], .sheet textarea {
	width: 100%; border: 1px solid #e3e6ea; border-radius: 10px;
	padding: 10px 12px; font-size: 14px; font-family: inherit;
	background: #fafbfc; color: #333; outline: none;
}
.sheet input:focus, .sheet textarea:focus { border-color: #9dbdf7; background: #fff; }
.sheet textarea { resize: vertical; min-height: 76px; }
.sheet .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.sheet .tip { font-size: 12px; color: #c0402c; min-height: 16px; line-height: 1.6; margin-top: 8px; }
.sheet .tip.ok { color: #3f8b4a; }
.pick {
	width: 100%; border: 1px dashed #cdd4db; border-radius: 12px;
	background: #fafbfc; padding: 26px 12px; text-align: center;
	color: #8b9299; font-size: 13px; cursor: pointer;
}
.pick:hover { border-color: #9dbdf7; color: #3a7afe; }
.pick.has { border-style: solid; border-color: #cfe0fc; padding: 0; background: #fff; }
.pick.has img { width: 100%; border-radius: 11px; display: block; aspect-ratio: 2/1; object-fit: cover; }
.prog { height: 3px; background: #eef1f4; border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
.prog.on { display: block; }
.prog i { display: block; height: 100%; width: 0; background: #3a7afe; transition: width .25s; }

/* ---------- 查看器 ---------- */
/* 图区直接铺满整个视口，标题和底部按钮浮在画面上（像微信看图那样），上下不再有任何黑边 */
.viewer {
	position: fixed; inset: 0; z-index: 60;
	background: #000;
	display: none;
}
.viewer.on { display: block; }
.viewer .vhead {
	display: flex; align-items: center; gap: 10px;
	padding: calc(10px + env(safe-area-inset-top)) 14px 14px;
	color: #fff; font-size: 13px;
	position: absolute; top: 0; left: 0; right: 0; z-index: 3;
	background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
}
.viewer .vhead .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e8ebef; }
.viewer .vhead button {
	background: rgba(255,255,255,.14); border: 0; color: #fff;
	font-size: 12.5px; font-family: inherit; padding: 6px 12px; border-radius: 16px; cursor: pointer;
}
.viewer .vhead button.icon {
	width: 32px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
}
.viewer .vhead button.icon svg, .viewer .vexit svg { width: 16px; height: 16px; display: block; }
#sphere { position: absolute; inset: 0; overflow: hidden; overscroll-behavior: contain; touch-action: none; }
#sphere canvas { display: block; }
/* 普通照片：同一张图放大模糊铺满整个视口当底，主体按原比例完整显示，不再是死黑 */
.flatbg {
	position: absolute; inset: -48px; pointer-events: none; background: center/cover no-repeat;
	filter: blur(26px) brightness(.6) saturate(1.15); transform: scale(1.08); z-index: 0;
}
.flatimg {
	position: relative; width: 100%; height: 100%; object-fit: contain; display: block;
	background: transparent; touch-action: none; will-change: transform;
}
.viewer .vfoot {
	position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
	text-align: center; color: #cfd4da; font-size: 11.5px;
	padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
	line-height: 1.7;
	background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.72) 42%);
}
.viewer .vfoot a { color: #a8c0ff; text-decoration: none; }
/* 全屏：收起上下栏，只留图和右上角的退出按钮 */
.viewer .vhead, .viewer .vfoot { transition: opacity .18s ease; }
.viewer.immersive .vhead, .viewer.immersive .vfoot { opacity: 0; visibility: hidden; pointer-events: none; }
.viewer .vexit {
	position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 5;
	width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
	background: rgba(0,0,0,.42); color: #fff; display: none;
	align-items: center; justify-content: center; padding: 0;
}
.viewer.immersive .vexit { display: flex; }
.viewer .loading {
	position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
	color: #9aa1a7; font-size: 13px; background: #000;
}

/* ---------- 夜间 ---------- */
html.io-black-mode body { color: #c8ccd2; background-color: #16181c; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 0), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 0); }
html.io-black-mode header h1 { color: #e6e9ed; }
html.io-black-mode header p { color: #7d858e; }
html.io-black-mode header .back { color: #8b939c; border-color: #333840; }
html.io-black-mode .card { background: #1e2126; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
html.io-black-mode .shot { background: #262a30; }
html.io-black-mode .nick { color: #7ea6ff; }
html.io-black-mode .time { color: #6d757e; }
html.io-black-mode .desc { color: #b9bfc6; }
html.io-black-mode .desc .more { color: #7ea6ff; }
html.io-black-mode .cmt-bar { border-top-color: #2a2e35; }
html.io-black-mode .cmt-bar button { color: #8b939c; }
html.io-black-mode .cmt-bar button:hover { color: #7ea6ff; }
html.io-black-mode .cmt { border-top-color: #2a2e35; }
html.io-black-mode .cmt .txt { color: #aab0b8; }
html.io-black-mode .cmt .who { color: #6d757e; }
html.io-black-mode .cmt .who b { color: #b5bbc2; }
html.io-black-mode .cmt-form { border-top-color: #2a2e35; }
html.io-black-mode .cmt-form input, html.io-black-mode .cmt-form textarea,
html.io-black-mode .sheet input, html.io-black-mode .sheet textarea {
	background: #23272d; border-color: #2f343b; color: #cfd4da;
}
html.io-black-mode .cmt-form input:focus, html.io-black-mode .cmt-form textarea:focus,
html.io-black-mode .sheet input:focus, html.io-black-mode .sheet textarea:focus { background: #282d34; border-color: #41618f; }
html.io-black-mode .empty { color: #6d757e; }
html.io-black-mode .pubbar { background: rgba(26,29,34,.94); border-top-color: #2a2e35; }
html.io-black-mode .foot-note { color: #5f666e; }
html.io-black-mode .sheet { background: #1e2126; }
html.io-black-mode .sheet h3 { color: #dfe3e8; }
html.io-black-mode .sheet .sub { color: #7d858e; }
html.io-black-mode .sheet label { color: #8b939c; }
html.io-black-mode .pick { background: #23272d; border-color: #333840; color: #7d858e; }
html.io-black-mode .pick.has { background: #23272d; border-color: #3a4a63; }
html.io-black-mode .btn.ghost { background: #262a30; border-color: #3a4250; color: #7ea6ff; }
html.io-black-mode .prog { background: #2a2e35; }

/* ---------- 搜索 / 标签 ---------- */
.filter { margin: 0 0 14px; }
.filter-row { display: flex; gap: 8px; align-items: center; }
.filter-row input {
	flex: 1; border: 1px solid #e3e6ea; border-radius: 20px;
	padding: 9px 14px; font-size: 13px; font-family: inherit;
	background: #fff; color: #333; outline: none;
}
.filter-row input:focus { border-color: #9dbdf7; }
.filter-row button { padding: 7px 14px; border-radius: 18px; flex: none; }
.tagrow { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.tagrow:empty { display: none; }
.tag {
	background: #fff; border: 1px solid #e3e6ea; color: #6b7178;
	font-size: 12px; padding: 4px 10px; border-radius: 14px; cursor: pointer;
	font-family: inherit;
}
.tag.on { background: #eaf1ff; border-color: #b9cdf5; color: #2f6ae8; }
.tag .n { color: #a6acb2; margin-left: 4px; font-size: 11px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
	font-size: 11.5px; color: #4a7ddb; background: #f1f5ff;
	border-radius: 10px; padding: 2px 8px; cursor: pointer;
	border: 0; font-family: inherit;
}
.shot .count {
	position: absolute; left: 10px; bottom: 10px;
	background: rgba(0,0,0,.42); color: #fff;
	font-size: 11.5px; padding: 4px 9px; border-radius: 12px;
	backdrop-filter: blur(2px); pointer-events: none;
}

/* ---------- 九宫格选图 ---------- */
.grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cell {
	position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
	background: #f3f5f7; border: 1px dashed #cdd4db;
	display: flex; align-items: center; justify-content: center;
	font-size: 21px; color: #b3b9c0; cursor: pointer;
	/* 横向拖动用来换位，纵向滑动照旧滚页面 */
	touch-action: pan-y;
}
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; user-select: none; }
.cell.busy { opacity: .55; }
.cell.on { box-shadow: 0 0 0 2px #3a7afe inset; }
.cell.drag { opacity: .9; box-shadow: 0 10px 26px rgba(0,0,0,.3); z-index: 99; }
.cell.over { outline: 2px solid #3a7afe; outline-offset: -2px; }
.cell .del {
	position: absolute; right: 3px; top: 3px; width: 20px; height: 20px;
	border-radius: 50%; background: rgba(0,0,0,.52); color: #fff;
	border: 0; font-size: 12px; line-height: 20px; text-align: center;
	cursor: pointer; padding: 0; font-family: inherit;
}
.cell .badge {
	position: absolute; left: 4px; bottom: 4px;
	background: rgba(0,0,0,.5); color: #fff; font-size: 10.5px;
	padding: 1px 6px; border-radius: 8px;
}

/* ---------- 帖子详情 ---------- */
.thread-sheet { max-width: 520px; padding: 16px 18px 18px; }
.thead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.thead .who-line { flex: 1; display: flex; gap: 8px; align-items: baseline; }
.vg { background: none; border: 0; color: #9aa1a7; font-size: 12.5px; cursor: pointer; font-family: inherit; padding: 4px; }
.tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 4px; }
.tgrid .g {
	position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
	background: #eef1f4; cursor: pointer;
}
.tgrid .g img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tgrid .g.wide { aspect-ratio: 2 / 1; }
.tgrid .g .k {
	position: absolute; right: 4px; bottom: 4px;
	background: rgba(0,0,0,.45); color: #fff; font-size: 10.5px;
	padding: 1px 5px; border-radius: 7px;
}
.tgrid .g .k.zero { display: none; }
.tgrid .g .flat { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 7px; }
.tbar { display: flex; gap: 10px; margin: 12px 0 4px; }
.tbar .btn { font-size: 12.5px; padding: 7px 14px; }

/* ---------- 查看器里的评论抽屉 ---------- */
.viewer .vpanel {
	display: none; flex: none; max-height: 44vh; overflow: auto;
	background: #14161a; color: #d5dae0;
	padding: 10px 16px 12px;
	border-top: 1px solid #24282e;
	-webkit-overflow-scrolling: touch;
}
.viewer .vpanel.on { display: block; }
.viewer .vpanel .cmt { border-top-color: #24282e; }
.viewer .vpanel .cmt .who { color: #7d858e; }
.viewer .vpanel .cmt .who b { color: #c3c9d0; }
.viewer .vpanel .cmt .txt { color: #aab0b8; }
.viewer .vpanel .cmt-form { border-top-color: #24282e; }
.viewer .vpanel .cmt-form input, .viewer .vpanel .cmt-form textarea {
	background: #1c1f24; border-color: #2c3138; color: #cfd4da;
}
.viewer .vpanel .cmt-form .act .msg { color: #e0796b; }
.viewer .vfoot .acts { display: flex; gap: 12px; justify-content: center; margin-bottom: 6px; }
.viewer .vfoot .acts button {
	background: rgba(255,255,255,.12); border: 0; color: #d5dae0;
	font-size: 12px; padding: 6px 14px; border-radius: 15px;
	font-family: inherit; cursor: pointer;
}

html.io-black-mode .filter-row input { background: #23272d; border-color: #2f343b; color: #cfd4da; }
html.io-black-mode .tag { background: #1e2126; border-color: #333840; color: #8b939c; }
html.io-black-mode .tag.on { background: #22303f; border-color: #37527a; color: #7ea6ff; }
html.io-black-mode .chip { background: #232a36; color: #7ea6ff; }
html.io-black-mode .cell { background: #23272d; border-color: #333840; color: #5f666e; }
html.io-black-mode .thread-sheet { background: #1e2126; }
html.io-black-mode .tgrid .g { background: #262a30; }
html.io-black-mode .cmt .who .fig { background: #22303f; color: #7ea6ff; }
html.io-black-mode .shot .lost { background: #23272d; color: #8b939c; }

/* 图级评论的「第 n 张」标记 */
.cmt .who .fig {
	display: inline-block; margin-left: 6px;
	background: #eef2ff; color: #3a7afe; font-weight: 400;
	font-size: 10.5px; padding: 1px 6px; border-radius: 8px;
	vertical-align: 1px;
}

/* 复制链接后的浮动提示 */
.toast {
	position: fixed; left: 50%; bottom: 88px; z-index: 90;
	transform: translateX(-50%) translateY(8px);
	background: rgba(24,26,30,.93); color: #fff;
	font-size: 13px; padding: 9px 16px; border-radius: 18px;
	max-width: 84vw; opacity: 0;
	transition: opacity .2s ease, transform .2s ease;
	pointer-events: none;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 微信里转发只能手动点右上角，用这层指一下 */
.wxh {
	position: fixed; inset: 0; z-index: 88;
	background: rgba(10,12,16,.62);
	-webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);

<script>
(function () {
'use strict';

/* ========== 配置 ========== */
/* 接口基址：正式环境走 https://comment.qnkjxx.top/api。

var API = (function () {
	if (/^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) {
		return 'http://' + location.hostname + ':8139/api';
	}
	return 'https://comment.qnkjxx.top/api';
})();
var PAGE_PATH = '/pano/';
var PAGE_SIZE = 10;
/* 分享链接：?p=帖子id 打开详情，"&i=n" 直接打开第 n 张 */
var JUMP_P = (function () {
	var m = location.search.match(/[?&]p=(\d+)/);
	return m ? Number(m[1]) : 0;
})();
var JUMP_I = (function () {
	var m = location.search.match(/[?&]i=(\d+)/);
	return m ? Number(m[1]) : 0;
})();
var CLOUD_NAME = 'sqrrg30h';
var UPLOAD_PRESET = 'pano_unsigned';
var PASS_HASH = '88eea08d184bf65d34c956593b85c77c55e993f7296ebccfaf1430bf5871268e';
var DEFAULT_NICK = '站长';
var GUEST_NICK = '访客';
var GUEST_MAIL = 'guest_pano@qnkjxx.top';
var DPR = Math.min(3, window.devicePixelRatio || 1);
/* 列表缩略按屏幕密度取，660 在高分屏上是糊的 */
var THUMB_W = Math.min(1280, Math.max(660, Math.round(464 * DPR)));

var S = {
	page: 1, totalPages: 1, loading: false, posts: [],
	viewer: null, soft: null, cur: null,
	pendingBlob: null, pendingUrl: '',
	q: '', tag: '', jump: null, jumpIdx: 0, panoW: 0
};

var feedEl = document.getElementById('feed');
var moreWrap = document.getElementById('moreWrap');
var moreBtn = document.getElementById('moreBtn');
var emptyEl = document.getElementById('empty');
var qEl = document.getElementById('q');
var qClear = document.getElementById('qClear');
var tagRow = document.getElementById('tagRow');

if (JUMP_P) { S.jump = { p: JUMP_P }; S.jumpIdx = JUMP_I; }

/* ========== 工具 ========== */
function esc(s) {
	return String(s == null ? '' : s)
		.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(ms) {
	var t = Number(ms) || 0;
	if (!t) return '';
	var d = new Date(t);
	var diff = (Date.now() - t) / 1000;
	if (diff < 60) return '刚刚';
	if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
	if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
	if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
	var p = function (n) { return (n < 10 ? '0' : '') + n; };
	return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function sha256hex(str) {
	if (!window.crypto || !window.crypto.subtle) return Promise.reject(new Error('needs https'));
	var buf = new TextEncoder().encode(str);
	return window.crypto.subtle.digest('SHA-256', buf).then(function (d) {
		var out = '';
		var arr = new Uint8Array(d);
		for (var i = 0; i < arr.length; i++) out += (arr[i] < 16 ? '0' : '') + arr[i].toString(16);
		return out;
	});
}

/* 图片 URL 的固定部分做签名，避开协议和参数被改写的情况 */
function urlKey(u) {
	try { return new URL(u).pathname; } catch (e) { return String(u || ''); }
}

function signOf(url) {
	return sha256hex(PASS_HASH + '|' + urlKey(url)).then(function (h) { return h.slice(0, 8); });
}

function thumbUrl(u, w) {
	return String(u).replace('/image/upload/', '/image/upload/c_limit,w_' + (w || 660) + ',q_auto,f_auto/');
}

/* GPU 能吃多大的纹理：多数手机 4096，新旗舰 8192 */
function maxTexSize() {
	try {
		var c = document.createElement('canvas');
		var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
		if (!gl) return 4096;
		var m = Number(gl.getParameter(gl.MAX_TEXTURE_SIZE)) || 4096;
		return m;
	} catch (e) { return 4096; }
}

/* 浏览器 canvas 上限：iPhone 约 16.7MP（4096×4096），安卓能到 8192 宽。
   超过上限时 canvas 静默画白，所以画一个角再读回来验证。 */
function maxPanoWidth() {
	if (S.panoW) return S.panoW;
	var mem = navigator.deviceMemory || 0;
	var start = mem >= 6 ? 8192 : (mem >= 4 ? 7168 : 6144);
	var cands = [start, 7168, 6144, 5120, 4096];
	for (var i = 0; i < cands.length; i++) {
		var w = cands[i], h = Math.round(w / 2);
		try {
			var c = document.createElement('canvas');
			c.width = w; c.height = h;
			var g = c.getContext('2d');
			g.fillStyle = 'rgb(128,128,128)';
			g.fillRect(w - 8, h - 8, 8, 8);
			var px = g.getImageData(w - 1, h - 1, 1, 1).data;
			c.width = 0; c.height = 0; c = null;
			if (px[3] === 255 && px[0] > 90 && px[0] < 166) { S.panoW = w; return w; }
		} catch (e) {}
	}
	S.panoW = 4096;
	return 4096;
}

/* Waline 的英文报错翻成人话 */
function errText(m) {
	var s = String(m == null ? '' : m);
	if (/too fast/i.test(s)) return '发得太快了，等一两分钟再试。';
	if (/duplicate/i.test(s)) return '这句刚发过，换个说法。';
	if (/spam|block/i.test(s)) return '这条被系统拦下了，换个说法试试。';
	if (/network|failed to fetch/i.test(s)) return '网络没通，稍后再试。';
	return '没发出去：' + (s || '未知错误');
}

/* ---------- 编码约定 ----------
   一条顶层评论 = 一个帖子：
     帖级说明
     ![全景](图址)
     〔标签1|标签2〕 这张的说明
     ![全景](图址2)
     ...
     ⟦签名⟧
   子评论开头写 〔图n〕 表示这条是针对第 n 张的，否则算帖子整体评论。
   标签用全角六角括号包起来，Markdown 不会把它当标题，访客在后台也看得懂。 */
var TAG_RE = /\u3014([^\u3015]{0,80})\u3015/g;
var SIG_RE = /\u27E6[^\u27E7]{0,40}\u27E7/g;
var IMG_SRC_RE = '<img[^>]*src\\s*=\\s*"([^"]+)"[^>]*>';

function htmlToText(h) {
	var t = String(h || '')
		.replace(/<br\s*\/?>/gi, '\n')
		.replace(/<\/(p|div|li|h\d)>/gi, '\n')
		.replace(/<[^>]+>/g, '');
	var doc = new DOMParser().parseFromString('<!doctype html><body>' + t, 'text/html');
	return (doc.body.textContent || '');
}

/* 一段文本 → { tags, text } */
function splitMeta(raw) {
	var tags = [];
	var t = String(raw || '').replace(SIG_RE, ' ');
	t = t.replace(/\u3014([^\u3015]{0,80})\u3015/g, function (_, g) {
		g.split('|').forEach(function (x) { x = x.trim(); if (x) tags.push(x.slice(0, 14)); });
		return ' ';
	});
	t = t.replace(/\s+/g, ' ').trim();
	return { tags: tags.slice(0, 8), text: t };
}

/* 一条顶层评论 → 帖子结构 */
function parseThread(c) {
	var html = String(c.comment || '');
	var segs = [];
	var re = new RegExp(IMG_SRC_RE, 'gi');
	var last = 0, m;
	while ((m = re.exec(html))) {
		segs.push({ src: m[1], text: html.slice(last, m.index) });
		last = re.lastIndex;
	}
	if (!segs.length) return { head: splitMeta(htmlToText(html)).text, tags: [], items: [], cover: '' };
	segs.push({ src: '', text: html.slice(last) });
	var head = splitMeta(htmlToText(segs[0].text));
	var items = [];
	for (var i = 0; i < segs.length - 1; i++) {
		var meta = splitMeta(htmlToText(segs[i + 1].text));
		items.push({ url: segs[i].src, tags: meta.tags, note: meta.text });
	}
	return { head: head.text, tags: head.tags, items: items, cover: items[0].url };
}

/* 子评论：〔图n〕 → 归属第 n 张 */
var PIC_RE = /^\u3014图(\d{1,2})\u3015/;
function parseKid(k) {
	var t = htmlToText(k.comment || '').replace(SIG_RE, '').replace(/\s+/g, ' ').trim();
	var m = t.match(PIC_RE);
	var pic = m ? Number(m[1]) : 0;
	if (m) t = t.slice(m[0].length).trim();
	return { pic: pic, text: t };
}

/* 帖子里所有标签（含每张图的），用于搜索与筛选 */
function threadTags(p) {
	var out = [];
	p.tags.forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
	p.items.forEach(function (it) {
		it.tags.forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
	});
	return out;
}

/* ========== 接口 ========== */
function getJSON(url, tries) {
	tries = tries || 0;
	/* 手机上弱网/接口冷启动时 fetch 可能一直挂着不返回，界面就永远停在"正在读照片…"，
	   所以给每次请求设 12 秒上限，超时按失败处理走重试 */
	var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
	var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 12000) : null;
	function done() { if (timer) { clearTimeout(timer); timer = null; } }
	return fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function (r) {
		if (r.status !== 200) throw new Error('HTTP ' + r.status);
		return r.json();
	}).then(function (res) {
		done();
		if (res.errno !== 0) throw new Error(res.errmsg || '接口错误');
		return res.data;
	}).catch(function (err) {
		done();
		/* 手机上弱网、接口冷启动、偶发超时都会走到这里，退避重试两次再报错 */
		if (tries >= 2) {
			if (err && err.name === 'AbortError') throw new Error('请求超时');
			throw err;
		}
		var wait = 1200 + tries * 1200;
		return new Promise(function (ok) { setTimeout(ok, wait); }).then(function () {
			return getJSON(url, tries + 1);
		});
	});
}

function loadFeed(reset) {
	if (S.loading) return;
	S.loading = true;
	feedEl.innerHTML = '';
	emptyEl.style.display = 'block';
	emptyEl.innerHTML = '正在读照片…';
	moreWrap.style.display = 'none';

	var base = API + '/comment?path=' + encodeURIComponent(PAGE_PATH) + '&pageSize=' + PAGE_SIZE;

	getJSON(base + '&page=1')
		.then(function (d1) {
			var body = (d1 && d1.data) || [];
			var pages = Math.min(6, Math.max(1, Number(d1 && d1.totalPages) || 1));
			if (pages <= 1) return body;
			var jobs = [];
			for (var p = 2; p <= pages; p++) {
				(function (pn) {
					jobs.push(getJSON(base + '&page=' + pn).then(function (d) { return (d && d.data) || []; })
						.catch(function () { return []; }));
				})(p);
			}
			return Promise.all(jobs).then(function (rest) {
				var all = body.slice();
				rest.forEach(function (arr) { all = all.concat(arr); });
				return all;
			});
		})
		.then(function (all) { renderAll(all); })
		.catch(function (err) {
			emptyEl.style.display = 'block';
			emptyEl.innerHTML = '照片列表没读出来：' + esc(err.message) +
				'<br><button type="button" id="retryFeed" style="margin-top:8px;padding:6px 14px;border-radius:6px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;font-size:13px">重新加载</button>';
			var rb = document.getElementById('retryFeed');
			if (rb) rb.onclick = function () { loadFeed(true); };
		})
		.finally(function () { S.loading = false; });
}

/* 接口返回的是扁平列表，回复靠 pid 指回父评论，这里自己分组 */
function renderAll(all) {
	var tops = [];
	var kidsBy = {};
	all.forEach(function (c) {
		if (c.pid) {
			var k = String(c.pid);
			if (!kidsBy[k]) kidsBy[k] = [];
			kidsBy[k].push(c);
		} else {
			tops.push(c);
		}
	});
	tops.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
	Object.keys(kidsBy).forEach(function (k) {
		kidsBy[k].sort(function (a, b) { return (a.time || 0) - (b.time || 0); });
	});

	S.posts = [];
	tops.forEach(function (c) {
		var p = parseThread(c);
		if (!p.items.length) return;
		S.posts.push({ c: c, p: p, kids: kidsBy[String(c.objectId)] || [] });
	});
	buildTagRow();

	/* 分享链接直达：先把列表画出来，再把详情层/查看器叠上去。
	   否则列表区停在「正在读照片…」的空态，关掉详情层就一片空白，只能刷新。 */
	var jumpHit = null, jumpTo = 0;
	if (S.jump) {
		var id = Number(S.jump.p);
		var jumpIdx = S.jumpIdx || 0;
		var hit = null;
		S.posts.forEach(function (e) { if (Number(e.c.objectId) === id) hit = e; });
		S.jump = null;
		S.jumpIdx = 0;
		if (hit) { jumpHit = hit; jumpTo = jumpIdx; }
	}
	paintFeed();
	if (jumpHit) {
		if (jumpTo) openPic(jumpHit, jumpTo - 1);
		else openThread(jumpHit);
	}
}

function buildTagRow() {
	var cnt = {};
	S.posts.forEach(function (e) {
		threadTags(e.p).forEach(function (t) { cnt[t] = (cnt[t] || 0) + 1; });
	});
	var keys = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a] || (a < b ? -1 : 1); }).slice(0, 16);
	tagRow.innerHTML = '';
	keys.forEach(function (t) {
		var b = document.createElement('button');
		b.className = 'tag' + (S.tag === t ? ' on' : '');
		b.innerHTML = esc(t) + '<span class="n">' + cnt[t] + '</span>';
		b.addEventListener('click', function () {
			S.tag = (S.tag === t) ? '' : t;
			buildTagRow();
			paintFeed();
		});
		tagRow.appendChild(b);
	});
}

function paintFeed() {
	var list = S.posts.filter(function (e) {
		var p = e.p;
		if (S.tag && threadTags(p).indexOf(S.tag) < 0) return false;
		if (S.q) {
			var hay = [p.head, (e.c.nick || ''), threadTags(p).join(' ')]
				.concat(p.items.map(function (it) { return it.note; }))
				.join(' ').toLowerCase();
			if (hay.indexOf(S.q.toLowerCase()) < 0) return false;
		}
		return true;
	});

	feedEl.innerHTML = '';
	if (!list.length) {
		emptyEl.style.display = 'block';
		emptyEl.innerHTML = (S.q || S.tag)
			? '没找到。换个词试试，或者点一下已选中的标签取消筛选。'
			: '还没有人放照片。<br>等第一张全景上线吧。';
		return;
	}
	emptyEl.style.display = 'none';
	list.forEach(function (e) { feedEl.appendChild(renderCard(e)); });
}

/* ========== 卡片 ========== */
function renderCard(e) {
	var c = e.c, p = e.p, kids = e.kids;
	var card = document.createElement('div');
	card.className = 'card';

	var shot = document.createElement('div');
	shot.className = 'shot';
	var im = document.createElement('img');
	im.loading = 'lazy';
	im.alt = '照片';
	im.src = thumbUrl(p.cover, THUMB_W);
	im.onerror = function () {
		im.style.display = 'none';
		var lost = document.createElement('div');
		lost.className = 'lost';
		lost.textContent = '这张图没取到';
		shot.appendChild(lost);
	};
	shot.appendChild(im);

	var hint = document.createElement('span');
	hint.className = p.items.length > 1 ? 'count' : 'hint';
	hint.textContent = p.items.length > 1 ? (p.items.length + ' 张') : '点开看';
	shot.appendChild(hint);

	shot.addEventListener('click', function () {
		if (p.items.length > 1) openThread(e);
		else openPic(e, 0);
	});

	var body = document.createElement('div');
	body.className = 'card-body';

	var row = document.createElement('div');
	row.className = 'row';
	var nk = document.createElement('span');
	nk.className = 'nick';
	nk.textContent = c.nick || DEFAULT_NICK;
	var tm = document.createElement('span');
	tm.className = 'time';
	tm.textContent = fmtTime(c.time);
	row.appendChild(nk); row.appendChild(tm);
	body.appendChild(row);

	var text = p.head || (p.items[0] && p.items[0].note) || '';
	if (text) {
		var desc = document.createElement('div');
		desc.className = 'desc';
		desc.textContent = text;
		body.appendChild(desc);
		if (text.length > 80) {
			desc.classList.add('clamp');
			var more = document.createElement('span');
			more.className = 'more';
			more.textContent = ' 展开';
			more.addEventListener('click', function () {
				if (desc.classList.contains('clamp')) { desc.classList.remove('clamp'); more.textContent = ''; }
			});
			desc.appendChild(more);
		}
	}

	var tags = threadTags(p);
	if (tags.length) body.appendChild(chipsRow(tags, 5));

	card.appendChild(shot);
	card.appendChild(body);

	var bar = document.createElement('div');
	bar.className = 'cmt-bar';
	var btn = document.createElement('button');
	btn.textContent = '💬 ' + (kids.length ? ('评论 ' + kids.length) : '评论');
	var grow = document.createElement('span');
	grow.className = 'grow';
	var shareBtn = document.createElement('button');
	shareBtn.textContent = '🔗 分享';
	shareBtn.addEventListener('click', function () {
		shareThread(c.objectId, 0,
			(p.head || (p.items[0] && p.items[0].note) || '').slice(0, 30),
			p.cover ? shareThumb(p.cover) : '');
	});
	bar.appendChild(btn);
	bar.appendChild(grow);
	bar.appendChild(shareBtn);
	card.appendChild(bar);

	var listBox = document.createElement('div');
	listBox.className = 'cmt-list';
	listBox.style.display = 'none';
	card.appendChild(listBox);

	var opened = false;
	btn.addEventListener('click', function () {
		if (!opened) {
			opened = true;
			listBox.style.display = 'block';
			fillComments(listBox, e, null);
		} else {
			listBox.style.display = listBox.style.display === 'none' ? 'block' : 'none';
		}
	});

	return card;
}

function chipsRow(tags, max) {
	var wrap = document.createElement('div');
	wrap.className = 'chips';
	tags.slice(0, max || 99).forEach(function (t) {
		var b = document.createElement('button');
		b.className = 'chip';
		b.textContent = '#' + t;
		b.addEventListener('click', function (ev) {
			ev.stopPropagation();
			S.tag = t;
			S.q = '';
			qEl.value = '';
			qClear.style.display = 'none';
			buildTagRow();
			paintFeed();
			window.scrollTo(0, 0);
		});
		wrap.appendChild(b);
	});
	return wrap;
}

/* ---------- 搜索 ---------- */
var qTimer = 0;
qEl.addEventListener('input', function () {
	qClear.style.display = qEl.value ? 'block' : 'none';
	clearTimeout(qTimer);
	qTimer = setTimeout(function () {
		S.q = qEl.value.trim();
		paintFeed();
	}, 260);
});
qEl.addEventListener('keydown', function (ev) {
	if (ev.key === 'Enter') {
		clearTimeout(qTimer);
		S.q = qEl.value.trim();
		paintFeed();
	}
});
qClear.addEventListener('click', function () {
	qEl.value = '';
	S.q = '';
	qClear.style.display = 'none';
	paintFeed();
	qEl.focus();
});

function fillComments(box, e, picIdx) {
	var post = e.c;
	var kids = e.kids.filter(function (k) {
		var pk = parseKid(k);
		if (picIdx === null || picIdx === undefined) return true;
		return pk.pic === picIdx + 1;
	});
	box.innerHTML = '';
	if (!kids.length) {
		var no = document.createElement('div');
		no.className = 'cmt';
		no.innerHTML = '<div class="txt" style="color:#9aa1a7">' +
			(picIdx === null || picIdx === undefined ? '还没人说话，来第一句。' : '这一张还没人评论。') + '</div>';
		box.appendChild(no);
	}
	kids.forEach(function (k) {
		var pk = parseKid(k);
		var one = document.createElement('div');
		one.className = 'cmt';
		var av = document.createElement('img');
		av.className = 'av';
		av.loading = 'lazy';
		av.src = k.avatar || ('https://seccdn.libravatar.org/avatar/' + '0');
		var wrap = document.createElement('div');
		var who = document.createElement('div');
		who.className = 'who';
		who.innerHTML = '<b>' + esc(k.nick || GUEST_NICK) + '</b> · ' + esc(fmtTime(k.time)) +
			(k.addr ? ' · ' + esc(k.addr) : '');
		if (pk.pic) {
			var fg = document.createElement('span');
			fg.className = 'fig';
			fg.textContent = '第 ' + pk.pic + ' 张';
			who.appendChild(fg);
		}
		var txt = document.createElement('div');
		txt.className = 'txt';
		txt.textContent = pk.text;
		var pic = new DOMParser().parseFromString('<!doctype html><body>' + String(k.comment || ''), 'text/html').querySelector('img');
		if (pic) {
			var pi = document.createElement('img');
			pi.src = pic.getAttribute('src');
			pi.style.cssText = 'max-width:100%;border-radius:8px;margin-top:6px;display:block';
			txt.appendChild(pi);
		}
		wrap.appendChild(who);
		wrap.appendChild(txt);
		one.appendChild(av);
		one.appendChild(wrap);
		box.appendChild(one);
	});

	var form = document.createElement('div');
	form.className = 'cmt-form';
	var nk = document.createElement('input');
	nk.type = 'text'; nk.placeholder = '怎么称呼你（可留空）'; nk.maxLength = 24;
	var tx = document.createElement('textarea');
	tx.placeholder = (picIdx === null || picIdx === undefined) ? '说两句' : '说说这一张';
	tx.maxLength = 400;
	var act = document.createElement('div');
	act.className = 'act';
	var msg = document.createElement('span');
	msg.className = 'msg';
	var send = document.createElement('button');
	send.className = 'btn';
	send.textContent = '发送';
	act.appendChild(msg); act.appendChild(send);
	form.appendChild(nk); form.appendChild(tx); form.appendChild(act);
	box.appendChild(form);

	send.addEventListener('click', function () {
		var body = tx.value.trim();
		if (!body) { msg.textContent = '先写点什么'; return; }
		send.disabled = true;
		msg.className = 'msg';
		msg.textContent = '发送中…';
		var prefix = (picIdx === null || picIdx === undefined) ? '' : ('\u3014图' + (picIdx + 1) + '\u3015');
		fetch(API + '/comment', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				comment: prefix + body,
				nick: (nk.value.trim() || GUEST_NICK),
				mail: GUEST_MAIL,
				url: PAGE_PATH,
				path: PAGE_PATH,
				pid: post.objectId,
				ua: navigator.userAgent
			})
		}).then(function (r) { return r.json(); }).then(function (res) {
			if (res && res.errno === 0) {
				msg.className = 'msg ok';
				msg.textContent = '发了，刷新能看到。';
				tx.value = '';
				setTimeout(function () { location.reload(); }, 1600);
			} else {
				throw new Error((res && res.errmsg) || '发送失败');
			}
		}).catch(function (err) {
			msg.className = 'msg';
			msg.textContent = errText(err && err.message);
			send.disabled = false;
		});
	});
}

/* ========== 查看器 ========== */
var viewerEl = document.getElementById('viewer');
var sphereEl = document.getElementById('sphere');
var vTitle = document.getElementById('vTitle');
var vFoot = document.getElementById('vFoot');

function hasWebGL() {
	try {
		var c = document.createElement('canvas');
		return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
	} catch (e) { return false; }
}

var vShare = document.getElementById('vShare');
var vPanel = document.getElementById('vPanel');

/* 查看器底部的「下载原图」每换一张就重画一次，绑一次事件委托就够 */
vFoot.addEventListener('click', function (ev) {
	var a = ev.target && ev.target.id === 'dlTip' ? ev.target : null;
	if (!a) return;
	ev.preventDefault();
	var cur = S.cur;
	if (!cur || !cur.e || !cur.e.p) return;
	var it = cur.e.p.items[cur.idx];
	if (!it) return;
	downloadOriginal(it.url, 'pano-' + cur.e.c.objectId + '-' + (cur.idx + 1));

/* 某张图下的评论条数 */
function cntFor(e, idx) {
	var n = 0;
	(e.kids || []).forEach(function (k) { if (parseKid(k).pic === idx + 1) n++; });
	return n;
}

function openPic(e, idx) {
	var p = e.p;
	var it = p.items[idx];
	if (!it) return;
	S.cur = { e: e, idx: idx };
	vTitle.textContent = (it.note || p.head || '照片').slice(0, 40);
	syncAddress(e.c.objectId, idx + 1);
	/* 单张分享：标题用帖子的总说明，描述用这张图自己的说明 */
	setShareMeta((p.head || it.note || '全景照片').slice(0, 30), shareThumb(it.url), it.note);
	viewerEl.classList.remove('immersive');
	viewerEl.classList.add('on');
	vPanel.classList.remove('on');
	vPanel.innerHTML = '';

	var n = cntFor(e, idx);
	vFoot.innerHTML = '<div class="acts">' +
		'<button id="vCmtBtn">💬 ' + (n ? ('评论 ' + n) : '评论') + '</button>' +
		'<button id="vShareBtn">🔗 分享这张</button>' +
		'</div><span id="vTip">正在取图…</span>';

	document.getElementById('vCmtBtn').addEventListener('click', function () {
		if (vPanel.classList.contains('on')) { vPanel.classList.remove('on'); return; }
		vPanel.classList.add('on');
		fillComments(vPanel, e, idx);
	});
	document.getElementById('vShareBtn').addEventListener('click', function () {
		shareThread(e.c.objectId, idx + 1, (p.head || '').slice(0, 30), shareThumb(it.url), it.note);
	});
	vShare.onclick = function () { shareThread(e.c.objectId, idx + 1, (p.head || '').slice(0, 30), shareThumb(it.url), it.note); };

	/* 先探一下比例：转出来的全景是 2:1，普通照片保持原比例 */
	sphereEl.innerHTML = '<div class="loading">正在取图…</div>';
	var probe = new Image();
	probe.onload = function () {
		if (probe.naturalWidth / Math.max(1, probe.naturalHeight) > 1.8) showSphere(it.url);
		else showFlat(it.url);
	};
	probe.onerror = function () { showFlat(it.url); };
	probe.src = thumbUrl(it.url, 480);
}

function showSphere(rawUrl) {
	if (S.viewer) { try { S.viewer.destroy(); } catch (e) {} S.viewer = null; }
	if (S.soft) { S.soft.alive = false; S.soft = null; }
	S.resetZoom = null;
	sphereEl.innerHTML = '<div class="loading">正在取图…</div>';
	var tip = document.getElementById('vTip');
	if (tip) tip.innerHTML = '按住拖动看四周，双指或滚轮缩放 · <a href="#" id="dlTip">下载原图</a>';
	/* 按 GPU 纹理上限取图，别一律压到 2048 */
	var tex = Math.min(maxTexSize(), 6144);
	var big = thumbUrl(rawUrl, tex);

	if (window.PhotoSphereViewer && window.THREE && hasWebGL()) {
		sphereEl.innerHTML = '';
		try {
			S.viewer = new PhotoSphereViewer.Viewer({
				container: sphereEl,
				panorama: big,
				navbar: false,
				loadingImg: false,
				touchmoveTwoFingers: false,
				mousewheelCtrlKey: false,
				defaultYaw: 0,
				defaultPitch: 0,
				minFov: 25,
				maxFov: 90
			});
			return;
		} catch (e) {}
	}
	showSoft(thumbUrl(rawUrl, Math.min(3072, Math.round(430 * DPR * 2))));
}

function showFlat(rawUrl) {
	if (S.viewer) { try { S.viewer.destroy(); } catch (e) {} S.viewer = null; }
	if (S.soft) { S.soft.alive = false; S.soft = null; }
	sphereEl.innerHTML = '<div class="loading">正在取图…</div>';
	var tip2 = document.getElementById('vTip');
	if (tip2) tip2.innerHTML = '普通照片 · <a href="#" id="dlTip">下载原图</a>';
	var im = new Image();
	im.onload = function () {
		sphereEl.innerHTML = '';
		/* 底下垫同一张图的模糊放大版，画面铺满整屏，主体还是完整的原比例 */
		var bg = document.createElement('div');
		bg.className = 'flatbg';
		bg.style.backgroundImage = 'url("' + thumbUrl(rawUrl, 480) + '")';
		sphereEl.appendChild(bg);

		im.className = 'flatimg';
		sphereEl.appendChild(im);
		bindZoom(im);
	};
	im.onerror = function () { sphereEl.innerHTML = '<div class="loading">图片没取到，点下面「下载原图」试试</div>'; };
	im.src = thumbUrl(rawUrl, Math.min(2048, Math.round(430 * DPR * 2)));
}

/* 普通照片的手势：双指缩放、放大后单指拖动、双击放大/复位。球面那套交给官方 PSV，这里不插手 */
function bindZoom(im) {
	var s = 1, tx = 0, ty = 0, MAXS = 5;
	var pts = {}, lastX = 0, lastY = 0, dragging = false, baseS = 1, lastDist = 0, lastTap = 0;

	function clampMove() {
		var cw = im.clientWidth || 1, ch = im.clientHeight || 1;
		var iw = im.naturalWidth || cw, ih = im.naturalHeight || ch;
		var k = Math.min(cw / iw, ch / ih);
		var maxX = Math.max(0, (iw * k * s - cw) / 2);
		var maxY = Math.max(0, (ih * k * s - ch) / 2);
		tx = Math.max(-maxX, Math.min(maxX, tx));
		ty = Math.max(-maxY, Math.min(maxY, ty));
	}
	function apply() {
		if (s < 1.02) { s = 1; tx = 0; ty = 0; }
		clampMove();
		im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
	}
	function reset() { s = 1; tx = 0; ty = 0; im.style.transform = ''; }
	S.resetZoom = reset;

	function dist() {
		var p = Object.keys(pts).map(function (k2) { return pts[k2]; });
		return Math.sqrt(Math.pow(p[0].x - p[1].x, 2) + Math.pow(p[0].y - p[1].y, 2));
	}

	im.addEventListener('pointerdown', function (ev) {
		pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
		var n = Object.keys(pts).length;
		if (n === 1) {
			dragging = true; lastX = ev.clientX; lastY = ev.clientY;
		} else if (n === 2) {
			dragging = false; baseS = s; lastDist = dist();
		}
		try { im.setPointerCapture(ev.pointerId); } catch (e) {}
	});

	im.addEventListener('pointermove', function (ev) {
		if (!pts[ev.pointerId]) return;
		pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
		var n = Object.keys(pts).length;
		if (n >= 2) {
			var d = dist();
			if (lastDist > 0) s = Math.max(1, Math.min(MAXS, baseS * d / lastDist));
			apply();
		} else if (dragging && s > 1) {
			tx += ev.clientX - lastX;
			ty += ev.clientY - lastY;
			lastX = ev.clientX; lastY = ev.clientY;
			clampMove();
			im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
		}
	});

	function up(ev) {
		if (pts[ev.pointerId]) delete pts[ev.pointerId];
		if (Object.keys(pts).length < 2) lastDist = 0;
		if (Object.keys(pts).length === 0) dragging = false;
	}
	im.addEventListener('pointerup', function (ev) {
		/* 手指抬起且没怎么动，按双击处理（移动端 dblclick 不稳） */
		if (Object.keys(pts).length === 1 && s <= 1.02) {
			var now = Date.now();
			if (now - lastTap < 280) { s = 2.5; tx = 0; ty = 0; apply(); lastTap = 0; }
			else lastTap = now;
		}
		up(ev);
	});
	im.addEventListener('pointercancel', up);
	im.addEventListener('dblclick', function () {
		if (s > 1) reset(); else { s = 2.5; tx = 0; ty = 0; apply(); }
	});
	im.addEventListener('wheel', function (ev) {
		ev.preventDefault();
		s = Math.max(1, Math.min(MAXS, s * (ev.deltaY > 0 ? 0.9 : 1.1)));
		apply();
	}, { passive: false });
}

function closeViewer() {
	viewerEl.classList.remove('on');
	viewerEl.classList.remove('immersive');
	S.resetZoom = null;
	if (S.viewer) { try { S.viewer.destroy(); } catch (e) {} S.viewer = null; }
	if (S.soft) { S.soft.alive = false; S.soft = null; }
	sphereEl.innerHTML = '';
	/* 退回帖子层：地址也跟着退回这一条，免得分享出去变成首页 */
	if (S.cur && threadEl.classList.contains('on')) {
		var pp = S.cur.e.p;
		syncAddress(S.cur.e.c.objectId);
		setShareMeta(pp.head ? pp.head.slice(0, 30) : '全景相框', pp.items[0] ? shareThumb(pp.items[0].url) : '');
	} else {
		syncAddress(0);
		setShareMeta('');
	}
}

document.getElementById('vClose').addEventListener('click', closeViewer);
/* 全屏按钮：收起上下栏只留图，右上角出退出按钮（和招生页 PSV 那个全屏按钮是一个意思） */
document.getElementById('vFullBtn').addEventListener('click', function () {
	viewerEl.classList.add('immersive');
});
document.getElementById('vExit').addEventListener('click', function () {
	viewerEl.classList.remove('immersive');
});
window.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeViewer(); closeThread(); } });

/* ---------- 帖子详情层 ---------- */
var threadEl = document.getElementById('thread');
var tNick = document.getElementById('tNick');
var tTime = document.getElementById('tTime');
var tDesc = document.getElementById('tDesc');
var tGrid = document.getElementById('tGrid');
var tCmts = document.getElementById('tCmts');
var tShare = document.getElementById('tShare');

function openThread(e) {
	var c = e.c, p = e.p;
	tNick.textContent = c.nick || DEFAULT_NICK;
	tTime.textContent = fmtTime(c.time);

	tDesc.innerHTML = '';
	if (p.head) {
		var d = document.createElement('div');
		d.className = 'desc';
		d.textContent = p.head;
		tDesc.appendChild(d);
	}
	var tags = threadTags(p);
	if (tags.length) tDesc.appendChild(chipsRow(tags, 9));

	tGrid.innerHTML = '';
	tGrid.style.gridTemplateColumns = 'repeat(' + Math.min(3, p.items.length || 1) + ', 1fr)';
	p.items.forEach(function (it, i) {
		var g = document.createElement('div');
		g.className = 'g' + (p.items.length === 1 ? ' wide' : '');
		var im = new Image();
		im.loading = 'lazy';
		im.alt = '第 ' + (i + 1) + ' 张';
		im.src = thumbUrl(it.url, Math.round(180 * DPR));
		g.appendChild(im);
		var k = document.createElement('span');
		var n = cntFor(e, i);
		k.className = 'k' + (n ? '' : ' zero');
		k.textContent = n ? ('💬 ' + n) : '💬';
		g.appendChild(k);
		g.addEventListener('click', function () { openPic(e, i); });
		tGrid.appendChild(g);
	});

	tCmts.innerHTML = '';
	fillComments(tCmts, e, null);
	tShare.onclick = function () {
		shareThread(c.objectId, 0, (p.head || '').slice(0, 30), p.items[0] ? shareThumb(p.items[0].url) : '');
	};

	threadEl.classList.add('on');
	threadEl.scrollTop = 0;
	syncAddress(c.objectId);
	setShareMeta(p.head ? p.head.slice(0, 30) : '全景相框', p.items[0] ? shareThumb(p.items[0].url) : '');
}

function closeThread() {
	if (!threadEl.classList.contains('on')) return;
	threadEl.classList.remove('on');
	if (location.search.indexOf('p=') >= 0) {
		try { history.replaceState(null, '', location.pathname); } catch (e) {}
	}
	setShareMeta('');
	/* 从分享链接直达时列表可能还没画过，这里补一次，别留空态 */
	if (!feedEl.children.length && S.posts.length) paintFeed();
}

document.getElementById('tClose').addEventListener('click', closeThread);
threadEl.addEventListener('click', function (e) {
	if (e.target === threadEl) closeThread();
});

/* ---------- 分享 ---------- */
/* 微信右上角「··· → 发送给朋友」抓的是当前页面地址，页面自己没法替它把
   参数塞进去。所以打开帖子/照片时就把地址同步成 ?p=id&i=n，顺手换掉
   title 和 og 标签 —— 这样在微信里转发出去，对方点开就是这一条，而不是首页。 */
var BASE_TITLE = document.title;

function syncAddress(id, pic) {
	try {
		history.replaceState(null, '', location.pathname + (id ? '?p=' + id + (pic ? '&i=' + pic : '') : ''));
	} catch (e) {}
}

function setShareMeta(title, img, desc) {
	var t = title || BASE_TITLE;
	/* 标题和描述分开传：单张分享时标题用帖子的"总的说两句"，描述用这张图自己的说明 */
	var d = (desc && String(desc).trim()) ? String(desc).trim() : t;
	document.title = t;
	var pairs = [['description', d], ['og:title', t], ['og:description', d], ['og:image', img || ''], ['og:url', location.href]];
	pairs.forEach(function (pr) {
		var key = pr[0].indexOf(':') >= 0 ? 'property' : 'name';
		var el = document.head.querySelector('meta[' + key + '="' + pr[0] + '"]');
		if (!el) {
			el = document.createElement('meta');
			el.setAttribute(key, pr[0]);
			document.head.appendChild(el);
		}
		el.setAttribute('content', pr[1]);
	});
}

/* 转发卡片缩略图按微信的习惯用方图 */
function shareThumb(u) {
	return String(u).replace('/image/upload/', '/image/upload/c_fill,h_400,w_400,q_auto,f_jpg/');
}

/* 下载原图：图床的 fl_attachment 会让响应带 Content-Disposition: attachment，
   浏览器收到就直接存盘（跨域时 <a download> 会被忽略，靠这个头兜底） */
function attachUrl(u, name) {
	return String(u).replace('/image/upload/', '/image/upload/fl_attachment:' + (name || 'pano') + '/');
}

function downloadOriginal(u, name) {
	var ext = /\.png(\?|$)/i.test(u) ? '.png' : '.jpg';
	/* 微信里 attachment 头不一定认，直接把原图打开，用户长按就能存相册 */
	if (IN_WX) {
		var w = window.open(u, '_blank');
		if (!w) location.href = u;
		toast('原图已打开，长按图片存到相册');
		return;
	}
	var a = document.createElement('a');
	a.href = attachUrl(u, name);
	a.download = (name || 'pano') + ext;
	a.rel = 'noopener';
	a.style.display = 'none';
	document.body.appendChild(a);
	a.click();
	setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 200);
	toast('正在下载原图' + ext);
}

/* 微信内置浏览器（X5 / WKWebView）既没有 Web Share，也没有任何 JS 接口能
   唤起「发送给朋友」面板——那个面板是微信自己攥着的，公众号 JS-SDK 也只
   能改转发卡片的标题和图片，同样弹不出来。所以微信里点分享时，给一层
   指向右上角菜单的指引。 */
var IN_WX = /MicroMessenger/i.test(navigator.userAgent);

function postUrl(id, pic) {
	/* 在内网/本机调试时分享出去的链接要换成正式域名，否则别人打不开 */
	var host = location.hostname;
	var inner = /^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host);
	var base = inner ? 'https://www.qnkjxx.top' + location.pathname : location.origin + location.pathname;
	return base + '?p=' + id + (pic ? '&i=' + pic : '');
}

/* 微信里点分享：光弹指引没用——微信抓的是地址栏。所以先把地址换成这一条
   （列表里点卡片分享时地址还停在首页），再让用户点右上角转发，带出去的就
   是这条帖子；从详情层/看图里分享时地址本来已经同步过，不用重复改。 */
var wxRestore = false;

function shareThread(id, pic, title, img, desc) {
	var u = postUrl(id, pic);
	if (IN_WX) {
		var onThread = threadEl && threadEl.classList.contains('on');
		var onPic = viewerEl && viewerEl.classList.contains('on');
		if (!onThread && !onPic) {
			syncAddress(id, pic);
			setShareMeta(title || '', img || '', desc || '');
			wxRestore = true;
		}
		wxAsk(u);
		return;
	}
	if (navigator.share) {
		navigator.share({ title: title || '全景相框', text: desc || (pic ? '第 ' + pic + ' 张照片' : ''), url: u })
			.catch(function (err) {
				/* 用户自己按了取消，不要再补一次复制 */
				if (err && err.name === 'AbortError') return;
				copyText(u);
			});
		return;
	}
	copyText(u);
}

/* 微信里的转发指引层 */
var wxEl = null, wxUrl = '';

function wxAsk(u) {
	wxUrl = u;
	if (!wxEl) wxEl = document.getElementById('wxTip');
	wxEl.hidden = false;
	requestAnimationFrame(function () { wxEl.classList.add('on'); });
}

function wxHide() {
	if (!wxEl) return;
	wxEl.classList.remove('on');
	setTimeout(function () { wxEl.hidden = true; }, 200);
	/* 从列表里点分享临时改过地址，关掉指引就退回首页，别让地址一直指着某一条 */
	if (wxRestore) {
		wxRestore = false;
		syncAddress(0);
		setShareMeta('');
	}
}

function copyText(u) {
	var done = function () {
		toast(IN_WX ? '链接已复制，回到聊天窗口粘贴发送'
			: (navigator.share ? '链接已复制' : '链接已复制，换成正式网址就能直接分享'));
	};
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(u).then(done).catch(function () { fallbackCopy(u, done); });
	} else {
		fallbackCopy(u, done);
	}
}

document.getElementById('wxTip').addEventListener('click', function (e) {
	if (e.target === this) wxHide();
});
document.getElementById('wxClose').addEventListener('click', wxHide);
document.getElementById('wxCopy').addEventListener('click', function () {
	wxHide();
	copyText(wxUrl);
});

function fallbackCopy(u, done) {
	var ta = document.createElement('textarea');
	ta.value = u;
	ta.style.cssText = 'position:fixed;left:-9999px;top:0';
	document.body.appendChild(ta);
	ta.select();
	try { document.execCommand('copy'); done(); } catch (e) { toast(u); }
	ta.remove();
}

function toast(msg) {
	var el = document.createElement('div');
	el.className = 'toast';
	el.textContent = msg;
	document.body.appendChild(el);
	requestAnimationFrame(function () { el.classList.add('on'); });
	setTimeout(function () { el.classList.remove('on'); }, 2200);
	setTimeout(function () { el.remove(); }, 2800);
}

/* ---------- 没有 WebGL 时的软件球面 ---------- */
function showSoft(url) {
	sphereEl.innerHTML = '<div class="loading">这台设备没开 3D 加速，正在用软渲染</div>';
	var tipS = document.getElementById('vTip');
	if (tipS) tipS.innerHTML = '按住拖动看四周，双指或滚轮缩放 · <a href="#" id="dlTip">下载原图</a>';
	var img = new Image();
	img.crossOrigin = 'anonymous';
	img.onload = function () {
		var w = Math.min(Math.max(2048, Math.min(3072, Math.round(430 * DPR * 2))), img.naturalWidth);
		var h = Math.round(w / 2);
		var cv = document.createElement('canvas');
		cv.width = w; cv.height = h;
		var cx = cv.getContext('2d', { willReadFrequently: true });
		cx.drawImage(img, 0, 0, w, h);
		var data;
		try { data = cx.getImageData(0, 0, w, h).data; }
		catch (e) { sphereEl.innerHTML = '<div class="loading">这张图跨域被拦了，点下面「下载原图」也能存下来</div>'; return; }
		startSoft({ data: data, w: w, h: h });
	};
	img.onerror = function () {
		sphereEl.innerHTML = '<div class="loading">图片没取到，点下面「直接看大图」</div>';
	};
	img.src = url;
}

function startSoft(eq) {
	var cv = document.createElement('canvas');
	cv.style.cssText = 'width:100%;height:100%;display:block;touch-action:none;cursor:grab';
	sphereEl.innerHTML = '';
	sphereEl.appendChild(cv);
	var st = { canvas: cv, ctx: cv.getContext('2d'), eq: eq, yaw: 0, pitch: 0, fov: 80, pending: false, steps: 0, alive: true };
	S.soft = st;

	var drag = false, lx = 0, ly = 0, pinch = 0;

	cv.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; ly = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
	cv.addEventListener('pointermove', function (e) {
		if (!drag) return;
		var dx = e.clientX - lx, dy = e.clientY - ly;
		lx = e.clientX; ly = e.clientY;
		var k = (st.fov / (cv.clientWidth || 320)) * Math.PI / 180;
		st.yaw -= dx * k;
		st.pitch = Math.max(-85 * Math.PI / 180, Math.min(85 * Math.PI / 180, st.pitch - dy * k));
		softDraw();
	});
	cv.addEventListener('pointerup', function () { drag = false; });
	cv.addEventListener('pointercancel', function () { drag = false; });
	cv.addEventListener('wheel', function (e) {
		e.preventDefault();
		st.fov = Math.max(35, Math.min(115, st.fov + (e.deltaY > 0 ? 6 : -6)));
		softDraw();
	}, { passive: false });
	cv.addEventListener('touchmove', function (e) {
		if (e.touches.length !== 2) return;
		e.preventDefault();
		var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
		if (pinch) { st.fov = Math.max(35, Math.min(115, st.fov * pinch / Math.max(1, d))); softDraw(); }
		pinch = d;
	}, { passive: false });
	cv.addEventListener('touchend', function () { pinch = 0; });

	softResize();
	window.addEventListener('resize', softResize);
}

function softResize() {
	var st = S.soft;
	if (!st || !st.alive) return;
	var box = sphereEl.getBoundingClientRect();
	var aspect = box.width / Math.max(1, box.height);
	var W = 460;
	var H = Math.max(150, Math.round(W / aspect));
	var total = W * H;
	if (total > 150000) {
		var s = Math.sqrt(150000 / total);
		W = Math.max(200, Math.round(W * s));
		H = Math.max(150, Math.round(H * s));
	}
	st.canvas.width = W;
	st.canvas.height = H;
	st.steps = 0;
	softDraw();
}

function softDraw() {
	var st = S.soft;
	if (!st || !st.alive || st.pending) return;
	st.pending = true;
	requestAnimationFrame(function () {
		st.pending = false;
		if (!st.alive) return;
		var eq = st.eq, d = eq.data, dw = eq.w, dh = eq.h;
		var W = st.canvas.width, H = st.canvas.height;
		var img = st.ctx.createImageData(W, H);
		var out = img.data;
		var aspect = W / H;
		var tanH = Math.tan(st.fov * Math.PI / 360);
		var cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
		var cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
		var t0 = performance.now();
		var oi = 0;
		for (var v = 0; v < H; v++) {
			var py = ((1 - 2 * (v + 0.5) / H) * tanH) / aspect;
			for (var u = 0; u < W; u++) {
				var px = (2 * (u + 0.5) / W - 1) * tanH;
				var y1 = py * cp - sp;
				var z1 = py * sp + cp;
				var x2 = px * cy + z1 * sy;
				var z2 = -px * sy + z1 * cy;
				var len = Math.sqrt(x2 * x2 + y1 * y1 + z2 * z2);
				var phi = Math.asin(y1 / len);
				var lam = Math.atan2(x2, z2);
				var ix = ((lam / 6.2831853 + 0.5) * dw) | 0;
				var iy = ((0.5 - phi / 3.14159265) * dh) | 0;
				if (ix >= dw) ix -= dw;
				if (ix < 0) ix += dw;
				if (iy >= dh) iy = dh - 1;
				if (iy < 0) iy = 0;
				var si = (iy * dw + ix) * 4;
				out[oi++] = d[si];
				out[oi++] = d[si + 1];
				out[oi++] = d[si + 2];
				out[oi++] = 255;
			}
		}
		st.ctx.putImageData(img, 0, 0);
		if (performance.now() - t0 > 45 && st.steps < 3 && st.canvas.width > 220) {
			st.steps++;
			st.canvas.width = Math.round(st.canvas.width * 0.78);
			st.canvas.height = Math.round(st.canvas.height * 0.78);
			setTimeout(softDraw, 0);
		}
	});
}

/* ========== 口令 ========== */
var gateEl = document.getElementById('gate');
var gatePass = document.getElementById('gatePass');

/* ========== 发布 ========== */
var composerEl = document.getElementById('composer');
var fileEl = document.getElementById('file');
var capText = document.getElementById('capText');
var pubTip = document.getElementById('pubTip');
var pubGo = document.getElementById('pubGo');
var progEl = document.getElementById('prog');
var progBar = progEl.querySelector('i');
var gridEl = document.getElementById('grid9');
var itemBox = document.getElementById('itemBox');
var itemLabel = document.getElementById('itemLabel');
var itemTags = document.getElementById('itemTags');
var itemNote = document.getElementById('itemNote');

var draft = [];
var selIdx = -1;
/* 上限只防一次传太多（正文长度和手机流量），不是朋友圈那种 9 张 */
var MAX_PICS = 30;

function openComposer() {
	composerEl.classList.add('on');
	pubTip.textContent = '';
	pubTip.className = 'tip';
	composerEl.scrollTop = 0;
	renderGrid();
	syncItem();
	syncGo();
}
document.getElementById('pubCancel').addEventListener('click', function () { composerEl.classList.remove('on'); });
composerEl.addEventListener('click', function (e) { if (e.target === composerEl) composerEl.classList.remove('on'); });

function syncGo() {
	pubGo.disabled = !draft.length;
}

/* 已选的照片按顺序排，末尾只留一个"＋"；不再是固定九宫格 */
function renderGrid() {
	gridEl.innerHTML = '';
	draft.forEach(function (d, i) {
		var cell = document.createElement('div');
		cell.className = 'cell' + (selIdx === i ? ' on' : '');
		cell.setAttribute('data-i', i);
		var im = new Image();
		im.src = d.url;
		im.alt = '第 ' + (i + 1) + ' 张';
		cell.appendChild(im);
		if (d.tags.length) {
			var bd = document.createElement('span');
			bd.className = 'badge';
			bd.textContent = d.tags.length + ' 标';
			cell.appendChild(bd);
		}
		var del = document.createElement('button');
		del.type = 'button';
		del.className = 'del';
		del.textContent = '×';
		del.addEventListener('click', function (ev) {
			ev.stopPropagation();
			try { URL.revokeObjectURL(d.url); } catch (er) {}
			draft.splice(i, 1);
			if (selIdx >= draft.length) selIdx = draft.length - 1;
			renderGrid();
			syncItem();
			syncGo();
		});
		cell.appendChild(del);
		cell.addEventListener('click', function () {
			if (selIdx === i) return;
			stashItem();
			selIdx = i;
			renderGrid();
			syncItem();
		});
		bindDrag(cell, i);
		gridEl.appendChild(cell);
	});
	if (draft.length < MAX_PICS) {
		var add = document.createElement('div');
		add.className = 'cell add';
		add.innerHTML = '<span>＋</span>';
		add.addEventListener('click', function () { fileEl.click(); });
		gridEl.appendChild(add);
	}
}

/* 拖动排序：把一张按住往左右拖，落到哪个格子就换到那个位置。
   竖着滑仍然交给页面滚动，不会把翻页手势吃掉。 */
function bindDrag(cell, from) {
	var sx = 0, sy = 0, moved = false, to = from;
	var clearOver = function () {
		Array.prototype.forEach.call(gridEl.querySelectorAll('.cell.over'), function (c) { c.classList.remove('over'); });
	};
	var onMove = function (e) {
		var dx = e.clientX - sx, dy = e.clientY - sy;
		if (!moved) {
			/* 先横后纵才算拖动 */
			if (Math.abs(dx) < 22 || Math.abs(dx) <= Math.abs(dy)) return;
			moved = true;
			cell.classList.add('drag');
			/* 拖起来的那张要"透明"，否则它自己挡在手指下面，测出来的落点永远是它自己 */
			cell.style.pointerEvents = 'none';
		}
		cell.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
		var el = document.elementFromPoint(e.clientX, e.clientY);
		var hit = el && el.closest ? el.closest('.cell') : null;
		var di = hit ? hit.getAttribute('data-i') : null;
		if (di != null) to = Number(di);
		clearOver();
		if (to !== from) {
			var t = gridEl.querySelector('.cell[data-i="' + to + '"]');
			if (t) t.classList.add('over');
		}
	};
	var onUp = function () {
		document.removeEventListener('pointermove', onMove);
		document.removeEventListener('pointerup', onUp);
		document.removeEventListener('pointercancel', onUp);
		if (!moved) return;
		cell.classList.remove('drag');
		cell.style.transform = '';
		cell.style.pointerEvents = '';
		clearOver();
		if (to === from || to < 0 || to >= draft.length) return;
		stashItem();
		var it = draft.splice(from, 1)[0];
		draft.splice(to, 0, it);
		selIdx = to;
		renderGrid();
		syncItem();
	};
	cell.addEventListener('pointerdown', function (e) {
		if (e.target && e.target.closest && e.target.closest('.del')) return;
		if (e.button && e.button !== 0) return;
		sx = e.clientX; sy = e.clientY; moved = false; to = from;
		document.addEventListener('pointermove', onMove);
		document.addEventListener('pointerup', onUp);
		document.addEventListener('pointercancel', onUp);
	});
	cell.addEventListener('click', function (e) {
		if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
	}, true);
}

function syncItem() {
	var d = draft[selIdx];
	if (!d) { itemBox.style.display = 'none'; return; }
	itemBox.style.display = 'block';
	itemLabel.textContent = '第 ' + (selIdx + 1) + ' 张的标签';
	itemTags.value = d.tags.join(' ');
	itemNote.value = d.note;
}

function stashItem() {
	var d = draft[selIdx];
	if (!d) return;
	d.tags = parseTags(itemTags.value);
	d.note = itemNote.value.trim().slice(0, 60);
}

itemTags.addEventListener('input', function () { stashItem(); renderGrid(); });
itemNote.addEventListener('input', function () { stashItem(); });

function parseTags(s) {
	return String(s || '')
		.split(/[\s,，、]+/)
		.map(function (x) { return x.replace(/^#+/, '').replace(/[\u3014\u3015\u27E6\u27E7|]/g, '').trim().slice(0, 14); })
		.filter(Boolean)
		.slice(0, 8);
}

fileEl.addEventListener('change', function () {
	var fs = Array.prototype.slice.call(fileEl.files || []);
	fileEl.value = '';
	if (!fs.length) return;
	var room = MAX_PICS - draft.length;
	if (room <= 0) { pubTip.className = 'tip'; pubTip.textContent = '最多 ' + MAX_PICS + ' 张'; return; }
	if (fs.length > room) {
		pubTip.className = 'tip';
		pubTip.textContent = '只收前 ' + room + ' 张，够 ' + MAX_PICS + ' 张了';
		fs = fs.slice(0, room);
	}
	stashItem();
	pubGo.disabled = true;
	var bad = [];
	var i = 0;
	var step = function () {
		if (i >= fs.length) {
			renderGrid();
			syncGo();
			if (selIdx < 0 && draft.length) { selIdx = 0; syncItem(); }
			if (bad.length) {
				pubTip.className = 'tip';
				pubTip.textContent = bad.length + ' 张没处理成：' + bad[0];
			} else {
				pubTip.className = 'tip ok';
				pubTip.textContent = '共 ' + draft.length + ' 张 · ' +
					draft.map(function (d) { return Math.round(d.blob.size / 1024) + 'KB'; }).join(' / ') +
					'，点格子给单张加标签';
			}
			return;
		}
		var f = fs[i];
		pubTip.className = 'tip';
		pubTip.textContent = '正在处理第 ' + (i + 1) + ' / ' + fs.length + ' 张…';
		i++;
		/* 每张都按同一上限处理：以前只有第一张走 maxPanoWidth()，后面的被卡到 4096，
		   选多张时第二张起明显比第一张小一圈 */
		prepare(f, 0).then(function (o) {
			draft.push({
				blob: o.blob, w: o.w, h: o.h, pano: o.pano,
				url: URL.createObjectURL(o.blob), tags: [], note: ''
			});
			step();
		}).catch(function (err) {
			bad.push(err && err.message ? err.message : '处理失败');
			step();
		});
	};
	step();
});

/* 边缘取色：给上下补的天顶/脚底一个接近的颜色 */
function edgeColor(src, sy, sh) {
	var t = document.createElement('canvas');
	t.width = 32; t.height = 1;
	var c = t.getContext('2d', { willReadFrequently: true });
	c.drawImage(src, 0, sy, src.width, sh, 0, 0, 32, 1);
	var d = c.getImageData(0, 0, 32, 1).data;
	var r = 0, g = 0, b = 0;
	for (var i = 0; i < 32; i++) { r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; }
	return [Math.round(r / 32), Math.round(g / 32), Math.round(b / 32)];
}

function softStretch(ctx, src, sx, sy, sw, sh, dx, dy, dw, dh, k) {
	var t = document.createElement('canvas');
	t.width = Math.max(2, Math.round(dw / k));
	t.height = Math.max(2, Math.round(dh / k));
	var c = t.getContext('2d');
	c.drawImage(src, sx, sy, sw, sh, 0, 0, t.width, t.height);
	ctx.drawImage(t, 0, 0, t.width, t.height, dx, dy, dw, dh);
}

/* 横向长条 → 2:1 等距柱状：实拍带放中间，上下用边缘拉伸 + 同色雾补满 */
function toEquirect(band, bandRatio, capW) {
	var maxW = Math.min(maxPanoWidth(), capW || maxPanoWidth());
	var W = Math.min(maxW, Math.max(2400, Math.round(band.width / 2) * 2));
	if (W > maxW) W = Math.max(2400, maxW - (maxW % 2));
	var H = Math.round(W / 2);
	var bandH = Math.round(H * (bandRatio || 0.55));
	if (bandH > H) bandH = H;
	var y0 = Math.round((H - bandH) / 2);
	var eq = document.createElement('canvas');
	eq.width = W; eq.height = H;
	var g = eq.getContext('2d');
	var e1 = Math.max(4, Math.round(band.height * 0.04));
	var cTop = edgeColor(band, 0, e1);
	var cBot = edgeColor(band, Math.max(0, band.height - e1), e1);
	g.fillStyle = 'rgb(' + cTop.join(',') + ')';
	g.fillRect(0, 0, W, H);
	softStretch(g, band, 0, 0, band.width, Math.round(band.height * 0.18), 0, 0, W, y0 + Math.round(bandH * 0.1), 8);
	softStretch(g, band, 0, Math.round(band.height * 0.82), band.width, Math.round(band.height * 0.18), 0, y0 + bandH - Math.round(bandH * 0.08), W, H - (y0 + bandH - Math.round(bandH * 0.08)), 18);
	g.drawImage(band, 0, 0, band.width, band.height, 0, y0, W, bandH);
	var gt = g.createLinearGradient(0, 0, 0, y0 + bandH * 0.25);
	gt.addColorStop(0, 'rgba(' + cTop.join(',') + ',0.62)');
	gt.addColorStop(1, 'rgba(' + cTop.join(',') + ',0)');
	g.fillStyle = gt;
	g.fillRect(0, 0, W, y0 + bandH * 0.25);
	var gb = g.createLinearGradient(0, H, 0, y0 + bandH - bandH * 0.2);
	gb.addColorStop(0, 'rgba(' + cBot.join(',') + ',0.82)');
	gb.addColorStop(1, 'rgba(' + cBot.join(',') + ',0)');
	g.fillStyle = gb;
	g.fillRect(0, y0 + bandH - bandH * 0.2, W, H - (y0 + bandH - bandH * 0.2));
	return eq;
}

/* 2:1 输入按设备上限缩成等距柱状；其它比例居中裁成 2:1 */
function toEquirectDirect(img, capW) {
	var r = img.naturalWidth / img.naturalHeight;
	var sw, sh, sx, sy;
	if (r > 2) { sh = img.naturalHeight; sw = sh * 2; sx = (img.naturalWidth - sw) / 2; sy = 0; }
	else { sw = img.naturalWidth; sh = sw / 2; sx = 0; sy = (img.naturalHeight - sh) / 2; }
	var W = Math.min(maxPanoWidth(), capW || maxPanoWidth(), Math.round(sw / 2) * 2);
	var H = Math.round(W / 2);
	var cv = document.createElement('canvas');
	cv.width = W; cv.height = H;
	var g = cv.getContext('2d');
	g.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
	return cv;
}

function loadImg(src) {
	return new Promise(function (res, rej) {
		var i = new Image();
		i.onload = function () { res(i); };
		i.onerror = function () { rej(new Error('这张图打不开')); };
		i.src = src;
	});
}

/* 图床单文件硬上限 10MB，先在 9.6MB 内尽量保质量 */
function encodeUnder(cv, cap) {
	var qs = [0.95, 0.9, 0.84, 0.76, 0.68];
	return new Promise(function (res, rej) {
		var i = 0;
		var go = function () {
			cv.toBlob(function (b) {
				if (!b) { rej(new Error('压缩失败，换一张试试')); return; }
				if (b.size <= cap || i >= qs.length - 1) { res(b); return; }
				i++;
				go();
			}, 'image/jpeg', qs[i]);
		};
		go();
	});
}

/* 普通照片：等比缩到长边以内，不放大 */
function fitPhoto(img, maxSide, capW) {
	var w = img.naturalWidth, h = img.naturalHeight;
	var lim = Math.min(maxSide, capW || maxSide);
	var s = Math.min(1, lim / Math.max(w, h));
	var W = Math.max(1, Math.round(w * s));
	var H = Math.max(1, Math.round(h * s));
	var cv = document.createElement('canvas');
	cv.width = W; cv.height = H;
	cv.getContext('2d').drawImage(img, 0, 0, W, H);
	return cv;
}

/* 长条（比例 ≥1.7）转等距柱状；普通照片等比缩小。capW 用来控单张体积 */
function prepare(file, capW) {
	return new Promise(function (res, rej) {
		var u = URL.createObjectURL(file);
		loadImg(u).then(function (img) {
			var w = img.naturalWidth, h = img.naturalHeight;
			var r = w / h;
			var pano = r >= 1.7;
			/* 原图优先：普通照片（非全景）、JPG/PNG、且没超图床 9.6MB 上限时，
			   直接把原文件交给图床，不重画不重编码，分辨率和画质原样保留。
			   全景长条必须转成 2:1 才看得动，HEIC 有些浏览器认不了，这两类照旧走下面。 */
			if (!pano && /^image\/(jpeg|png)$/.test(file.type) && file.size <= 9.6 * 1024 * 1024) {
				URL.revokeObjectURL(u);
				res({ blob: file, w: w, h: h, pano: false, raw: true });
				return;
			}
			var cv = pano
				? ((r > 2.3) ? toEquirect(img, 0.55, capW) : toEquirectDirect(img, capW))
				: fitPhoto(img, 2048, capW);
			URL.revokeObjectURL(u);
			encodeUnder(cv, 9.6 * 1024 * 1024).then(function (b) {
				res({ blob: b, w: cv.width, h: cv.height, pano: pano });
			}).catch(rej);
		}).catch(function (e) { URL.revokeObjectURL(u); rej(e); });
	});
}

function uploadOne(item) {
	var fd = new FormData();
	/* 原图直传时可能是 PNG，扩展名跟着实际类型走，别一律按 .jpg 传 */
	var ext = item.blob.type === 'image/png' ? '.png' : '.jpg';
	fd.append('file', item.blob, 'pano-' + Date.now() + ext);
	fd.append('upload_preset', UPLOAD_PRESET);
	fd.append('folder', 'pano');
	return fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: fd })
		.then(function (r) { return r.json(); })
		.then(function (res) {
			if (!res.secure_url) throw new Error(res.error && res.error.message ? res.error.message : '上传失败');
			return res.secure_url;
		});
}

/* 一条帖子的正文：说明 + 每张图 + 每张图的 〔标签〕 说明 */
function buildBody(urls) {
	var cap = capText.value.trim();
	var lines = [];
	if (cap) { lines.push(cap); lines.push(''); }
	draft.forEach(function (d, i) {
		if (!urls[i]) return;
		lines.push('![全景](' + urls[i] + ')');
		var meta = '';
		if (d.tags.length) meta += '\u3014' + d.tags.join('|') + '\u3015';
		if (d.note) meta += (meta ? ' ' : '') + d.note;
		if (meta) lines.push(meta);
		lines.push('');
	});
	return lines.join('\n').trim();
}

pubGo.addEventListener('click', function () {
	if (!draft.length) return;
	if (CLOUD_NAME === 'CLOUD_NAME_PLACEHOLDER' || !CLOUD_NAME) {
		pubTip.className = 'tip';
		pubTip.textContent = '图床还没接上（缺 Cloudinary 的 cloud name），暂时发不了';
		return;
	}
	stashItem();
	pubGo.disabled = true;
	pubGo.textContent = '上传中…';
	progEl.classList.add('on');
	progBar.style.width = '4%';
	pubTip.className = 'tip';
	pubTip.textContent = '';

	var urls = [];
	var n = draft.length;
	var i = 0;

	var fail = function (err) {
		pubTip.className = 'tip';
		pubTip.textContent = errText(err && err.message);
		pubGo.disabled = false;
		pubGo.textContent = '发布';
		progEl.classList.remove('on');
	};

	var done = function () {
		pubTip.textContent = '图片传完了，正在写帖子…';
		progBar.style.width = '72%';
		var body = buildBody(urls);
		/* 签名用第一张图的地址，便于以后核对 */
		signOf(urls[0]).then(function (sig) {
			return fetch(API + '/comment', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					comment: body + '\n\n\u27E6' + sig + '\u27E7',
					nick: DEFAULT_NICK,
					mail: GUEST_MAIL,
					url: PAGE_PATH,
					path: PAGE_PATH,
					ua: navigator.userAgent
				})
			}).then(function (r) { return r.json(); });
		}).then(function (res) {
			if (!res || res.errno !== 0) throw new Error((res && res.errmsg) || '发布失败');
			progBar.style.width = '100%';
			pubTip.className = 'tip ok';
			pubTip.textContent = '发布成功，正在回到列表…';
			setTimeout(function () { location.reload(); }, 1200);
		}).catch(fail);
	};

	var next = function () {
		if (i >= n) { done(); return; }
		pubTip.textContent = '正在上传第 ' + (i + 1) + ' / ' + n + ' 张…';
		uploadOne(draft[i]).then(function (u) {
			urls.push(u);
			i++;
			progBar.style.width = Math.round(4 + 62 * i / n) + '%';
			next();
		}).catch(fail);
	};
	next();
});
