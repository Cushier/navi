<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>互助大厅 - 青年科技学习导航</title>
<link rel="icon" href="https://qnkjxx.oss-cn-hangzhou.aliyuncs.com/img/favicon.ico">
<link rel="apple-touch-icon" href="https://qnkjxx.oss-cn-hangzhou.aliyuncs.com/img/favicon.ico">
<link rel="preconnect" href="https://comment.qnkjxx.top" crossorigin="anonymous">
<link rel="dns-prefetch" href="//comment.qnkjxx.top">
<style>
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 26px 16px 70px;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
	color: #333;
	background-color: #f2f3f5;
	background-image: linear-gradient(rgba(0,0,0,.03) 1px, transparent 0), linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 0);
	background-size: 15px 15px;
	-webkit-text-size-adjust: 100%;
}
.wrap { max-width: 680px; margin: 0 auto; }
header { text-align: center; margin-bottom: 22px; }
header h1 { font-size: 26px; margin: 0 0 8px; color: #1b1b1b; letter-spacing: 1px; }
header p { font-size: 12.5px; color: #9aa0a6; margin: 0; line-height: 1.7; }
.card, .post {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 1px 4px rgba(0,0,0,.06);
	padding: 18px;
}
.card { margin-bottom: 26px; }
.card h2 { font-size: 15px; margin: 0 0 14px; color: #444; }
/* 发布区折叠：默认收起，点击展开 */
.pub-card { padding: 0; }
/* 提高优先级，避免手机端媒体查询里的 .card padding 覆盖（否则折叠条会被叠成两层内边距） */
.card.pub-card { padding: 0; }
.pub-toggle {
	display: flex;
	align-items: center;
	gap: 10px;
	width: 100%;
	box-sizing: border-box;
	padding: 16px 18px;
	background: none;
	border: 0;
	font-family: inherit;
	font-size: 15px;
	font-weight: 600;
	color: #1f2328;
	text-align: left;
	cursor: pointer;
}
.pub-toggle:focus { outline: none; }
.pub-toggle:focus-visible { outline: 2px solid #24b47e; outline-offset: 2px; border-radius: 12px; }
.pub-toggle-text { flex: 1; }
.pub-toggle-hint { font-size: 12px; font-weight: 400; color: #24b47e; }
.pub-chev { font-style: normal; font-size: 13px; line-height: 1; color: #9aa0a6; transition: transform .2s ease; }
.pub-toggle[aria-expanded="true"] .pub-chev { transform: rotate(180deg); }
.pub-body { padding: 0 18px 16px; }
.pub-body[hidden] { display: none; }
/* 发布按钮：内容宽度 + 居中，44px 高（移动端最小触控尺寸） */
.pub-body .btn {
	display: block;
	width: auto;
	min-width: 132px;
	min-height: 44px;
	margin: 8px auto 0;
	padding: 0 36px;
	font-size: 15px;
	line-height: 44px;
}
.pub-body .msg { text-align: center; }
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
.field label em { font-style: normal; color: #aaa; font-size: 12px; margin-left: 6px; }
.field label .req { color: #e05656; font-weight: 600; margin-right: 4px; }
input, textarea {
	width: 100%;
	border: 1px solid #e2e5ea;
	border-radius: 8px;
	padding: 10px 12px;
	font-size: 14px;
	font-family: inherit;
	outline: none;
	background: #fafbfc;
	transition: border-color .2s, background .2s;
}
input:focus, textarea:focus { border-color: #24b47e; background: #fff; }
.btn {
	display: inline-block;
	border: 0;
	border-radius: 8px;
	background: #24b47e;
	color: #fff;
	font-size: 14px;
	padding: 10px 28px;
	cursor: pointer;
	transition: background .2s;
	font-family: inherit;
}
.btn:hover { background: #1fa271; }
.btn:disabled { background: #c8cdd4; cursor: not-allowed; }
.msg { font-size: 13px; margin-top: 10px; min-height: 18px; line-height: 1.6; }
.msg.ok { color: #1fa271; }
.msg.err { color: #e05656; }
.msg:empty { display: none; }
.list-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
.list-title h2 { font-size: 15px; margin: 0; color: #444; }
.btn-refresh {
	background: transparent;
	color: #24b47e;
	border: 1px solid #24b47e;
	font-size: 13px;
	padding: 6px 14px;
	border-radius: 8px;
	cursor: pointer;
	font-family: inherit;
}
.post { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post-main { flex: 1 1 auto; min-width: 0; }
.post-side { flex: 0 0 auto; display: flex; align-items: center; }
.post.done { opacity: .72; }
.post .code {
	display: inline-block;
	max-width: 100%;
	box-sizing: border-box;
	font-size: 17px;
	font-weight: 600;
	letter-spacing: .5px;
	word-break: break-all;
	color: #2d3a44;
	background: #f4f7f9;
	border-radius: 8px;
	padding: 5px 10px;
	line-height: 1.5;
	margin-bottom: 8px;
}
.post .meta { display: flex; align-items: baseline; min-width: 0; font-size: 12px; color: #9aa0a6; }
.post .meta .nick { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post .meta .time { flex: 0 0 auto; white-space: nowrap; }
.post .desc-wrap { margin: 6px 0 8px; }
.post .desc { font-size: 13px; color: #666; margin: 0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.post .desc-wrap.more { cursor: pointer; }
.post .desc-more { color: #24b47e; font-size: 12px; }
.post .bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap; }
.post .bottom-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: nowrap; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.post .progress { flex: 0 0 auto; white-space: nowrap; font-size: 13px; color: #24b47e; }
.post .progress.full { color: #e05656; }
.post .btn-copy { flex: 0 0 auto; white-space: nowrap; padding: 8px 20px; font-size: 13px; }
.post .btn-copy.full { background: #c8cdd4; }
.post .replies { margin-top: 10px; border-top: 1px dashed #ececec; padding-top: 8px; }
.post .reply { font-size: 12px; color: #9aa0a6; padding: 2px 0; word-break: break-all; }
.empty { text-align: center; color: #aaa; font-size: 13px; padding: 36px 0; }
.list-title h2 .avail-count { font-size: 12px; color: #24b47e; font-weight: 400; margin-left: 8px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
.toolbar .search {
	flex: 1 1 200px;
	min-width: 150px;
	box-sizing: border-box;
	padding: 8px 12px;
	font-size: 13px;
	font-family: inherit;
	border: 1px solid #e4e7ed;
	border-radius: 10px;
	outline: none;
	background: #fff;
	color: #333;
}
.toolbar .search:focus { border-color: #24b47e; }
.toolbar .tabs { display: flex; gap: 4px; padding: 3px; background: #f2f4f7; border-radius: 10px; }
.toolbar .tab {
	border: 0;
	background: transparent;
	color: #666;
	font-size: 12px;
	font-family: inherit;
	padding: 6px 10px;
	border-radius: 8px;
	cursor: pointer;
}
.toolbar .tab.active { background: #fff; color: #24b47e; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.more-wrap { text-align: center; margin: 14px 0 6px; }
.btn-more {
	border: 1px solid #e4e7ed;
	background: #fff;
	color: #24b47e;
	font-size: 13px;
	font-family: inherit;
	padding: 9px 18px;
	border-radius: 10px;
	cursor: pointer;
	width: 100%;
	max-width: 320px;
}
.btn-more:disabled { color: #aaa; cursor: default; }
.more-info { font-size: 12px; color: #aaa; margin-top: 8px; }
.group-title { font-size: 13px; color: #9aa0a6; margin: 22px 0 10px; padding-left: 4px; }
.empty-avail {
	text-align: center;
	color: #aaa;
	font-size: 13px;
	padding: 30px 0;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 1px 4px rgba(0,0,0,.06);
	margin-bottom: 12px;
}
.foot { text-align: center; font-size: 12px; color: #b5b9bf; margin-top: 28px; line-height: 1.7; }
@media screen and (max-width: 520px) {
	header h1 { font-size: 22px; }
	.card { padding: 16px 14px 18px; }
	.card.pub-card { padding: 0; }
	.post { gap: 8px; padding: 16px 14px; }
	.post .code { font-size: 16px; }
	.post .bottom-left { gap: 6px; }
	.post .btn-copy { padding: 8px 16px; }
	.btn { padding: 10px 22px; }
	.pub-toggle { padding: 16px 14px; }
	.pub-body { padding: 0 14px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
	<header>
		<h1>互助大厅</h1>
		<p>友善互助 · 点复制即自动记录一次使用<br>发布内容公开可见，违规刷帖将被拉黑</p>
	</header>

	<div class="card pub-card">
		<button class="pub-toggle" id="pubToggle" type="button" aria-expanded="false" aria-controls="pubBody">
			<span class="pub-toggle-text">发布我的互助</span>
			<span class="pub-toggle-hint" id="pubToggleHint">点击展开</span>
			<i class="pub-chev" aria-hidden="true">▾</i>
		</button>
		<div class="pub-body" id="pubBody" hidden>
			<div class="field">
				<label><span class="req">*</span>互助码 / 内容<em>粘贴你的互助码或要分享的内容</em></label>
				<input id="code" maxlength="200" placeholder="例如：88888888" autocomplete="off">
			</div>
			<div class="field">
				<label><span class="req">*</span>需要人数<em>几个人能成团，如 3</em></label>
				<input id="need" type="number" min="1" max="20" value="1">
			</div>
			<div class="field">
				<label>说明<em>选填，如有效期、备注</em></label>
				<input id="desc" maxlength="60" placeholder="例如：今晚 24 点前有效" autocomplete="off">
			</div>
			<div class="field">
				<label>昵称<em>选填，不填显示"匿名访客"</em></label>
				<input id="nick" maxlength="20" placeholder="例如：小明" autocomplete="off">
			</div>
			<button class="btn" id="publish" type="button">发布</button>
			<div class="msg" id="pubMsg"></div>
		</div>
	</div>

	<div class="list-title">
		<h2>互助列表<span class="avail-count" id="avail">可用 0 个</span></h2>
		<button class="btn-refresh" id="refresh" type="button">刷新</button>
	</div>
	<div class="toolbar">
		<input class="search" id="search" type="search" placeholder="搜索码 / 说明 / 昵称" autocomplete="off">
		<div class="tabs" id="tabs">
			<button class="tab active" data-filter="all" type="button">全部</button>
			<button class="tab" data-filter="avail" type="button">可用</button>
			<button class="tab" data-filter="done" type="button">已完成</button>
		</div>
	</div>
	<div id="list"><div class="empty">加载中…</div></div>
	<div class="more-wrap" id="more" style="display:none">
		<button class="btn-more" id="loadMore" type="button">加载更多</button>
		<div class="more-info" id="moreInfo"></div>
	</div>
</div>
<script>
(function () {
	'use strict';

	var API = 'https://comment.qnkjxx.top/api';
	var PAGE_PATH = '/huzhu/';
	var ARTICLE_PREFIX = '/huzhu/c/';
	var REFRESH_SECONDS = 15;
	var DAILY_LIMIT = 7;
	var DEFAULT_NICK = '匿名访客';
	var PAGE_SIZE = 30;
	var COUNT_BATCH = 50;
	var loadedPages = 1;
	var totalCount = 0;

	var listEl = document.getElementById('list');
	var pubMsg = document.getElementById('pubMsg');
	var publishBtn = document.getElementById('publish');
	var refreshBtn = document.getElementById('refresh');

	var refreshLeft = REFRESH_SECONDS;
	var refreshTimer = null;
	var lastSig = '';
	var busy = false;
	var allItems = [];
	var currentFilter = 'all';
	var keyword = '';
	var moreEl = document.getElementById('more');
	var loadMoreBtn = document.getElementById('loadMore');

	/* ---------- 工具函数 ---------- */
	function plainText(html) {
		return String(html == null ? '' : html)
			.replace(/<br\s*\/?>/gi, '\n')
			.replace(/<\/p>/gi, '\n')
			.replace(/<[^>]*>/g, '')
			.replace(/&nbsp;/gi, ' ')
			.replace(/&amp;/gi, '&')
			.replace(/&lt;/gi, '<')
			.replace(/&gt;/gi, '>')
			.replace(/&quot;/gi, '"')
			.replace(/&#39;/g, "'");
	}

	function parsePost(c) {
		var text = plainText(c.comment);
		var code = '';
		var desc = '';
		var need = 1;
		text.split('\n').forEach(function (raw) {
			var line = raw.trim();
			if (!line) return;
			var m;
			m = line.match(/^码[：:]\s*([\s\S]*)$/);
			if (m) { code += (code ? '\n' : '') + m[1]; return; }
			m = line.match(/^说明[：:]\s*([\s\S]*)$/);
			if (m) { desc += (desc ? '\n' : '') + m[1]; return; }
			m = line.match(/^人数[：:]\s*(\d+)/);
			if (m) {
				need = parseInt(m[1], 10) || 1;
				if (need < 1) need = 1;
				if (need > 50) need = 50;
				return;
			}
			if (!code) code = line;
		});
		if (!code) code = text.trim();
		return { code: code.trim(), desc: desc.trim(), need: need };
	}

	function fmtTime(ts) {
		var d = new Date(Number(ts) || 0);
		if (!d.getTime()) return '';
		function p(n) { return n < 10 ? '0' + n : '' + n; }
		return (d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
	}

	function getSavedNick() {
		try { return localStorage.getItem('huzhu_nick') || ''; } catch (e) { return ''; }
	}
	function saveNick(n) {
		try { localStorage.setItem('huzhu_nick', n); } catch (e) {}
	}
	function clearNick() {
		try { localStorage.removeItem('huzhu_nick'); } catch (e) {}
	}

	// 匿名访客用随机占位邮箱（Waline 服务端要求 mail 字段）
	function guestMail() {
		return 'huzhu-' + String(Math.random()).slice(2, 10) + '@qnkjxx.top';
	}

	// 互助码 -> 计数键（djb2 哈希，保证计数路径只含字母数字，避免特殊字符）
	function codeKey(code) {
		var h = 5381;
		for (var i = 0; i < code.length; i++) {
			h = ((h << 5) + h + code.charCodeAt(i)) >>> 0;
		}
		return h.toString(36);
	}

	// 本地已领取记录（浏览器本地防重复领取）
	function usedMap() {
		try { return JSON.parse(localStorage.getItem('huzhu_used') || '{}'); } catch (e) { return {}; }
	}
	function markUsed(key) {
		try {
			var m = usedMap();
			m[key] = Date.now();
			Object.keys(m).forEach(function (k) {
				if (Date.now() - m[k] > 86400000 * 30) delete m[k];
			});
			localStorage.setItem('huzhu_used', JSON.stringify(m));
		} catch (e) {}
	}
	function isUsed(key) {
		return !!usedMap()[key];
	}

	function todayKey() {
		var d = new Date();
		return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
	}
	function todayCount() {
		try {
			var obj = JSON.parse(localStorage.getItem('huzhu_daily') || '{}');
			return (obj[todayKey()] || []).length;
		} catch (e) { return 0; }
	}
	function addTodayCount() {
		try {
			var obj = JSON.parse(localStorage.getItem('huzhu_daily') || '{}');
			var k = todayKey();
			if (!obj[k]) obj[k] = [];
			obj[k].push(Date.now());
			Object.keys(obj).forEach(function (key) {
				if (key !== k && Array.isArray(obj[key]) && obj[key].length && Date.now() - new Date(key).getTime() > 86400000 * 3) {
					delete obj[key];
				}
			});
			localStorage.setItem('huzhu_daily', JSON.stringify(obj));
		} catch (e) {}
	}

	var msgTimer = null;
	function showMsg(text, isErr) {
		pubMsg.textContent = text;
		pubMsg.className = 'msg ' + (isErr ? 'err' : 'ok');
		if (msgTimer) clearTimeout(msgTimer);
		msgTimer = setTimeout(function () { pubMsg.textContent = ''; }, 8000);
	}

	/* ---------- 接口 ---------- */
	/* 拉取第 1..pages 页，返回 { posts, total }（total 为服务端总条数） */
	function fetchList(pages) {
		pages = Math.max(1, Math.floor(pages || 1));
		var jobs = [];
		var total = 0;
		for (var i = 1; i <= pages; i++) {
			(function (pageNo) {
				jobs.push(fetch(API + '/comment?path=' + PAGE_PATH + '&page=' + pageNo + '&pageSize=' + PAGE_SIZE)
					.then(function (r) {
						if (r.status !== 200) throw new Error('HTTP ' + r.status);
						return r.json();
					})
					.then(function (res) {
						if (res.errno !== 0) throw new Error(res.errmsg || '接口错误');
						if (res.data && typeof res.data.count === 'number') total = res.data.count;
						return (res.data && res.data.data) || [];
					}));
			})(i);
		}
		return Promise.all(jobs).then(function (lists) {
			var out = [];
			lists.forEach(function (l) { out = out.concat(l); });
			return { posts: out, total: total };
		});
	}

	function sendComment(payload) {
		payload.mail = payload.mail || guestMail();
		if (payload.link == null) payload.link = '';
		return fetch(API + '/comment', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(payload)
		}).then(function (r) { return r.json(); });
	}

	// 批量读取计数：/article?path=p1,p2,... 返回与 path 顺序对应的 [{time:n}]（按 50 条分批，避免 URL 过长）
	function fetchCounts(paths) {
		if (!paths.length) return Promise.resolve([]);
		var batches = [];
		for (var i = 0; i < paths.length; i += COUNT_BATCH) {
			batches.push(paths.slice(i, i + COUNT_BATCH));
		}
		return Promise.all(batches.map(function (batch) {
			return fetch(API + '/article?path=' + batch.join(','))
				.then(function (r) { return r.json(); })
				.then(function (res) {
					if (res.errno !== 0) throw new Error(res.errmsg || '计数接口错误');
					return (res.data || []).map(function (it) { return Number(it && it.time) || 0; });
				});
		})).then(function (lists) {
			var out = [];
			lists.forEach(function (l) { out = out.concat(l); });
			return out;
		});
	}

	// 计数 +1：不产生评论，不发邮件，也不触发评论发布限速
	function incrCount(path) {
		return fetch(API + '/article', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ path: path })
		}).then(function (r) { return r.json(); });
	}

	/* ---------- 渲染 ---------- */
	function clearList() {
		while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
	}
	function showEmpty(text) {
		clearList();
		var d = document.createElement('div');
		d.className = 'empty';
		d.textContent = text;
		listEl.appendChild(d);
	}

	// 说明默认 2 行，超出部分改为"…展开"接在文字末尾，不额外占行、不遮挡文字
	function clampDesc(wrap, el, text) {
		el.textContent = text;
		wrap.classList.remove('more');
		var lh = parseFloat(getComputedStyle(el).lineHeight) || 20.8;
		var maxH = lh * 2 + 1;
		if (el.scrollHeight <= maxH) return;
		var tail = '…展开';
		var lo = 0, hi = text.length;
		while (lo < hi) {
			var mid = Math.ceil((lo + hi) / 2);
			el.textContent = text.slice(0, mid) + tail;
			if (el.scrollHeight > maxH) { hi = mid - 1; } else { lo = mid; }
		}
		el.textContent = text.slice(0, lo);
		var sp = document.createElement('span');
		sp.className = 'desc-more';
		sp.textContent = tail;
		el.appendChild(sp);
		wrap.classList.add('more');
		wrap.title = '点击展开完整说明';
	}
	var rzTimer;
	window.addEventListener('resize', function () {
		clearTimeout(rzTimer);
		rzTimer = setTimeout(function () {
			var list = document.querySelectorAll('.desc-wrap[data-full]');
			for (var i = 0; i < list.length; i++) {
				var w = list[i], el = w.querySelector('.desc');
				if (!el) continue;
				if (w.classList.contains('open')) { el.textContent = w.dataset.full; continue; }
				clampDesc(w, el, w.dataset.full);
			}
		}, 200);
	});

	function renderPost(c, p, used) {
		var full = used >= p.need;
		var mine = isUsed(p.key);
		var replies = (c.children || []).filter(function (r) {
			return plainText(r.comment).indexOf('已使用') < 0;
		});

		var post = document.createElement('div');
		post.className = 'post' + (full ? ' done' : '');
		var main = document.createElement('div');
		main.className = 'post-main';

		var codeEl = document.createElement('div');
		codeEl.className = 'code';
		codeEl.textContent = p.code || '(无内容)';
		main.appendChild(codeEl);

		if (p.desc) {
			var descWrap = document.createElement('div');
			descWrap.className = 'desc-wrap';
			var descEl = document.createElement('div');
			descEl.className = 'desc';
			descWrap.appendChild(descEl);
			main.appendChild(descWrap);
			descWrap.dataset.full = p.desc;
			// 默认只显示 2 行，超出时末尾接"…展开"，点整块展开/收起
			setTimeout(function () { clampDesc(descWrap, descEl, p.desc); }, 0);
			descWrap.addEventListener('click', function () {
				if (!descWrap.classList.contains('more')) return;
				if (descWrap.classList.contains('open')) {
					descWrap.classList.remove('open');
					clampDesc(descWrap, descEl, p.desc);
				} else {
					descWrap.classList.add('open');
					descEl.textContent = p.desc;
					descWrap.title = '点击收起说明';
				}
			});
		}

		var bottom = document.createElement('div');
		bottom.className = 'bottom';

		var left = document.createElement('div');
		left.className = 'bottom-left';

		var prog = document.createElement('div');
		prog.className = 'progress' + (full ? ' full' : '');
		prog.textContent = '进度 ' + used + '/' + p.need + (full ? '（已满）' : '');
		left.appendChild(prog);

		var nickName = c.nick || DEFAULT_NICK;
		var meta = document.createElement('span');
		meta.className = 'meta';
		meta.title = nickName + ' · ' + fmtTime(c.time);
		var nickEl = document.createElement('span');
		nickEl.className = 'nick';
		nickEl.textContent = nickName;
		var timeEl = document.createElement('span');
		timeEl.className = 'time';
		timeEl.textContent = ' · ' + fmtTime(c.time);
		meta.appendChild(nickEl);
		meta.appendChild(timeEl);
		left.appendChild(meta);

		bottom.appendChild(left);
		main.appendChild(bottom);

		var side = document.createElement('div');
		side.className = 'post-side';

		var copyBtn = document.createElement('button');
		copyBtn.className = 'btn btn-copy' + (full ? ' full' : '');
		copyBtn.type = 'button';
		copyBtn.textContent = full ? '已满' : (mine ? '已领取' : '复制');
		if (full || mine) {
			copyBtn.disabled = true;
		} else {
			copyBtn.addEventListener('click', function () { handleCopy(p, copyBtn); });
		}
		side.appendChild(copyBtn);
		post.appendChild(main);
		post.appendChild(side);

		if (replies.length) {
			var wrap = document.createElement('div');
			wrap.className = 'replies';
			replies.forEach(function (r) {
				var line = document.createElement('div');
				line.className = 'reply';
				line.textContent = (r.nick || DEFAULT_NICK) + '：' + plainText(r.comment).replace(/\s*\n\s*/g, ' ');
				wrap.appendChild(line);
			});
			main.appendChild(wrap);
		}
		return post;
	}

	function updateAvail(n) {
		var el = document.getElementById('avail');
		if (el) el.textContent = '可用 ' + n + ' 个';
	}

	/* 底部"加载更多 / 已显示全部"状态 */
	function updateMore() {
		if (!moreEl || !loadMoreBtn) return;
		var info = document.getElementById('moreInfo');
		if (!totalCount || !allItems.length) {
			moreEl.style.display = 'none';
			if (info) info.textContent = '';
			return;
		}
		moreEl.style.display = 'block';
		if (allItems.length >= totalCount) {
			loadMoreBtn.style.display = 'none';
			loadMoreBtn.disabled = false;
			if (info) info.textContent = '已显示全部 ' + totalCount + ' 条';
		} else {
			loadMoreBtn.style.display = '';
			loadMoreBtn.disabled = false;
			loadMoreBtn.textContent = '加载更多（已显示 ' + allItems.length + ' / 共 ' + totalCount + ' 条）';
			if (info) info.textContent = '';
		}
	}

	function render(items, filter, isEmptyAll) {
		clearList();
		if (!items || !items.length) {
			showEmpty(isEmptyAll ? '还没有互助帖，来发第一条吧' : '没有匹配的互助帖');
			if (isEmptyAll) updateAvail(0);
			return;
		}

		var avail = [];
		var done = [];
		items.forEach(function (it) {
			if (it.used >= it.p.need) done.push(it);
			else avail.push(it);
		});

		if (filter !== 'done' && !avail.length) {
			var tip = document.createElement('div');
			tip.className = 'empty-avail';
			tip.textContent = '暂无可用互助';
			listEl.appendChild(tip);
		} else {
			avail.forEach(function (it) { listEl.appendChild(renderPost(it.c, it.p, it.used)); });
		}

		if (done.length) {
			var divider = document.createElement('div');
			divider.className = 'group-title';
			divider.textContent = '已完成 · ' + done.length + ' 条';
			listEl.appendChild(divider);
			done.forEach(function (it) { listEl.appendChild(renderPost(it.c, it.p, it.used)); });
		}
	}

	/* 按"状态 tab + 搜索词"过滤后重绘 */
	function applyFilter() {
		var items = allItems;
		if (currentFilter === 'avail') {
			items = items.filter(function (it) { return it.used < it.p.need; });
		} else if (currentFilter === 'done') {
			items = items.filter(function (it) { return it.used >= it.p.need; });
		}
		var kw = keyword.trim().toLowerCase();
		if (kw) {
			items = items.filter(function (it) {
				return ((it.p.code || '') + ' ' + (it.p.desc || '') + ' ' + (it.c.nick || '')).toLowerCase().indexOf(kw) >= 0;
			});
		}
		render(items, currentFilter, allItems.length === 0 && kw === '');
	}

	function loadList(silent) {
		if (silent && busy) return Promise.resolve();
		return fetchList(loadedPages).then(function (result) {
			var posts = result.posts;
			totalCount = result.total;
			var items = posts.map(function (c) {
				var p = parsePost(c);
				p.key = codeKey(p.code);
				p.path = ARTICLE_PREFIX + p.key + '/';
				return { c: c, p: p, used: 0 };
			});
			if (!items.length) {
				allItems = [];
				updateAvail(0);
				updateMore();
				if (silent && lastSig === '') return;
				lastSig = '';
				applyFilter();
				return;
			}
			var paths = items.map(function (it) { return it.p.path; });
			return fetchCounts(paths).then(function (counts) {
				items.forEach(function (it, i) { it.used = counts[i] || 0; });
				// 排序：未满（可用）在前，已满（已完成）在后；同组内按发布时间倒序
				items.sort(function (a, b) {
					var fa = a.used >= a.p.need ? 1 : 0;
					var fb = b.used >= b.p.need ? 1 : 0;
					if (fa !== fb) return fa - fb;
					return (Number(b.c.time) || 0) - (Number(a.c.time) || 0);
				});
				allItems = items;
				updateAvail(items.filter(function (it) { return it.used < it.p.need; }).length);
				updateMore();
				// 静默刷新时数据没变化就不重绘，避免列表闪动
				var sig = items.map(function (it) {
					return it.c.objectId + ':' + it.used + ':' + it.p.need + ':' + it.c.time + ':' + it.c.nick;
				}).join('|');
				if (silent && sig === lastSig) return;
				lastSig = sig;
				applyFilter();
			});
		}).catch(function (err) {
			if (silent) return;
			showEmpty('列表加载失败：' + err.message + '（本地预览会被安全域名拦截，请在线上站点使用）');
		});
	}

	/* ---------- 自动刷新（参考站每 9 秒，这里 15 秒） ---------- */
	function updateRefreshBtn() {
		if (refreshBtn) refreshBtn.textContent = '刷新 · ' + refreshLeft + 's';
	}
	function startAutoRefresh() {
		refreshLeft = REFRESH_SECONDS;
		updateRefreshBtn();
		if (refreshTimer) clearInterval(refreshTimer);
		refreshTimer = setInterval(function () {
			if (document.hidden) return;
			refreshLeft--;
			if (refreshLeft < 0) refreshLeft = 0;
			updateRefreshBtn();
			if (refreshLeft <= 0) {
				refreshLeft = REFRESH_SECONDS;
				updateRefreshBtn();
				loadList(true);
			}
		}, 1000);
	}

	/* ---------- 复制 + 使用计数 ---------- */
	function copyText(text) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			return navigator.clipboard.writeText(text);
		}
		return new Promise(function (resolve, reject) {
			var ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.top = '-999px';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			try {
				var ok = document.execCommand('copy');
				document.body.removeChild(ta);
				if (ok) resolve();
				else reject(new Error('复制失败'));
			} catch (e) {
				document.body.removeChild(ta);
				reject(e);
			}
		});
	}

	function handleCopy(p, btn) {
		if (btn.disabled || busy) return;
		busy = true;
		btn.disabled = true;
		btn.textContent = '复制中…';
		copyText(p.code).then(function () {
			btn.textContent = '已复制';
			return incrCount(p.path);
		}).then(function (res) {
			if (!res || res.errno !== 0) throw new Error((res && res.errmsg) || '计数失败');
			markUsed(p.key);
			busy = false;
			refreshLeft = REFRESH_SECONDS;
			updateRefreshBtn();
			loadList(false);
		}).catch(function (err) {
			busy = false;
			btn.disabled = false;
			btn.textContent = '复制';
			showMsg('复制或计数失败：' + err.message, true);
		});
	}

	/* ---------- 发布 ---------- */
	function handlePublish() {
		var code = (document.getElementById('code').value || '').trim();
		var need = parseInt(document.getElementById('need').value, 10);
		var desc = (document.getElementById('desc').value || '').trim();
		var nick = (document.getElementById('nick').value || '').trim();

		if (!code) { showMsg('请先填写互助码 / 内容', true); return; }
		if (!need || need < 1) { showMsg('需要人数请填 1~20 之间的数字', true); return; }
		if (need > 20) need = 20;

		if (todayCount() >= DAILY_LIMIT) {
			showMsg('今天的发布额度（' + DAILY_LIMIT + ' 条）已用完，明天再来', true);
			return;
		}

		var body = '码：' + code + '\n说明：' + desc + '\n人数：' + need;

		publishBtn.disabled = true;
		publishBtn.textContent = '发布中…';
		sendComment({
			comment: body,
			nick: nick || DEFAULT_NICK,
			url: PAGE_PATH,
			ua: navigator.userAgent
		}).then(function (res) {
			if (res && res.errno === 0) {
				if (nick) { saveNick(nick); } else { clearNick(); }
				addTodayCount();
				document.getElementById('code').value = '';
				document.getElementById('desc').value = '';
				document.getElementById('need').value = '1';
				showMsg('发布成功，已显示在下方列表', false);
				refreshLeft = REFRESH_SECONDS;
				updateRefreshBtn();
				loadList(false);
			} else {
				throw new Error((res && res.errmsg) || '发布失败');
			}
		}).catch(function (err) {
			showMsg('发布失败：' + err.message + '（本地预览会被安全域名拦截，请在线上站点使用）', true);
		}).finally(function () {
			publishBtn.disabled = false;
			publishBtn.textContent = '发布';
		});
	}

	/* ---------- 初始化 ---------- */
	var pubToggle = document.getElementById('pubToggle');
	var pubBody = document.getElementById('pubBody');
	var pubToggleHint = document.getElementById('pubToggleHint');

	/* 展开/收起发布区：展开后自动跳到"互助码"输入框，收起时输入内容保留 */
	function setPubOpen(open) {
		if (!pubBody) return;
		pubBody.hidden = !open;
		if (pubToggle) pubToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
		if (pubToggleHint) pubToggleHint.textContent = open ? '点击收起' : '点击展开';
		if (open) {
			var codeEl = document.getElementById('code');
			if (codeEl) codeEl.focus();
		}
	}

	if (pubToggle) {
		pubToggle.addEventListener('click', function () {
			setPubOpen(!!pubBody && pubBody.hidden);
		});
	}

	var nickInput = document.getElementById('nick');
	if (nickInput) {
		nickInput.value = getSavedNick();
		// 输入完（离开输入框）就记住昵称，不必等到发布成功
		nickInput.addEventListener('change', function () {
			var v = (nickInput.value || '').trim();
			if (v) saveNick(v);
		});
	}
	publishBtn.addEventListener('click', handlePublish);
	refreshBtn.addEventListener('click', function () {
		refreshLeft = REFRESH_SECONDS;
		updateRefreshBtn();
		loadList(false);
	});

	var searchInput = document.getElementById('search');
	if (searchInput) {
		searchInput.addEventListener('input', function () {
			keyword = searchInput.value || '';
			applyFilter();
		});
	}
	var tabsEl = document.getElementById('tabs');
	if (tabsEl) {
		tabsEl.addEventListener('click', function (e) {
			var t = e.target;
			var f = t && t.getAttribute ? t.getAttribute('data-filter') : '';
			if (!f) return;
			currentFilter = f;
			Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (b) {
				b.classList.toggle('active', b === t);
			});
			applyFilter();
		});
	}

	if (loadMoreBtn) {
		loadMoreBtn.addEventListener('click', function () {
			if (loadMoreBtn.disabled) return;
			loadMoreBtn.disabled = true;
			loadMoreBtn.textContent = '加载中…';
			loadedPages++;
			loadList(false).then(function () {
				loadMoreBtn.disabled = false;
				updateMore();
			});
		});
	}

	loadList(false);
	startAutoRefresh();
})();
</script>
</body>
