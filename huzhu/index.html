<script>
/* 夜间模式：跟随主站设置（同域 cookie night=1），未设置时按主站同样规则按时间自动判断（18:00-06:00） */
(function () {
	try {
		var m = document.cookie.match(/(?:^|;)\s*night=([^;]*)/);
		var v = m ? m[1] : '';
		var h = new Date().getHours();
		if (v === '1' || (v === '' && (h > 17 || h < 6))) {
			document.documentElement.className = 'night io-black-mode';
		}
	} catch (e) {}
})();
</script>
<style>
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 26px 16px 70px;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
	color: #333;
	background-color: #f2f3f5;
	background-image: linear-gradient(rgba(0,0,0,.03) 1px, transparent 0), linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 0);
	background-size: 15px 15px;
	-webkit-text-size-adjust: 100%;
}
.wrap { max-width: 680px; margin: 0 auto; }
header { text-align: center; margin-bottom: 22px; }
header h1 { font-size: 26px; margin: 0 0 8px; color: #1b1b1b; letter-spacing: 1px; }
header p { font-size: 12.5px; color: #767c82; margin: 0; line-height: 1.7; }
.card, .post {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 1px 4px rgba(0,0,0,.06);
	padding: 18px;
}
.card { margin-bottom: 26px; }
.card h2 { font-size: 15px; margin: 0 0 14px; color: #444; }
/* 发布区折叠：默认收起，点击展开 */
.pub-card { padding: 0; }
/* 提高优先级，避免手机端媒体查询里的 .card padding 覆盖（否则折叠条会被叠成两层内边距） */
.card.pub-card { padding: 0; }
.pub-toggle {
	display: flex;
	align-items: center;
	gap: 10px;
	width: 100%;
	box-sizing: border-box;
	padding: 12px 18px;
	background: none;
	border: 0;
	font-family: inherit;
	font-size: 16px;
	font-weight: 600;
	color: #1f2328;
	text-align: left;
	cursor: pointer;
}
.pub-toggle:focus { outline: none; }
.pub-toggle:focus-visible { outline: 2px solid #24b47e; outline-offset: 2px; border-radius: 12px; }
.pub-toggle-text { flex: 1; }
.pub-toggle-hint { font-size: 12px; font-weight: 400; color: #24b47e; }
.pub-chev { font-style: normal; font-size: 13px; line-height: 1; color: #767c82; transition: transform .2s ease; }
.pub-toggle[aria-expanded="true"] .pub-chev { transform: rotate(180deg); }
.pub-body { padding: 0 18px 16px; }
.pub-body[hidden] { display: none; }
/* 发布按钮：内容宽度 + 居中，44px 高（移动端最小触控尺寸） */
.pub-body .btn {
	display: block;
	width: auto;
	min-width: 132px;
	min-height: 44px;
	margin: 8px auto 0;
	padding: 0 36px;
	font-size: 15px;
	line-height: 44px;
}
.pub-body .msg { text-align: center; }
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
.field label em { font-style: normal; color: #8a9099; font-size: 12px; margin-left: 6px; }
.field label .req { color: #e05656; font-weight: 600; margin-right: 4px; }
input, textarea, select {
	width: 100%;
	border: 1px solid #e2e5ea;
	border-radius: 8px;
	padding: 9px 12px;
	font-size: 14px;
	font-family: inherit;
	outline: none;
	background: #fafbfc;
	transition: border-color .2s, background .2s;
}
input:focus, textarea:focus, select:focus { border-color: #24b47e; background: #fff; }
/* 人数 + 有效期并排，省一行高度；太窄时自动落成一列 */
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 13px; }
.field-pair .field { margin-bottom: 0; }
/* 到期时间：底层只显示文字，真控件透明盖在上面——点哪儿都直接弹选择器，不用在框里打字 */
.at-wrap { position: relative; }
.at-display {
	height: 39px;
	display: flex;
	align-items: center;
	padding: 0 12px;
	border: 1px solid #e2e5ea;
	border-radius: 8px;
	background: #fafbfc;
	color: #9aa0a6;
	font-size: 14px;
	cursor: pointer;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	transition: border-color .2s, background .2s;
}
.at-wrap.has-value .at-display { color: #333; }
.at-wrap input {
	position: absolute;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 100%;
	padding: 0;
	border: 0;
	opacity: 0;
	cursor: pointer;
}
.btn {
	display: inline-block;
	border: 0;
	border-radius: 8px;
	background: #24b47e;
	color: #fff;
	font-size: 14px;
	padding: 10px 28px;
	cursor: pointer;
	transition: background .2s;
	font-family: inherit;
}
.btn:hover { background: #1fa271; }
.btn:disabled { background: #c8cdd4; cursor: not-allowed; }
.msg { font-size: 13px; margin-top: 10px; min-height: 18px; line-height: 1.6; }
.msg.ok { color: #1fa271; }
.msg.err { color: #e05656; }
.msg:empty { display: none; }
.list-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
.list-title h2 { font-size: 16px; font-weight: 600; margin: 0; color: #3c4043; }
.btn-refresh {
	background: transparent;
	color: #24b47e;
	border: 1px solid #24b47e;
	font-size: 13px;
	line-height: 1.4;
	padding: 5px 12px;
	border-radius: 8px;
	cursor: pointer;
	font-family: inherit;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 5px;
	/* 倒计时从 9 掉到 8、或改成两位数时，按钮不能跟着抽动：数字等宽 + 预留两位宽度 */
	font-variant-numeric: tabular-nums;
	min-width: 70px;
	text-align: center;
}
/* 刷新进行中：转圈图标 + 「刷新中」，这期间按钮不再接受点击 */
.btn-refresh.is-refreshing { pointer-events: none; min-width: 0; }
.rf-spin {
	display: inline-block;
	width: 11px;
	height: 11px;
	margin-right: 0;
	border: 2px solid rgba(36,180,126,.28);
	border-top-color: #24b47e;
	border-radius: 50%;
	vertical-align: -1px;
	animation: rf-spin .7s linear infinite;
}
@keyframes rf-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rf-spin { animation-duration: 2.4s; } }
.post { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.post-main { flex: 1 1 auto; min-width: 0; }
.post-side { flex: 0 0 auto; display: flex; align-items: center; }
.post.done { opacity: .88; }
.post .code {
	display: inline-block;
	max-width: 100%;
	box-sizing: border-box;
	font-size: 17px;
	font-weight: 600;
	letter-spacing: .5px;
	word-break: break-all;
	color: #0e6b4a;
	background: #e8f8f1;
	border: 1px solid #cbeedd;
	border-radius: 8px;
	padding: 4px 9px;
	line-height: 1.5;
	margin-bottom: 8px;
	font-feature-settings: "tnum";
}

/* 已满：码降为中性灰，和「可复制」的绿色状态一眼分开 */
.post.done .code { color: #7d858c; background: #f3f4f5; border-color: #e6e8ea; }
.post .meta { display: flex; align-items: baseline; min-width: 0; font-size: 12px; color: #767c82; }
.post .meta .nick { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post .meta .time { flex: 0 0 auto; white-space: nowrap; }
.post .desc-wrap { margin: 6px 0 8px; }
.post .desc { font-size: 13px; color: #666; margin: 0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.post .desc-wrap.more { cursor: pointer; }
.post .desc-more { color: #24b47e; font-size: 12px; }
.post .bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap; }
.post .bottom-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: nowrap; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.post .progress { flex: 0 0 auto; white-space: nowrap; font-size: 13px; color: #24b47e; }
.post .progress.full { color: #e05656; }
/* 过期但没满：红色代表"名额没了"，这里不该红，用中性灰 */
.post .progress.muted { color: #767c82; }
/* 只给有期限的帖子挂这个标签：长期有效是默认状态，每条都写一遍"长期"只会白占地方 */
.post .expire { flex: 0 0 auto; white-space: nowrap; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: #eef1f4; color: #6b7280; }
.post .expire.warn { background: #fdf1e0; color: #a3670f; }
.post .expire.over { background: #fdeaea; color: #bf3f3f; }
.post .btn-copy { flex: 0 0 auto; white-space: nowrap; padding: 10px 20px; font-size: 13px; }
/* 已满 / 本机已领取：码仍然给用户，只是变成浅底描边的次要按钮，一眼不是"点不得"的样子 */
.post .btn-copy.full {
	background: #f6f7f8;
	color: #6b7280;
	box-shadow: inset 0 0 0 1px #dfe3e8;
}
.post .btn-copy.full:hover { background: #eceff2; box-shadow: inset 0 0 0 1px #cfd6dd; }
.post .replies { margin-top: 10px; border-top: 1px dashed #ececec; padding-top: 8px; }
.post .post-link {
	display: inline-flex;
	align-items: center;
	gap: 5px;
	max-width: 100%;
	margin: 0 0 8px;
	font-size: 12.5px;
	line-height: 1.5;
	color: #4a5866;
	text-decoration: none;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	transition: color .15s;
}
.post .post-link:hover { color: #24b47e; }
.post .post-link .lk-ico { flex: 0 0 auto; font-size: 12px; opacity: .85; }
.post .post-link .lk-host {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	text-decoration: underline;
	text-decoration-color: #cbd3da;
	text-decoration-thickness: 1px;
	text-underline-offset: 2px;
}
.post .post-link:hover .lk-host { text-decoration-color: #24b47e; }
/* 链接行右侧的显式「打开」：这一行本来就能点，标出来才有人点 */
.post .post-link .lk-go {
	flex: 0 0 auto;
	margin-left: 2px;
	white-space: nowrap;
	font-size: 12px;
	color: #24b47e;
	font-weight: 500;
}
.post .post-link.can-go { cursor: pointer; }
.post .reply { font-size: 12px; color: #767c82; padding: 2px 0; word-break: break-all; }
.empty { text-align: center; color: #8a9099; font-size: 13px; padding: 36px 0; }
.list-title h2 .avail-count { font-size: 12px; color: #24b47e; font-weight: 400; margin-left: 8px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
.toolbar .search {
	flex: 1 1 200px;
	min-width: 150px;
	box-sizing: border-box;
	padding: 10px 12px;
	font-size: 13px;
	font-family: inherit;
	border: 1px solid #e4e7ed;
	border-radius: 10px;
	outline: none;
	background: #fff;
	color: #333;
}
.toolbar .search:focus { border-color: #24b47e; box-shadow: 0 0 0 3px rgba(36,180,126,.12); }
.toolbar .tabs { display: flex; gap: 4px; padding: 3px; background: #f2f4f7; border-radius: 10px; }
.toolbar .tab {
	border: 0;
	background: transparent;
	color: #666;
	font-size: 12px;
	font-family: inherit;
	padding: 7px 12px;
	border-radius: 8px;
	cursor: pointer;
}
.toolbar .tab.active { background: #fff; color: #24b47e; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.list-actions { display: flex; gap: 8px; align-items: center; }
/* 记录按钮要放图标，去掉刷新按钮那条"预留两位数宽度"的 86px */
#recBtn { min-width: 70px; }

/* 本机记录弹窗 */
.rec-mask {
	position: fixed;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	z-index: 10005;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 16px;
	background: rgba(0, 0, 0, .42);
}
.rec-mask[hidden] { display: none; }
.rec-box {
	display: flex;
	flex-direction: column;
	width: 100%;
	max-width: 460px;
	max-height: 74vh;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 10px 34px rgba(0, 0, 0, .18);
	overflow: hidden;
	outline: none;
}
.rec-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.rec-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: #333; }
.rec-head h3 em { margin-left: 7px; font-size: 12px; font-style: normal; font-weight: 400; color: #9aa0a6; }
.rec-close {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 26px;
	height: 26px;
	padding: 0;
	border: 0;
	border-radius: 50%;
	background: transparent;
	color: #8b9196;
	cursor: pointer;
	font-family: inherit;
	transition: background .15s, color .15s;
}
.rec-close:hover { background: #f2f4f6; color: #24b47e; }
.rec-close:focus-visible,
.rec-tab:focus-visible,
.rec-again:focus-visible,
.rec-del:focus-visible { outline: 2px solid #24b47e; outline-offset: 2px; }
.rec-tabs { display: flex; gap: 6px; padding: 0 16px 10px; justify-content: center; }
.rec-tab {
	padding: 7px 14px;
	border: 0;
	border-radius: 16px;
	background: #f2f4f6;
	color: #666;
	font-size: 13px;
	font-family: inherit;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.rec-tab.active { background: #24b47e; color: #fff; }
.rec-list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px; }
.rec-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid #f0f2f4; }
.rec-item-main { flex: 1 1 auto; min-width: 0; }
.rec-code { font-size: 14px; font-weight: 600; color: #0e6b4a; word-break: break-all; line-height: 1.5; }
.rec-meta { margin-top: 3px; font-size: 11.5px; color: #9aa0a6; }
.rec-act { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.rec-again {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	padding: 5px 9px;
	border: 1px solid #24b47e;
	border-radius: 6px;
	background: transparent;
	color: #24b47e;
	font-size: 12px;
	font-family: inherit;
	white-space: nowrap;
	cursor: pointer;
	transition: background .15s;
}
.rec-again:hover { background: #e8f8f1; }
.rec-del {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 22px;
	height: 22px;
	padding: 0;
	border: 0;
	border-radius: 4px;
	background: transparent;
	color: #9aa0a6;
	cursor: pointer;
	transition: color .15s;
}
.rec-del:hover { color: #e05656; }
.rec-empty { padding: 26px 0; text-align: center; font-size: 13px; line-height: 1.8; color: #9aa0a6; }
.rec-foot { padding: 9px 16px 12px; border-top: 1px solid #f0f2f4; font-size: 11.5px; line-height: 1.6; color: #9aa0a6; text-align: center; }
.more-wrap { text-align: center; margin: 14px 0 6px; }
.btn-more {
	border: 1px solid #e4e7ed;
	background: #fff;
	color: #24b47e;
	font-size: 13px;
	font-family: inherit;
	padding: 9px 18px;
	border-radius: 10px;
	cursor: pointer;
	width: 100%;
	max-width: 320px;
}
.btn-more:disabled { color: #8a9099; cursor: default; }
/* 键盘与读屏：可点元素统一焦点描边，任何时候都能看出光标落在哪
   搜索框不在此列——输入框点进去就触发 focus-visible，描边会一直挂着像多套了一个框，
   改用边框变绿加一圈淡光晕 */
.toolbar .tab:focus-visible,
.btn-refresh:focus-visible,
.btn:focus-visible,
.btn-more:focus-visible { outline: 2px solid #24b47e; outline-offset: 2px; }
/* 触屏没有 hover，按下时轻微下沉，让点击有回应 */
.btn:active,
.btn-refresh:active,
.btn-more:active,
.toolbar .tab:active,
.pub-toggle:active { transform: translateY(1px); }
.more-info { font-size: 12px; color: #8a9099; margin-top: 8px; }
.group-title { font-size: 13px; color: #767c82; margin: 22px 0 10px; padding-left: 4px; }
.empty-avail {
	text-align: center;
	color: #8a9099;
	font-size: 13px;
	padding: 30px 0;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 1px 4px rgba(0,0,0,.06);
	margin-bottom: 12px;
}
@media screen and (max-width: 520px) {
	header h1 { font-size: 22px; }
	.card { padding: 16px 14px 18px; }
	.card.pub-card { padding: 0; }
	.post { gap: 8px; padding: 16px 14px; }
	.post .code { font-size: 16px; }
	.post .bottom-left { gap: 6px; }
	.post .btn-copy { padding: 10px 16px; }
	.btn { padding: 10px 22px; }
	.pub-toggle { padding: 12px 14px; }
	.pub-body { padding: 0 14px 16px; }
	/* 手机端：视觉尺寸保持紧凑，用透明热区把上下可点范围补到 44px，避免按钮整体变胖 */
	.btn-refresh, .post .btn-copy, .toolbar .tab { position: relative; }
	.btn-refresh::after,
	.post .btn-copy::after,
	.toolbar .tab::after {
		content: "";
		position: absolute;
		left: 0;
		right: 0;
		top: 50%;
		height: 44px;
		margin-top: -22px;
	}
}

/* ---------- 夜间模式（与主站同一套：cookie night=1 / body.io-black-mode） ---------- */
html.io-black-mode { color-scheme: dark; }
html.io-black-mode body {
	background-color: #1b1d1f;
	background-image: none;
	color: #c6c9cf;
}
html.io-black-mode header h1 { color: #e8eaed; }
html.io-black-mode header p { color: #8b9196; }
html.io-black-mode .card,
html.io-black-mode .post,
html.io-black-mode .empty-avail { background: #2c2e2f; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
html.io-black-mode .card h2,
html.io-black-mode .list-title h2 { color: #c6c9cf; }
html.io-black-mode .list-title h2 .avail-count { color: #4fc79b; }
html.io-black-mode .pub-toggle { color: #e8eaed; }
html.io-black-mode .pub-toggle-hint { color: #4fc79b; }
html.io-black-mode .pub-chev { color: #8b9196; }
html.io-black-mode .field label { color: #b4b9c0; }
html.io-black-mode .field label em { color: #7d8388; }
html.io-black-mode .field label .req { color: #f07b7b; }
html.io-black-mode input,
html.io-black-mode textarea,
html.io-black-mode select {
	background: #26282a;
	border-color: #3a3d40;
	color: #d5d8dc;
}
html.io-black-mode input::placeholder,
html.io-black-mode textarea::placeholder { color: #75797f; }
html.io-black-mode input:focus,
html.io-black-mode textarea:focus,
html.io-black-mode select:focus { border-color: #24b47e; background: #2c2f31; }
html.io-black-mode .at-display { background: #26282a; border-color: #3a3d40; color: #75797f; }
html.io-black-mode .at-wrap.has-value .at-display { color: #d5d8dc; }
html.io-black-mode .btn:disabled { background: #3a3d40; color: #75797f; }
html.io-black-mode .msg.ok { color: #5fd3a5; }
html.io-black-mode .msg.err { color: #f07b7b; }
html.io-black-mode .btn-refresh { color: #4fc79b; border-color: rgba(79,199,155,.5); }
html.io-black-mode .rf-spin { border-color: rgba(79,199,155,.28); border-top-color: #4fc79b; }

<body>
<div class="wrap">
	<header>
		<h1>互助分享</h1>
		<p>友善互助 · 分享快乐，点复制记录使用<br>发布内容公开可见，违规刷帖将被拉黑</p>

	<div class="card pub-card">
		<button class="pub-toggle" id="pubToggle" type="button" aria-expanded="false" aria-controls="pubBody">
			<span class="pub-toggle-text">发布我的</span>

		</button>
		<div class="pub-body" id="pubBody" hidden>
			<div class="field">
				<label><span class="req">*</span>内容<em>必填，互助码、活动页链接、分享内容</em></label>
				<input id="code" maxlength="200" placeholder="例如：88888888，或 https://example.com/act" autocomplete="off">
			</div>
			<div class="field-pair">
				<div class="field">
					<label>人数<em>选填，不限就留空</em></label>
					<input id="need" type="number" min="1" max="20" placeholder="如 3" autocomplete="off">
				</div>
				<div class="field">
					<label>有效期<em>不选就是长期有效</em></label>

						<input id="expAt" type="datetime-local" step="600">

				</div>
			</div>
			<div class="field">
				<label>说明<em>选填，限制条件、备注</em></label>

			<div class="field">

		</div>

<div class="rec-mask" id="recMask" hidden>
	<div class="rec-box" id="recBox" role="dialog" aria-modal="true" aria-label="我的记录" tabindex="-1">
		<div class="rec-head">
			<h3>我的记录<em>只存在这台设备</em></h3>
			<button class="rec-close" id="recClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
		</div>

<script>
(function () {
	'use strict';

	var API = 'https://comment.qnkjxx.top/api';
	var PAGE_PATH = '/huzhu/';
	var ARTICLE_PREFIX = '/huzhu/c/';
	var REFRESH_SECONDS = 9;
	var DAILY_LIMIT = 7;
	var DEFAULT_NICK = '匿名访客';
	var PAGE_SIZE = 30;
	var COUNT_BATCH = 50;
	var loadedPages = 1;
	var totalCount = 0;

	var listEl = document.getElementById('list');
	var pubMsg = document.getElementById('pubMsg');
	var publishBtn = document.getElementById('publish');
	var refreshBtn = document.getElementById('refresh');

	var refreshLeft = REFRESH_SECONDS;
	var refreshing = false;
	var refreshTimer = null;
	var lastSig = '';
	var busy = false;
	var allItems = [];
	var currentFilter = 'all';
	var keyword = '';
	var moreEl = document.getElementById('more');
	var loadMoreBtn = document.getElementById('loadMore');

	/* ---------- 工具函数 ---------- */
	function plainText(html) {
		return String(html == null ? '' : html)
			.replace(/<br\s*\/?>/gi, '\n')
			.replace(/<\/p>/gi, '\n')
			.replace(/<[^>]*>/g, '')
			.replace(/&nbsp;/gi, ' ')
			.replace(/&amp;/gi, '&')
			.replace(/&lt;/gi, '<')
			.replace(/&gt;/gi, '>')
			.replace(/&quot;/gi, '"')
			.replace(/&#39;/g, "'");
	}

	function parsePost(c) {
		var text = plainText(c.comment);
		var code = '';
		var desc = '';
		var link = '';
		var need = 1;
		var hours = 0;
		var until = 0;
		text.split('\n').forEach(function (raw) {
			var line = raw.trim();
			if (!line) return;
			var m;
			m = line.match(/^码[：:]\s*([\s\S]*)$/);
			if (m) { code += (code ? '\n' : '') + m[1]; return; }
			m = line.match(/^说明[：:]\s*([\s\S]*)$/);
			if (m) { desc += (desc ? '\n' : '') + m[1]; return; }
			m = line.match(/^链接[：:]\s*([\s\S]*)$/);
			if (m) { link = m[1].trim(); return; }
			m = line.match(/^人数[：:]\s*(不限|[0-9]+)/);
			if (m) {
				// "不限"是 0；老帖没写这行就沿用原来的默认 1，不改变历史行为
				if (m[1] === '不限') {
					need = 0;
				} else {
					need = parseInt(m[1], 10) || 1;
					if (need < 1) need = 1;
					if (need > 50) need = 50;
				}
				return;
			}
			// 直接写到期时间「2026-11-18 20:00」——发布时选的就是这一刻，不用再拿时长反推
			m = line.match(/^有效期[：:]\s*(\d{4})-(\d{1,2})-(\d{1,2})\s*(\d{1,2}):(\d{2})/);
			if (m) {
				until = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
				if (!until || isNaN(until)) until = 0;
				return;
			}
			// 单位带不带都认：写"小"按小时，其余按天（兼容更早只写数字的帖子）
			m = line.match(/^有效期[：:]\s*([0-9.]+)\s*(小\s*时|天)?/);
			if (m) {
				hours = parseFloat(m[1]) || 0;
				if (!(m[2] && m[2].indexOf('小') >= 0)) hours = hours * 24;
				if (hours < 0) hours = 0;
				if (hours > 8760) hours = 8760;
				return;
			}
			if (!code) code = line;
		});
		if (!code) code = text.trim();
		code = code.trim();
		// 有人不发码、直接把活动页链接当"码"填。这种帖子点"复制"只能拿到一串网址，还得自己粘到浏览器，
		// 所以这里认出来：整条内容就是一个链接（http(s):// 或 www. 开头、中间没空格、能过白名单），
		// 就把它当链接卡，按钮换成"打开"。判定和「链接：」字段互不影响——两个都填了就以显式链接为准，
		// 否则内容贴了网址、链接字段又重复填一遍，卡片会退回显示整条长网址，和只填内容时长得不一样。
		var codeLink = '';
		if (code && !/[\s"'<>]/.test(code) && /^(https?:\/\/|www\.)/i.test(code)) {
			codeLink = safeLink(code);
		}
		return { code: code, desc: desc.trim(), link: safeLink(link) || codeLink, need: need, hours: hours, until: until, codeLink: !!codeLink };
	}

	/* 一条帖子的状态。need=0 表示不限人数，永远不满；hours=0 且 until=0 表示长期有效，不判过期。
	   until 是发帖人直接选的到期时刻，按绝对值算；hours 是按"发布时刻 + 小时数"算，老帖走这条。
	   两者都用本机时间——各设备时钟有差，只影响显示，不影响数据。 */
	function postState(p, c, used) {
		var full = p.need > 0 && used >= p.need;
		var leftMs = 0;
		var expired = false;
		var endMs = p.until > 0 ? p.until : (p.hours > 0 ? (Number(c.time) || 0) + p.hours * 3600000 : 0);
		if (endMs > 0) {
			leftMs = endMs - Date.now();
			expired = leftMs <= 0;
		}
		return { full: full, expired: expired, done: full || expired, leftMs: leftMs };
	}

	/* 有效期徽标：长期不显示（默认状态，没必要每条都写）；不到一天按小时报，更准 */
	function expireLabel(p, st) {
		if (!p.hours && !p.until) return null;
		if (st.expired) return { text: '已过期', cls: 'over' };
		var h = st.leftMs / 3600000;
		if (h <= 24) return { text: '剩 ' + Math.max(1, Math.ceil(h)) + ' 小时', cls: 'warn' };
		// 一天多到两天之间仍按小时报——36 小时说成「2 天」会凭空多出半天
		if (h < 48) return { text: '剩 ' + Math.ceil(h) + ' 小时', cls: '' };
		// 四舍五入而不是向上取整：剩 7 天零半小时不该显示成 8 天
		return { text: '剩 ' + Math.round(h / 24) + ' 天', cls: '' };
	}

	/* 链接白名单：只放行 http/https，无协议时补 https，其余协议（javascript:、data: 等）一律丢弃 */
	function safeLink(raw) {
		var u = String(raw == null ? '' : raw).trim();
		if (!u) return '';
		if (/[\s"'<>]/.test(u)) return '';
		// 原始串里没有点，就不会是域名。必须放在补协议之前、对原文判断：
		// 纯数字码（291369100）补成 https://291369100 后，浏览器会把它规范化成十进制 IPv4
		// https://17.93.240.140/，hostname 里就有点了，下面那条检查拦不住
		if (u.indexOf('.') < 0) return '';
		if (/^[a-z][a-z0-9+.\-]*:/i.test(u) && !/^https?:\/\//i.test(u)) return '';
		if (!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
		try {
			var parsed = new URL(u);
			if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
			if (!parsed.hostname || parsed.hostname.indexOf('.') < 0) return '';
			return parsed.href;
		} catch (e) {
			return '';
		}
	}

	/* 链接行只显示域名，长地址不会撑破卡片 */
	function linkHost(u) {
		try {
			return new URL(u).hostname.replace(/^www\./i, '');
		} catch (e) {
			return u;
		}
	}

	function fmtTime(ts) {
		var d = new Date(Number(ts) || 0);
		if (!d.getTime()) return '';
		function p(n) { return n < 10 ? '0' + n : '' + n; }
		return (d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
	}

	function getSavedNick() {
		try { return localStorage.getItem('huzhu_nick') || ''; } catch (e) { return ''; }
	}
	function saveNick(n) {
		try { localStorage.setItem('huzhu_nick', n); } catch (e) {}
	}
	function clearNick() {
		try { localStorage.removeItem('huzhu_nick'); } catch (e) {}
	}

	// 匿名访客用随机占位邮箱（Waline 服务端要求 mail 字段）
	function guestMail() {
		return 'huzhu-' + String(Math.random()).slice(2, 10) + '@qnkjxx.top';
	}

	// 互助码 -> 哈希键。正常计数键就是评论自己的 objectId，这里只在评论缺 id 时兜底用
	function codeKey(code) {
		var h = 5381;
		for (var i = 0; i < code.length; i++) {
			h = ((h << 5) + h + code.charCodeAt(i)) >>> 0;
		}
		return h.toString(36);
	}

	// 本地已领取记录（浏览器本地防重复领取）
	function usedMap() {
		try { return JSON.parse(localStorage.getItem('huzhu_used') || '{}'); } catch (e) { return {}; }
	}
	function markUsed(key, p) {
		try {
			var m = usedMap();
			m[key] = Date.now();
			Object.keys(m).forEach(function (k) {
				if (Date.now() - m[k] > 86400000 * 30) delete m[k];
			});
			localStorage.setItem('huzhu_used', JSON.stringify(m));
		} catch (e) {}
		if (p) saveRecUsed(p);
	}
	function isUsed(key) {
		return !!usedMap()[key];
	}

	/* ---------- 本机记录：我发布的 / 用过的 ---------- */
	/* 只存 localStorage，不上传。记的是能回填的字段而不是纯文本，"再发"才有东西可填 */
	var REC_MINE_KEY = 'huzhu_rec_mine';
	var REC_USED_KEY = 'huzhu_rec_used';
	var REC_MAX = 20;
	var recTab = 'mine';

	function readRec(key) {
		try {
			var a = JSON.parse(localStorage.getItem(key) || '[]');
			return Array.isArray(a) ? a : [];
		} catch (e) { return []; }
	}
	function writeRec(key, arr) {
		try { localStorage.setItem(key, JSON.stringify(arr.slice(0, REC_MAX))); } catch (e) {}
	}
	/* 同一个码只留最近一次，否则同一活动反复发会把列表刷成一堆重复 */
	function pushRec(key, item) {
		if (!item || !item.code) return;
		var list = readRec(key).filter(function (x) { return x && x.code !== item.code; });
		list.unshift(item);
		writeRec(key, list);
	}
	function saveRecMine(code, desc, link, need, until) {
		pushRec(REC_MINE_KEY, {
			code: code,
			desc: desc || '',
			link: link || '',
			need: need || 0,
			until: until || 0,
			time: Date.now()
		});
	}
	function saveRecUsed(p) {
		pushRec(REC_USED_KEY, {
			code: p.code,
			desc: p.desc || '',
			link: p.link || '',
			need: p.need || 0,
			until: p.until || 0,
			time: Date.now()
		});
	}
	function recKeyOf(tab) {
		return tab === 'used' ? REC_USED_KEY : REC_MINE_KEY;
	}

	function todayKey() {
		var d = new Date();
		return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
	}
	function todayCount() {
		try {
			var obj = JSON.parse(localStorage.getItem('huzhu_daily') || '{}');
			return (obj[todayKey()] || []).length;
		} catch (e) { return 0; }
	}
	function addTodayCount() {
		try {
			var obj = JSON.parse(localStorage.getItem('huzhu_daily') || '{}');
			var k = todayKey();
			if (!obj[k]) obj[k] = [];
			obj[k].push(Date.now());
			Object.keys(obj).forEach(function (key) {
				if (key !== k && Array.isArray(obj[key]) && obj[key].length && Date.now() - new Date(key).getTime() > 86400000 * 3) {
					delete obj[key];
				}
			});
			localStorage.setItem('huzhu_daily', JSON.stringify(obj));
		} catch (e) {}
	}

	var msgTimer = null;
	function showMsg(text, isErr) {
		pubMsg.textContent = text;
		pubMsg.className = 'msg ' + (isErr ? 'err' : 'ok');
		if (msgTimer) clearTimeout(msgTimer);
		msgTimer = setTimeout(function () { pubMsg.textContent = ''; }, 8000);
	}

	/* ---------- 接口 ---------- */
	/* 拉取第 1..pages 页，返回 { posts, total }（total 为服务端总条数） */
	function fetchList(pages) {
		pages = Math.max(1, Math.floor(pages || 1));
		var jobs = [];
		var total = 0;
		for (var i = 1; i <= pages; i++) {
			(function (pageNo) {
				jobs.push(fetch(API + '/comment?path=' + PAGE_PATH + '&page=' + pageNo + '&pageSize=' + PAGE_SIZE)
					.then(function (r) {
						if (r.status !== 200) throw new Error('HTTP ' + r.status);
						return r.json();
					})
					.then(function (res) {
						if (res.errno !== 0) throw new Error(res.errmsg || '接口错误');
						if (res.data && typeof res.data.count === 'number') total = res.data.count;
						return (res.data && res.data.data) || [];
					}));
			})(i);
		}
		return Promise.all(jobs).then(function (lists) {
			var out = [];
			lists.forEach(function (l) { out = out.concat(l); });
			return { posts: out, total: total };
		});
	}

	function sendComment(payload) {
		payload.mail = payload.mail || guestMail();
		if (payload.link == null) payload.link = '';
		return fetch(API + '/comment', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(payload)
		}).then(function (r) { return r.json(); });
	}

	// 批量读取计数：/article?path=p1,p2,... 返回与 path 顺序对应的 [{time:n}]（按 50 条分批，避免 URL 过长）
	function fetchCounts(paths) {
		if (!paths.length) return Promise.resolve([]);
		var batches = [];
		for (var i = 0; i < paths.length; i += COUNT_BATCH) {
			batches.push(paths.slice(i, i + COUNT_BATCH));
		}
		return Promise.all(batches.map(function (batch) {
			return fetch(API + '/article?path=' + batch.join(','))
				.then(function (r) { return r.json(); })
				.then(function (res) {
					if (res.errno !== 0) throw new Error(res.errmsg || '计数接口错误');
					return (res.data || []).map(function (it) { return Number(it && it.time) || 0; });
				});
		})).then(function (lists) {
			var out = [];
			lists.forEach(function (l) { out = out.concat(l); });
			return out;
		});
	}

	// 计数 +1：不产生评论，不发邮件，也不触发评论发布限速
	function incrCount(path) {
		return fetch(API + '/article', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ path: path })
		}).then(function (r) { return r.json(); });
	}

	/* ---------- 渲染 ---------- */
	function clearList() {
		while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
	}
	function showEmpty(text) {
		clearList();
		var d = document.createElement('div');
		d.className = 'empty';
		d.textContent = text;
		listEl.appendChild(d);
	}

	// 说明默认 2 行，超出部分改为"…展开"接在文字末尾，不额外占行、不遮挡文字
	function clampDesc(wrap, el, text) {
		el.textContent = text;
		wrap.classList.remove('more');
		var lh = parseFloat(getComputedStyle(el).lineHeight) || 20.8;
		var maxH = lh + 1;
		if (el.scrollHeight <= maxH) return;
		var tail = '…展开';
		var lo = 0, hi = text.length;
		while (lo < hi) {
			var mid = Math.ceil((lo + hi) / 2);
			el.textContent = text.slice(0, mid) + tail;
			if (el.scrollHeight > maxH) { hi = mid - 1; } else { lo = mid; }
		}
		el.textContent = text.slice(0, lo);
		var sp = document.createElement('span');
		sp.className = 'desc-more';
		sp.textContent = tail;
		el.appendChild(sp);
		wrap.classList.add('more');
		wrap.title = '点击展开完整说明';
	}
	var rzTimer;
	window.addEventListener('resize', function () {
		clearTimeout(rzTimer);
		rzTimer = setTimeout(function () {
			var list = document.querySelectorAll('.desc-wrap[data-full]');
			for (var i = 0; i < list.length; i++) {
				var w = list[i], el = w.querySelector('.desc');
				if (!el) continue;
				if (w.classList.contains('open')) { el.textContent = w.dataset.full; continue; }
				clampDesc(w, el, w.dataset.full);
			}
		}, 200);
	});

	function renderPost(c, p, used) {
		var st = postState(p, c, used);
		var full = st.full;
		var mine = isUsed(p.key);
		var replies = (c.children || []).filter(function (r) {
			return plainText(r.comment).indexOf('已使用') < 0;
		});

		var post = document.createElement('div');
		post.className = 'post' + (st.done ? ' done' : '');
		var main = document.createElement('div');
		main.className = 'post-main';

		var codeEl = document.createElement('div');
		codeEl.className = 'code';
		// 链接卡不显示那一长串网址（会撑破卡片），改显示域名；想看清具体地址，按钮打开就是那一页
		codeEl.textContent = p.codeLink ? linkHost(p.link) : (p.code || '(无内容)');
		main.appendChild(codeEl);

		if (p.desc) {
			var descWrap = document.createElement('div');
			descWrap.className = 'desc-wrap';
			var descEl = document.createElement('div');
			descEl.className = 'desc';
			descWrap.appendChild(descEl);
			main.appendChild(descWrap);
			descWrap.dataset.full = p.desc;
			// 默认只显示 1 行：说明长短不一时卡片高度会参差，统一一行才排得整齐；超出时末尾接"…展开"，点整块展开/收起
			setTimeout(function () { clampDesc(descWrap, descEl, p.desc); }, 0);
			descWrap.addEventListener('click', function () {
				if (!descWrap.classList.contains('more')) return;
				if (descWrap.classList.contains('open')) {
					descWrap.classList.remove('open');
					clampDesc(descWrap, descEl, p.desc);
				} else {
					descWrap.classList.add('open');
					descEl.textContent = p.desc;
					descWrap.title = '点击收起说明';
				}
			});
		}

		// 链接卡不重复挂链接行：它的按钮就是"打开"，再挂一行等于同一个入口写两遍
		if (p.link && !p.codeLink) {
			var linkEl = document.createElement('a');
			linkEl.className = 'post-link';
			linkEl.href = p.link;
			linkEl.target = '_blank';
			linkEl.rel = 'noopener noreferrer';
			linkEl.title = '打开 ' + p.link;
			// 这一行本来就能点开，但看不出来能点。右侧补一个显式标记；
			// 可用的帖子点它和点按钮一样计数，已满/过期的就直接开、不计数
			if (!st.full && !st.expired) {
				linkEl.classList.add('can-go');
				linkEl.addEventListener('click', function (e) {
					e.preventDefault();
					e.stopPropagation();
					handleOpen(p, null);
				});
			} else {
				linkEl.addEventListener('click', function (e) { e.stopPropagation(); });
			}

			var lkIco = document.createElement('span');
			lkIco.className = 'lk-ico';
			lkIco.textContent = '🔗';

			var lkHost = document.createElement('span');
			lkHost.className = 'lk-host';
			lkHost.textContent = linkHost(p.link);

			var lkGo = document.createElement('span');
			lkGo.className = 'lk-go';
			lkGo.textContent = '打开 ↗';

			linkEl.appendChild(lkIco);
			linkEl.appendChild(lkHost);
			linkEl.appendChild(lkGo);
			main.appendChild(linkEl);
		}

		var bottom = document.createElement('div');
		bottom.className = 'bottom';

		var left = document.createElement('div');
		left.className = 'bottom-left';

		var prog = document.createElement('div');
		prog.className = 'progress' + (full ? ' full' : (st.expired ? ' muted' : ''));
		// 不限人数的帖子不该出现"进度 0/1"：那个 1 是必填项的默认值，不是"只够一个人"，写出来反而误导
		if (p.need > 0) {
			prog.textContent = '进度 ' + used + '/' + p.need + (full ? '（已满）' : '');
		} else {
			prog.textContent = used > 0 ? ('已领 ' + used + ' 次') : '不限人数';
		}
		left.appendChild(prog);

		var ep = expireLabel(p, st);
		if (ep) {
			var epEl = document.createElement('span');
			epEl.className = 'expire' + (ep.cls ? ' ' + ep.cls : '');
			epEl.textContent = ep.text;
			if (st.expired) epEl.title = '已超过有效期，内容仍可复制';
			left.appendChild(epEl);
		}

		var nickName = c.nick || DEFAULT_NICK;
		var meta = document.createElement('span');
		meta.className = 'meta';
		meta.title = nickName + ' · ' + fmtTime(c.time);
		var nickEl = document.createElement('span');
		nickEl.className = 'nick';
		// 前面补一个点：进度、有效期徽标、昵称挨着排，不隔开容易被读成一串
		nickEl.textContent = '· ' + nickName;
		var timeEl = document.createElement('span');
		timeEl.className = 'time';
		timeEl.textContent = ' · ' + fmtTime(c.time);
		meta.appendChild(nickEl);
		meta.appendChild(timeEl);
		left.appendChild(meta);

		bottom.appendChild(left);
		main.appendChild(bottom);

		var side = document.createElement('div');
		side.className = 'post-side';

		var copyBtn = document.createElement('button');
		copyBtn.className = 'btn btn-copy' + (st.done ? ' full' : '');
		copyBtn.type = 'button';
		// 链接卡按钮写"打开"：这类帖子的意图就是去活动页，让人再自己粘网址是多余的
		var isLinkCard = !!p.codeLink;
		// 过期优先于已满：活动都结束了，"已满"没什么意义。都写两个字，宽度才能和复制卡齐平
		// 链接卡排在"已领取"前面：它是跳转入口，不是一次性领取，进过几次都该能再进
		copyBtn.textContent = st.expired ? '过期' : (full ? '已满' : (isLinkCard ? '打开' : (mine ? '已领取' : '复制')));
		if (st.expired) {
			// 过期不等于内容作废，有些活动页还开着，照样给
			copyBtn.title = '该活动已过期，内容仍可复制';
			copyBtn.addEventListener('click', function () { copyOnly(p, copyBtn); });
		} else if (full) {
			// 已满的码照给：need 是发布者自己填的，填多填少都常见，锁死会让剩余名额白废
			copyBtn.title = isLinkCard ? '该团已满，仍可取链接' : '该团已满，仍可取码';
			copyBtn.addEventListener('click', function () { copyOnly(p, copyBtn); });
		} else if (isLinkCard) {
			copyBtn.title = '直接打开活动页，同时记为已使用';
			copyBtn.addEventListener('click', function () { handleOpen(p, copyBtn); });
		} else if (mine) {
			// 本机领过：可以再看一眼码，但不再重复计数
			copyBtn.title = '你已领取过，可再次复制查看';
			copyBtn.addEventListener('click', function () { copyOnly(p, copyBtn); });
		} else {
			copyBtn.title = p.link ? '复制码，活动页在卡片上点开' : '复制码';
			copyBtn.addEventListener('click', function () { handleCopy(p, copyBtn); });
		}
		side.appendChild(copyBtn);
		post.appendChild(main);
		post.appendChild(side);

		if (replies.length) {
			var wrap = document.createElement('div');
			wrap.className = 'replies';
			replies.forEach(function (r) {
				var line = document.createElement('div');
				line.className = 'reply';
				line.textContent = (r.nick || DEFAULT_NICK) + '：' + plainText(r.comment).replace(/\s*\n\s*/g, ' ');
				wrap.appendChild(line);
			});
			main.appendChild(wrap);
		}
		return post;
	}

	function updateAvail(n) {
		var el = document.getElementById('avail');
		if (el) el.textContent = '可用 ' + n + ' 个';
	}

	/* 底部"加载更多 / 已显示全部"状态 */
	function updateMore() {
		if (!moreEl || !loadMoreBtn) return;
		var info = document.getElementById('moreInfo');
		if (!totalCount || !allItems.length) {
			moreEl.style.display = 'none';
			if (info) info.textContent = '';
			return;
		}
		moreEl.style.display = 'block';
		if (allItems.length >= totalCount) {
			loadMoreBtn.style.display = 'none';
			loadMoreBtn.disabled = false;
			if (info) info.textContent = '已显示全部 ' + totalCount + ' 条';
		} else {
			loadMoreBtn.style.display = '';
			loadMoreBtn.disabled = false;
			loadMoreBtn.textContent = '加载更多（已显示 ' + allItems.length + ' / 共 ' + totalCount + ' 条）';
			if (info) info.textContent = '';
		}
	}

	function render(items, filter, isEmptyAll) {
		clearList();
		if (!items || !items.length) {
			showEmpty(isEmptyAll ? '还没有互助帖，来发第一条吧' : '没有匹配的互助帖');
			if (isEmptyAll) updateAvail(0);
			return;
		}

		var avail = [];
		var done = [];
		items.forEach(function (it) {
			if (postState(it.p, it.c, it.used).done) done.push(it);
			else avail.push(it);
		});

		if (filter !== 'done' && !avail.length) {
			var tip = document.createElement('div');
			tip.className = 'empty-avail';
			tip.textContent = '暂无可用互助';
			listEl.appendChild(tip);
		} else {
			avail.forEach(function (it) { listEl.appendChild(renderPost(it.c, it.p, it.used)); });
		}

		if (done.length) {
			var divider = document.createElement('div');
			divider.className = 'group-title';
			divider.textContent = '已完成 · ' + done.length + ' 条';
			listEl.appendChild(divider);
			done.forEach(function (it) { listEl.appendChild(renderPost(it.c, it.p, it.used)); });
		}
	}

	/* 按"状态 tab + 搜索词"过滤后重绘 */
	function applyFilter() {
		var items = allItems;
		if (currentFilter === 'avail') {
			items = items.filter(function (it) { return !postState(it.p, it.c, it.used).done; });
		} else if (currentFilter === 'done') {
			items = items.filter(function (it) { return postState(it.p, it.c, it.used).done; });
		}
		var kw = keyword.trim().toLowerCase();
		if (kw) {
			items = items.filter(function (it) {
				return ((it.p.code || '') + ' ' + (it.p.desc || '') + ' ' + (it.p.link || '') + ' ' + (it.c.nick || '')).toLowerCase().indexOf(kw) >= 0;
			});
		}
		render(items, currentFilter, allItems.length === 0 && kw === '');
	}

	function loadList(silent) {
		if (silent && busy) return Promise.resolve();
		return fetchList(loadedPages).then(function (result) {
			var posts = result.posts;
			totalCount = result.total;
			var items = posts.map(function (c) {
				var p = parsePost(c);
				// 计数键用评论自己的 objectId，不再拿内容哈希：哈希会把"同一个码发两次"的两条帖子并成一条，
				// 计数和"已领取"都串味。objectId 缺失时才退回哈希
				var oid = c.objectId;
				p.key = (oid === undefined || oid === null || oid === '') ? codeKey(p.code) : String(oid);
				p.path = ARTICLE_PREFIX + p.key + '/';
				return { c: c, p: p, used: 0 };
			});
			if (!items.length) {
				allItems = [];
				updateAvail(0);
				updateMore();
				if (silent && lastSig === '') return;
				lastSig = '';
				applyFilter();
				return;
			}
			var paths = items.map(function (it) { return it.p.path; });
			return fetchCounts(paths).then(function (counts) {
				items.forEach(function (it, i) { it.used = counts[i] || 0; });
				// 排序：可用（未满且没过期）在前，其余沉底；同组内按发布时间倒序
				items.sort(function (a, b) {
					var fa = postState(a.p, a.c, a.used).done ? 1 : 0;
					var fb = postState(b.p, b.c, b.used).done ? 1 : 0;
					if (fa !== fb) return fa - fb;
					return (Number(b.c.time) || 0) - (Number(a.c.time) || 0);
				});
				allItems = items;
				updateAvail(items.filter(function (it) { return !postState(it.p, it.c, it.used).done; }).length);
				updateMore();
				// 静默刷新时数据没变化就不重绘，避免列表闪动；过期状态也算进签名，跨过到期点才能重绘
				var sig = items.map(function (it) {
					var st = postState(it.p, it.c, it.used);
					return it.c.objectId + ':' + it.used + ':' + it.p.need + ':' + it.p.hours + ':' + it.p.until + ':' + (st.expired ? 1 : 0) + ':' + it.c.time + ':' + it.c.nick;
				}).join('|');
				if (silent && sig === lastSig) return;
				lastSig = sig;
				applyFilter();
			});
		}).catch(function (err) {
			if (silent) return;
			showEmpty('列表加载失败：' + err.message + '（本地预览会被安全域名拦截，请在线上站点使用）');
		});
	}

	/* ---------- 自动刷新（与参考站一致的 9 秒） ---------- */
	/* 参考站的做法：倒数到 0 时按钮变成「转圈 + 刷新中」并锁住点击，请求回来才恢复倒计时。
	   这里同样走一遍，避免 1 秒直接跳回 9 秒、用户看不出到底刷没刷。 */
	/* 常态是「循环箭头 + 剩余秒数」，跟左边「记录」的时钟图标同一套线条风格 */
	var ICON_RF = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20.8 12a8.8 8.8 0 1 1-2.6-6.2"/><path d="M20.8 4.2v4.2h-4.2"/></svg>';
	function updateRefreshBtn() {
		if (!refreshBtn) return;
		if (refreshing) {
			// 每秒都会调到这里，已经处于刷新态就不再重设，否则转圈动画会被重置成一卡一卡
			if (!refreshBtn.classList.contains('is-refreshing')) {
				refreshBtn.classList.add('is-refreshing');
				refreshBtn.innerHTML = '<span class="rf-spin"></span>刷新中';
			}
			return;
		}
		if (refreshBtn.classList.contains('is-refreshing')) {
			refreshBtn.classList.remove('is-refreshing');
		}
		refreshBtn.innerHTML = ICON_RF + refreshLeft + 's';
	}
	function endRefresh() {
		refreshing = false;
		refreshLeft = REFRESH_SECONDS;
		updateRefreshBtn();
	}
	function doRefresh() {
		if (refreshing) return;
		refreshing = true;
		updateRefreshBtn();
		loadList(false).then(endRefresh, endRefresh);
	}
	function startAutoRefresh() {
		refreshLeft = REFRESH_SECONDS;
		updateRefreshBtn();
		if (refreshTimer) clearInterval(refreshTimer);
		refreshTimer = setInterval(function () {
			if (document.hidden) return;
			if (refreshing) return;
			refreshLeft--;
			if (refreshLeft < 0) refreshLeft = 0;
			updateRefreshBtn();
			if (refreshLeft <= 0) {
				doRefresh();
			}
		}, 1000);
	}

	/* ---------- 复制 + 使用计数 ---------- */
	function copyText(text) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			return navigator.clipboard.writeText(text);
		}
		return new Promise(function (resolve, reject) {
			var ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.top = '-999px';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			try {
				var ok = document.execCommand('copy');
				document.body.removeChild(ta);
				if (ok) resolve();
				else reject(new Error('复制失败'));
			} catch (e) {
				document.body.removeChild(ta);
				reject(e);
			}
		});
	}

	function handleCopy(p, btn) {
		if (btn.disabled || busy) return;
		busy = true;
		var label = btn.textContent;
		btn.disabled = true;
		btn.textContent = '复制中…';
		copyText(p.code).then(function () {
			btn.textContent = '已复制';
			return incrCount(p.path);
		}).then(function (res) {
			if (!res || res.errno !== 0) throw new Error((res && res.errmsg) || '计数失败');
			markUsed(p.key, p);
			busy = false;
			doRefresh();
		}).catch(function (err) {
			busy = false;
			btn.disabled = false;
			btn.textContent = label;
			showMsg('复制或计数失败：' + err.message, true);
		});
	}

	/* 内容是网址的帖子：点"打开"直接去活动页，不复制（复制也没意义，整条内容就是那个网址）。
	   window.open 必须留在点击回调的同步段里，挪进 Promise 里会被浏览器当广告拦掉。 */
	function handleOpen(p, btn) {
		// btn 可以为空：链接行上的「打开」也走这里，那时没有按钮要改文案
		if (busy) return;
		if (btn && btn.disabled) return;
		busy = true;
		if (btn) {
			btn.disabled = true;
			btn.textContent = '打开中…';
		}
		try { window.open(p.link, '_blank', 'noopener'); } catch (e) {}
		incrCount(p.path).then(function (res) {
			if (!res || res.errno !== 0) throw new Error((res && res.errmsg) || '计数失败');
			markUsed(p.key, p);
			busy = false;
			if (btn) btn.textContent = '已打开';
			doRefresh();
		}).catch(function (err) {
			busy = false;
			if (btn) {
				btn.disabled = false;
				btn.textContent = '打开';
			}
			showMsg('打开或计数失败：' + err.message, true);
		});
	}

	/* 已满 / 本机已领过的码：只复制，不计数。计数再加也没意义，反而会刷出 6/5 这种进度 */
	function copyOnly(p, btn) {
		if (btn.copied) return;
		btn.copied = true;
		var label = btn.textContent;
		copyText(p.code).then(function () {
			btn.textContent = '已复制';
		}, function () {
			btn.textContent = '复制失败';
		}).then(function () {
			setTimeout(function () {
				btn.textContent = label;
				btn.copied = false;
			}, 1400);
		});
	}

	/* ---------- 发布 ---------- */
	function handlePublish() {
		var code = (document.getElementById('code').value || '').trim();
		var needRaw = (document.getElementById('need').value || '').trim();
		var need = needRaw === '' ? 0 : parseInt(needRaw, 10);
		// 有效期就是「到期时间」：选到哪一刻，哪一刻失效；不选就是不限时
		var until = 0;
		var atRaw = document.getElementById('expAt').value;
		if (atRaw) {
			// datetime-local 给的是 "2026-11-18T20:00"，全用数字构造，避开各浏览器的解析差异
			var am = atRaw.match(/(\d{4})-(\d{1,2})-(\d{1,2})T(\d{1,2}):(\d{2})/);
			if (!am) { showMsg('到期时间格式不正确，请重新选择', true); return; }
			until = new Date(+am[1], +am[2] - 1, +am[3], +am[4], +am[5]).getTime();
			if (!until || until <= Date.now()) { showMsg('到期时间要晚于当前时间', true); return; }
		}
		var desc = (document.getElementById('desc').value || '').trim();
		var linkRaw = (document.getElementById('link').value || '').trim();
		var nick = (document.getElementById('nick').value || '').trim();
		var link = safeLink(linkRaw);

		if (!code) { showMsg('请先填写互助码 / 内容', true); return; }
		// 留空就是不限人数；填了就必须是有效数字，0 和负数不认
		if (needRaw !== '' && (!need || need < 1)) { showMsg('人数留空表示不限，要填请写 1~20', true); return; }
		if (need > 20) need = 20;
		if (linkRaw && !link) { showMsg('链接格式不对，请填 http 或 https 开头的地址', true); return; }

		if (todayCount() >= DAILY_LIMIT) {
			showMsg('今天的发布额度（' + DAILY_LIMIT + ' 条）已用完，明天再来', true);
			return;
		}

		// 长期有效（hours=0 且 until=0）就不写这一行，老帖和新帖的格式差别越小越好
		// 指定的到期时间直接写成「2026-11-20 18:00」；按时长的写「6小时」「7天」，别人看评论原文也能一眼看懂
		var expText = '';
		if (until > 0) {
			var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
			var ed = new Date(until);
			expText = ed.getFullYear() + '-' + pad2(ed.getMonth() + 1) + '-' + pad2(ed.getDate()) +
				' ' + pad2(ed.getHours()) + ':' + pad2(ed.getMinutes());
		}
		var body = '码：' + code + '\n说明：' + desc + (link ? '\n链接：' + link : '') +
			'\n人数：' + (need > 0 ? need : '不限') + (expText ? '\n有效期：' + expText : '');

		publishBtn.disabled = true;
		publishBtn.textContent = '发布中…';
		sendComment({
			comment: body,
			nick: nick || DEFAULT_NICK,
			url: PAGE_PATH,
			ua: navigator.userAgent
		}).then(function (res) {
			if (res && res.errno === 0) {
				if (nick) { saveNick(nick); } else { clearNick(); }
				addTodayCount();
				// 存一份本机记录，过期后能一键把说明和链接带回表单
				saveRecMine(code, desc, link, need, until);
				document.getElementById('code').value = '';
				document.getElementById('desc').value = '';
				document.getElementById('link').value = '';
				document.getElementById('need').value = '';
				document.getElementById('expAt').value = '';
				// 清空真控件后要把显示层一起复位，否则格子上还留着上一次选的日期
				syncAt();
				showMsg('发布成功，已显示在下方列表', false);
				doRefresh();
			} else {
				throw new Error((res && res.errmsg) || '发布失败');
			}
		}).catch(function (err) {
			showMsg('发布失败：' + err.message + '（本地预览会被安全域名拦截，请在线上站点使用）', true);
		}).finally(function () {
			publishBtn.disabled = false;
			publishBtn.textContent = '发布';
		});
	}

	/* ---------- 初始化 ---------- */
	var pubToggle = document.getElementById('pubToggle');
	var pubBody = document.getElementById('pubBody');
	var pubToggleHint = document.getElementById('pubToggleHint');

	/* 展开/收起发布区：展开后自动跳到"互助码"输入框，收起时输入内容保留 */
	function setPubOpen(open) {
		if (!pubBody) return;
		pubBody.hidden = !open;
		if (pubToggle) pubToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
		if (pubToggleHint) pubToggleHint.textContent = open ? '点击收起' : '点击展开';
		if (open) {
			var codeEl = document.getElementById('code');
			if (codeEl) codeEl.focus();
		}
	}

	/* ---------- 记录面板 ---------- */
	var recMask = document.getElementById('recMask');
	var recListEl = document.getElementById('recList');
	var recTabsEl = document.getElementById('recTabs');
	var recBtn2 = document.getElementById('recBtn');
	var recCloseBtn = document.getElementById('recClose');
	var recBox = document.getElementById('recBox');
	var ICON_AGAIN = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a8.8 8.8 0 1 1-2.6-6.2"/><path d="M21 4.2v4.2h-4.2"/></svg>';
	var ICON_DEL = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';

	function renderRec() {
		if (!recListEl) return;
		var tabs = recTabsEl ? recTabsEl.querySelectorAll('.rec-tab') : [];
		for (var i = 0; i < tabs.length; i++) {
			if (tabs[i].getAttribute('data-rec') === recTab) tabs[i].classList.add('active');
			else tabs[i].classList.remove('active');
		}
		var list = readRec(recKeyOf(recTab));
		recListEl.innerHTML = '';
		if (!list.length) {
			var empty = document.createElement('div');
			empty.className = 'rec-empty';
			empty.textContent = recTab === 'mine'
				? '还没有发布记录'
				: '还没有使用记录';
			recListEl.appendChild(empty);
			return;
		}
		list.forEach(function (it) {
			var row = document.createElement('div');
			row.className = 'rec-item';

			var main = document.createElement('div');
			main.className = 'rec-item-main';

			var codeEl = document.createElement('div');
			codeEl.className = 'rec-code';
			codeEl.textContent = it.code;
			// 说明不铺在列表里，鼠标停一下能看到就够了——密度照参考站，一条两行
			var tip = it.desc || '';
			if (it.until && it.until <= Date.now()) tip = (tip ? tip + '｜' : '') + '上一期的到期时间已过';
			if (tip) codeEl.title = tip;
			main.appendChild(codeEl);

			var meta = document.createElement('div');
			meta.className = 'rec-meta';
			var bits = [fmtTime(it.time)];
			if (it.link) bits.push(linkHost(it.link));
			// 上一期的到期时间过了就标出来，提醒"再发"要重选时间
			if (it.until) bits.push(it.until <= Date.now() ? '上期已过期' : '到期 ' + fmtTime(it.until));
			meta.textContent = bits.join(' · ');
			main.appendChild(meta);

			var act = document.createElement('div');
			act.className = 'rec-act';

			if (recTab === 'mine') {
				var again = document.createElement('button');
				again.type = 'button';
				again.className = 'rec-again';
				again.title = '把说明、链接、人数带回发布表单';
				again.innerHTML = ICON_AGAIN + '再发';
				again.addEventListener('click', function () { refillRec(it); });
				act.appendChild(again);
			}

			var del = document.createElement('button');
			del.type = 'button';
			del.className = 'rec-del';
			del.title = '删除这条记录';
			del.innerHTML = ICON_DEL;
			del.addEventListener('click', function () {
				var key = recKeyOf(recTab);
				var arr = readRec(key).filter(function (x) { return x && x.code !== it.code; });
				writeRec(key, arr);
				renderRec();
			});
			act.appendChild(del);

			row.appendChild(main);
			row.appendChild(act);
			recListEl.appendChild(row);
		});
	}

	function openRec() {
		if (!recMask) return;
		recTab = 'mine';
		renderRec();
		toggleChat(false);
		recMask.hidden = false;
		// 焦点落在弹窗本身而不是关闭按钮上，否则一打开就顶着一圈焦点框
		if (recBox) recBox.focus();
	}
	function closeRec(focusBack) {
		if (!recMask) return;
		recMask.hidden = true;
		toggleChat(true);
		if (focusBack !== false && recBtn2) recBtn2.focus();
	}

	/* 底部那个第三方聊天窗的 z-index 压不住（它自带 10001，还盖在遮罩之上），
	   打开记录时先把它收起来，关掉再放出来，免得挡住弹窗下沿 */
	function toggleChat(show) {
		var c = document.getElementById('ctrm_');
		if (!c) return;
		c.style.display = show ? '' : 'none';
	}

	/* 再发：说明、链接、人数照搬；码和有效期留空——码是这一期的新码，到期时间要重选 */
	function refillRec(it) {
		var codeUrl = (it.code && !/\s/.test(it.code)) ? safeLink(it.code) : '';
		closeRec(false);
		document.getElementById('code').value = codeUrl || '';
		document.getElementById('desc').value = it.desc || '';
		document.getElementById('link').value = it.link || '';
		document.getElementById('need').value = it.need ? String(it.need) : '';
		document.getElementById('expAt').value = '';
		// 清空真控件后要复位显示层，否则格子上还留着上一次的日期
		syncAt();
		setPubOpen(true);
		showMsg(codeUrl ? '已带回上次的内容，改成这一期的就能发' : '说明和链接已填好，填个新码就能发', false);
		var codeEl = document.getElementById('code');
		if (codeEl) {
			codeEl.focus();
			setTimeout(function () {
				if (codeEl.scrollIntoView) codeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
			}, 120);
		}
	}

	if (recBtn2) recBtn2.addEventListener('click', openRec);
	if (recCloseBtn) recCloseBtn.addEventListener('click', closeRec);
	if (recMask) {
		recMask.addEventListener('click', function (e) {
			if (e.target === recMask) closeRec();
		});
	}
	if (recTabsEl) {
		recTabsEl.addEventListener('click', function (e) {
			var t = e.target;
			var tab = t && t.getAttribute ? t.getAttribute('data-rec') : '';
			if (!tab || tab === recTab) return;
			recTab = tab;
			renderRec();
		});
	}
	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape' && recMask && !recMask.hidden) closeRec();
	});

	if (pubToggle) {
		pubToggle.addEventListener('click', function () {
			setPubOpen(!!pubBody && pubBody.hidden);
		});
	}

	var nickInput = document.getElementById('nick');
	if (nickInput) {
		nickInput.value = getSavedNick();
		// 输入完（离开输入框）就记住昵称，不必等到发布成功
		nickInput.addEventListener('change', function () {
			var v = (nickInput.value || '').trim();
			if (v) saveNick(v);
		});
	}
	publishBtn.addEventListener('click', handlePublish);
	refreshBtn.addEventListener('click', function () {
		doRefresh();
	});

	var searchInput = document.getElementById('search');
	if (searchInput) {
		searchInput.addEventListener('input', function () {
			keyword = searchInput.value || '';
			applyFilter();
		});
	}
	var tabsEl = document.getElementById('tabs');
	if (tabsEl) {
		tabsEl.addEventListener('click', function (e) {
			var t = e.target;
			var f = t && t.getAttribute ? t.getAttribute('data-filter') : '';
			if (!f) return;
			currentFilter = f;
			Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (b) {
				b.classList.toggle('active', b === t);
			});
			applyFilter();
		});
	}

	if (loadMoreBtn) {
		loadMoreBtn.addEventListener('click', function () {
			if (loadMoreBtn.disabled) return;
			loadMoreBtn.disabled = true;
			loadMoreBtn.textContent = '加载中…';
			loadedPages++;
			loadList(false).then(function () {
				loadMoreBtn.disabled = false;
				updateMore();
			});
		});
	}

	// 到期时间：点一下就直接弹选择器，不用在框里敲数字；选完把值写到底层文字上
	var expAt = document.getElementById('expAt');
	var atWrap = document.getElementById('atWrap');
	var atDisplay = document.getElementById('atDisplay');
	if (expAt) {
		var pad = function (n) { return (n < 10 ? '0' : '') + n; };
		var now2 = new Date();
		expAt.min = now2.getFullYear() + '-' + pad(now2.getMonth() + 1) + '-' + pad(now2.getDate()) +
			'T' + pad(now2.getHours()) + ':' + pad(now2.getMinutes());
		var syncAt = function () {
			var v = expAt.value;
			if (atWrap) atWrap.classList.toggle('has-value', !!v);
			if (!atDisplay) return;
			if (!v) { atDisplay.textContent = '选择到期时间'; return; }
			// 把 "2026-11-20T18:30" 换成和评论里一致的写法，读起来跟列表徽标同一套
			var d = new Date(('' + v).replace('T', ' ').replace(/-/g, '/'));
			if (isNaN(d.getTime())) { atDisplay.textContent = String(v).replace('T', ' '); return; }
			atDisplay.textContent = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
				' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
		};
		expAt.addEventListener('change', syncAt);
		expAt.addEventListener('input', syncAt);
		// 点哪儿都弹系统选择器，免得先聚焦再逐个选段落。
		// 触屏设备本来就是点一下自动弹；程序化再调一次会让 iOS 首帧滚轮定位算歪（先偏左、一拨才回中间），所以只在桌面调
		expAt.addEventListener('click', function () {
			if (typeof expAt.showPicker !== 'function') return;
			if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
			try { expAt.showPicker(); } catch (e) {}
		});
		syncAt();
	}

	loadList(false);
	startAutoRefresh();
})();
</script>
</body>

  }  

  // 当DOM加载完成后开始检查

          });  

          // 获取所有类名为ctrm-dialog-item的div

      // 每隔500毫秒执行一次checkAndRemoveBadContent函数
